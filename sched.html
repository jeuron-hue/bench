      // the bar's apparent start slides later as the grid scrolls right, and it never shows its
      // true start at any scroll position. Clamped, it scrolls off the left like any other bar.
      const clipL = s < W.start;
      const s0 = clipL ? W.start : s;
      const top = ROW_PAD + b._lane*LANE_H;
      // Only absences keep a category class. Campaigns and bookings take their product's hue
      // now, exactly like tasks: .bar.ms and .bar.bk are gone and milestones.colour is unread.
      const cls = (b.category === 'absence' ? 'ab' : b.category === 'maintenance' ? 'mnt' : '')
                + (b.texture === 'outline' ? ' out' : b.texture === 'faded' ? ' fade' : '')
                + (b.cancelled ? ' xcl' : '')   // v0.16: the strike, over whatever texture
                + (clipL ? ' cutl' : '');
      // An outline bar's fill IS the track, so its ink cannot be chosen by the hue's luminance:
      // inkOn() answers "black or white on this fill", and there is no fill. The hue itself is
      // the ink, which is also what makes the border and the text read as one object.
      // background-COLOR, not the background shorthand. v0.16 shipped the strike as a class
      // background-IMAGE and this inline shorthand silently reset it to none on every hued bar:
      // 8.4, the exact trap this file cites, walked into one property at a time. background-color
      // sets only the hue and leaves background-image for .bar.xcl to layer the strike on. Outline
      // bars never reach here (box-shadow branch) and away is a class, so this touches only the
      // solid and faded hued bars, which is precisely where the strike has to coexist with a hue.
      const style = !b.colour ? ''
        : b.texture === 'outline'
          ? 'box-shadow:inset 0 0 0 1.5px ' + esc(b.colour) + ';color:' + esc(b.colour) + ';'
          : 'background-color:' + esc(b.colour) + ';color:' + inkOn(b.colour) + ';';
      // v0.11: task bars join campaign bars. Same gate (APP.isAdmin, because all four task
      // RPCs return caller_is_admin() alone), same anchor, different editor. edHtml dispatches
      // on APP.editing.kind and the field ids are disjoint, so the two cannot read each other.
      // v0.17: absence and booking bars join, each on its OWN gate, mirroring the RPCs:
      //   milestone/task  admin only
      //   absence         writable by its owner or admin (any roster member owns their own)
      //   instrument      same, but the owner must be active to write at all (posture 2 refused)
      // mayWrite is the ownership half; the category decides which editor and whether posture 2
      // is even eligible. A bar the caller cannot write is not clickable: no phantom affordance.
      const clk = (b.category === 'milestone') ? APP.isAdmin
                : (b.category === 'task')       ? !!APP.activeCode
                : (b.category === 'absence')    ? mayWrite(b.person_code)
                : (b.category === 'instrument') ? (!!APP.activeCode && mayWrite(b.person_code))
                : (b.category === 'training')   ? (!!APP.activeCode && mayWrite(b.mentor))
                : (b.category === 'maintenance')? !!APP.activeCode
                : false;
      const fn  = b.category === 'task' ? 'openTk' : b.category === 'absence' ? 'openAb'
                : b.category === 'instrument' ? 'openBk' : b.category === 'training' ? 'openTr'
                : b.category === 'maintenance' ? 'openMnt' : 'openMs';
      const on  = clk ? ' onclick="' + fn + '(' + b.id + ',' + jsq(r.key) + ')"' : '';
      const cc  = cls + (clk ? ' clk' : '');
      if (b.is_point){
        inner += '<div class="bar pt ' + cc + '"' + on + ' title="' + esc(barTip(b)) + '" style="' + style
              + 'left:' + (px(s)+DAY_W/2-5) + 'px;top:' + (top+5) + 'px;width:10px;height:10px;"></div>'
              // A point's label is its bar text, just rendered beside the diamond because a
              // 10px marker cannot hold any. It is a SEPARATE code path from barText and it
              // kept the full name after barText moved to codes: two paths, one convention,
              // and only one of them got changed. Reads barText now so there is nothing left
              // to drift.
              + '<div class="bar-lab" style="left:' + (px(s)+DAY_W/2+9) + 'px;top:' + (top+7) + 'px;">'
              + esc([b.ref, b.person_code].filter(Boolean).join(' \u00B7 ')) + '</div>';
      } else {
        inner += '<div class="bar ' + cc + '"' + on + ' title="' + esc(barTip(b)) + '" style="' + style
              + 'left:' + px(s0) + 'px;top:' + top + 'px;width:' + Math.max(3, (e-s0)/DAY*DAY_W + DAY_W - 2) + 'px;height:'
              + (LANE_H-4) + 'px;" data-bl="' + px(s0) + '"><span class="bar-txt">' + esc(barText(b)) + '</span></div>';
      }
    });
    mk.forEach(o => {
      inner += '<div class="mark" title="' + esc(o.m.label + ' ' + ddmmyy(d2n(o.m.date)))
            + '" style="left:' + o.x + 'px;top:' + markTop + 'px">' + o.m.mark + '</div>';
    });
    // The row label opens the task too, and this is not a second convention. The rule is
    // CLICK THE TASK, WHEREVER THE TASK IS DRAWN: a dated task is drawn twice, as a label and
    // as a bar, and an unscheduled task is drawn once because it has no dates to place a bar
    // at. "Bars for dated rows, labels for unscheduled ones" WOULD be two conventions and is
    // not what this is. It is also the better desk target: the title IS the row label, so
    // finding puts the mouse there already, and 250px beats a bar that may be one day wide.
    const hclk = !!(r.tk && APP.activeCode);
    const row = '<div class="grow" style="height:' + h + 'px"><div class="rh' + (indent?' indent':'') + (hclk?' clk':'') + '"'
         + (hclk ? ' onclick="openTk(' + r.tk + ',' + jsq(r.key) + ')"' : '')
         + (r.tip ? ' title="' + esc(r.tip) + '"' : '') + ' style="flex-basis:var(--rhw)">'
         + (r.mono ? '<span class="code">' + esc(r.label) + '</span>' : esc(r.label))
         + (r.sub ? '<span class="rh-sub">' + esc(r.sub) + '</span>' : '')
         + '</div><div class="track" style="width:' + gw + 'px">' + inner + '</div></div>';
    return row + ((APP.editing && APP.editing.anchor === r.key) ? edHtml() : '');
  };

  // One row per chemist on the roster, and a chemist with NO load still gets a row. That empty
  // row IS the answer to "who else can take BPACH content", so it is the most valuable row on
  // the screen and it cannot be derived from v_load, which only holds people who are committed.
  const loadRowHtml = (p, cells) => {
    let inner = bg;
    let total = 0;
    loadRuns(cells || {}, W).forEach(o => {
      total += o.load * o.days;
      const over = loadOver(o.load);
      // background-COLOR, never the background shorthand: .lcell.away layers a hatch on top as
      // a background-IMAGE, and a shorthand here would wipe it. That is v0.9.3's defect with the
      // roles reversed, and getting it wrong makes away-and-loaded look like away alone.
      const fill = o.load <= 0 ? ''
                 : over ? ''   // .lcell.over carries it, so the class is the one source
                 : 'background-color:rgba(var(--load-rgb),' + loadAlpha(o.load).toFixed(3) + ');';
      const days = ddmmyy(o.n) + (o.days > 1 ? ' to ' + ddmmyy(o.n + (o.days-1)*DAY) : '');
      const tip = [p.full_name + ' (' + p.code + ')', days,
                   o.load > 0 ? 'load ' + o.load.toFixed(2) + (over ? '  OVER' : '') : 'no load']
                  .concat(o.bits).join('\n');
      inner += '<div class="lcell' + (o.away ? ' away' : '') + (over ? ' over' : '') + '"'
            + ' title="' + esc(tip) + '" style="' + fill + 'left:' + (o.i*DAY_W) + 'px;top:' + ROW_PAD
            + 'px;width:' + (o.days*DAY_W - 2) + 'px;height:' + (LANE_H-4) + 'px;"></div>';
    });
    // Same 32px pitch as a task row, deliberately: flipping views must not change the row
    // rhythm or the eye loses its place, which is the whole point of it being a mode.
    const h = ROW_PAD + LANE_H + ROW_PAD;
    return '<div class="grow" style="height:' + h + 'px"><div class="rh" title="'
         + esc(p.full_name + ' (' + p.code + ')\ncommitted ' + total.toFixed(2) + ' person-days in view')
         + '" style="flex-basis:var(--rhw)">' + esc(p.full_name)
         + '<span class="rh-sub">' + esc(p.code) + '</span></div>'
         + '<div class="track" style="width:' + gw + 'px">' + inner + '</div></div>';
  };

  // ONE shell, and only the BODY branches. The first cut of this emitted a second copy of the
  // whole gridwrap/ginner/ghead block for the load view, which is 8.2's drift shape in the one
  // block whose entire discipline is having a single derived set: two shells means the day axis,
  // the today line, the column highlight and the scroll restore each exist twice, and one of the
  // copies is eventually wrong. The load view is a MODE. Only the rows change.
  let body = '';
  if (APP.view === 'load'){
    const cells = loadCells();
    // v0.33.0: and onTeam. Under the roster_until model a leaver is active=TRUE with a past
    // date, because offboarding sets the date and never touches the flag, so an active-only
    // filter here would have given a departed chemist a workload row and a share of the day.
    // v0.37.0. onTeam ALONE, matching the dashboard. It was p.active && onTeam, which dropped
    // posture 2, and posture 2 is the trainee: the owner checkboxes admit them, their dashboard
    // card renders and shows hours committed today, and then the one view whose whole job is
    // showing who is loaded did not know they existed. You could give a trainee four hours and
    // this screen would say nobody was carrying it.
    const who = APP.roster.filter(onTeam);
    // A BAND, because every other section of this grid announces itself and this one did not.
    // Without it the body is seven people in the same order with the same labels as the ABSENCES
    // category, and "the grid collapsed to absences" is the only reading available. The blue was
    // being asked to say what the view was, and blue is not a sentence. The band carries the
    // answer to "what does this do" in the place the eye already is: a legend at the top of the
    // page is where you look AFTER you know what you are looking at.
    body = '<div class="catband static"><div class="cat">'
         + '<span class="cat-t">WORKLOAD</span>'
         + '<span class="cat-n">' + who.length + (who.length === 1 ? ' chemist' : ' chemists')
         + '</span><span class="cat-n">how much of each day is already committed</span>'
         + '</div></div>'
         + (who.length ? who.map(p => loadRowHtml(p, cells[p.code])).join('')
                       : '<div class="emptyband"><div class="emptycat">No roster.</div></div>');
  } else {
  CATS.forEach(cat => {
    const groups = rowsFor(cat.key, bars);
    const n = groups.reduce((a,g) => a + g.rows.length, 0);
    const ck = 'cat:' + cat.key, open = !APP.collapsed[ck];
    // The add control lives on the category header, not on a row. Production schedule shows
    // a row only for products that HAVE campaigns, so at zero rows there is nowhere to click,
    // and "no campaign for OMPN" is not a question anyone asks: 13 empty rows above everything
    // would be noise. Product is a field in the editor instead of implied by the row.
    // Same for tasks: a product group only exists when it HAS tasks, so a product with none
    // has no band to click. The category header is the only place that works at zero rows.
    // Product is a field in the editor instead of implied by the row.
    // + campaign / + task stay admin-only. + absence is for any roster member (posture 2 too);
    // + booking only for active members, mirroring the RPC gates so no button is a phantom.
    const add =
        cat.key === 'milestone' ? (APP.isAdmin ? '<button class="catadd" onclick="event.stopPropagation();openMs(null,\'new\')">+ campaign</button>' : '')
      : cat.key === 'task'      ? ((APP.activeCode ? '<button class="catadd" onclick="event.stopPropagation();openTk()">+ task</button>' : '') + taskFilterHtml())
      : cat.key === 'absence'   ? (APP.me        ? '<button class="catadd" onclick="event.stopPropagation();openAb(null,\'new\')">+ absence</button>' : '')
      : cat.key === 'instrument'? (APP.activeCode ? '<button class="catadd" onclick="event.stopPropagation();openBk(null,\'new\')">+ booking</button><button class="catadd" onclick="event.stopPropagation();openMnt(null,\'new\')">+ maintenance</button>' : '')
      : cat.key === 'training'  ? (APP.activeCode ? '<button class="catadd" onclick="event.stopPropagation();openTr(null,\'new\')">+ training</button>' : '')
      : '';
    body += '<div class="catband" onclick="toggle(' + jsq(ck) + ')"><div class="cat"><span class="caret">' + (open?'\u25BC':'\u25B6')
          + '</span><span class="cat-t">' + cat.title + '</span><span class="cat-n">' + n + (n===1?' row':' rows') + '</span>'
          + add + '</div></div>';
    if (!open) return;
    // !modal: while the dashboard's modal hosts the editor, the grid must not render a second
    // copy of the same ids. See dbNewTask.
    const newHere = !!(APP.editing && APP.editing.anchor === 'new' && !APP.editing.modal
      && ((cat.key === 'milestone'  && APP.editing.kind === 'ms')
       || (cat.key === 'task'       && APP.editing.kind === 'tk')
       || (cat.key === 'absence'    && APP.editing.kind === 'ab')
       || (cat.key === 'instrument' && APP.editing.kind === 'bk')
       || (cat.key === 'instrument' && APP.editing.kind === 'mnt')
       || (cat.key === 'training'   && APP.editing.kind === 'tr')));
    if (newHere) body += edHtml();
    if (!n){ if (!newHere) body += '<div class="emptyband"><div class="emptycat">' + esc(emptyCat(cat.key)) + '</div></div>';
             return; }
    groups.forEach(g => {
      if (g.group === null){ g.rows.forEach(r => body += rowHtml(r, false)); return; }
      const gk = 'grp:' + g.group, gopen = !APP.collapsed[gk];
      body += '<div class="grpband" onclick="toggle(' + jsq(gk) + ')"><div class="grp"><span class="caret">' + (gopen?'\u25BC':'\u25B6')
            + '</span><span class="grp-t">' + esc(g.group) + '</span><span class="grp-n">' + g.rows.length + '</span></div></div>';
      if (gopen) g.rows.forEach(r => body += rowHtml(r, true));
    });
  });
  }

  el.innerHTML = ownBox + trainBox + loadBox + lg
    + '<div class="gridwrap" id="gridwrap" onmousemove="colHover(event)" onmouseleave="colHide()" onscroll="pinScroll();syncBarLabels()">'
    + '<div class="ginner" style="width:calc(var(--rhw) + ' + gw + 'px)">'
    + '<div class="colhl" id="colhl" style="display:none"></div>'
    // The corner is empty. It carried the extent as text, which the month bands under it say
    // already and say better, because they say WHERE YOU ARE and not just how far it goes. The
    // element stays: it is the sticky corner that keeps the label column opaque in the header.
    + '<div class="ghead" style="height:33px"><div class="gcorner" style="flex-basis:var(--rhw);height:33px">'
    + '<div class="rhw-grip" title="Drag to resize the title column" onmousedown="startRhwDrag(event)"></div>'
    + '<div class="cornerbtns"><button class="todaybtn" onclick="goToday()">today</button>'
    // Solid when the workload view is up: .subtab.active's convention, which says which mode you
    // are IN rather than which mode the button would take you to. Not admin-gated; it reads.
    // "workload", not "load". It sits beside "today", which is a button that DOES something, so
    // "load" parses as an imperative with a missing object: load what? A control that has to be
    // explained once has to be explained every time, and the room test is someone reaching for
    // this mid-argument.
    + '<button class="todaybtn' + (APP.view === 'load' ? ' on' : '') + '" onclick="toggleView()">workload</button>'
    + '</div></div>'
    + '<div class="gdays" style="width:' + gw + 'px;height:33px">' + mon + day
    + (nowIn ? '<div class="now" style="left:' + (nowPx-1) + 'px"></div><div class="nowlab" style="left:' + (nowPx+3) + 'px">today</div>' : '')
    + '</div></div><div>' + body + '</div></div></div>';

  // Two rules, not one. Not "always scroll to today", which would teleport you back to July
  // every time you edit a task in November.
  const w = document.getElementById('gridwrap');
  if (w){
    if (!APP.scrolledOnce){
      // On open: today PAST_DAYS in from the left, so the horizon fills the rest of the screen
      // immediately and there is a fortnight of context behind it. A default, not a design
      // constraint (section 6). The clamp inside APP.todayX never actually fires, since
      // windowOf floors the extent at today-30 and PAST_DAYS is 14, but it costs nothing and
      // the floor is not this function's to assume.
      // Guarded since v0.37: no-ops while the grid is on a hidden tab, and leaves scrolledOnce
      // alone so switchTab can land it the moment the tab is actually shown.
      openAtToday();
    } else if (keep){
      // Every render after: hold what the person is looking at. scrollTop matters more than
      // scrollLeft, not less: vertical is the axis the meeting traverses, and editing a task
      // near the bottom of forty rows used to throw the view to the top of them.
      // Residual, known: an edit that widens the window LEFT moves W.start, so this pixel
      // then points at a different date. Rare and self-inflicted; anchoring to a date instead
      // is four more lines for a monthly annoyance.
      w.scrollLeft = keep.l; w.scrollTop = keep.t;
    }
    // AFTER the restore, never before: pinning the pre-restore value would freeze the grid at
    // the wrong place for the whole edit. Recaptured every render, which is idempotent because
    // nothing can legitimately move the horizontal while the pin is set except goToday(), and
    // that moves the pin with it. null frees it the moment the editor closes.
    APP.pinL = APP.editing ? w.scrollLeft : null;
  }
  fitGrid();
  syncBarLabels();
}

function emptyCat(k){
  if (k === 'milestone')  return 'No campaigns. These come off the production schedule and are yours to enter.';
  // v0.26.0: same bookable filter as the lane builder, or the message says instruments exist
  // while the category renders none of them.
  if (k === 'instrument') return APP.lists.instruments.filter(i=>i.active && i.bookable !== false).length
    ? 'Nothing booked in this window.' : 'No instruments on the list yet. Add them in Setup and every one gets a row here, booked or not.';
  if (k === 'task'){
    // "No tasks yet" is a lie the moment tasks exist and is_terminal has hidden all of them.
    // That is the Documentation trap: give a task a status ticked as counts-as-finished and it
    // vanishes, and a grid that says "no tasks" sends you hunting in the database. Say what is
    // actually true, and say where the tick is.
    const n = APP.tasks.length - visibleTasks().length;
    if (n) return n + (n===1 ? ' task is' : ' tasks are') + ' hidden: the status counts as completed. Untick "hide completed" above, or untick the status in Setup.';
    return 'No tasks yet.';
  }
  if (k === 'training'){
    const n = APP.training.length - visibleTraining().length;
    if (n) return n + (n===1 ? ' training record is' : ' training records are') + ' hidden: the status counts as completed. Untick "hide completed" above, or untick the status in Setup.';
    return 'No training yet.';
  }
  return APP.roster.length ? 'Nobody away.' : 'No roster.';
}

// ============================================================
// MILESTONES  (v0.4, Block 4)  -  create, edit, delete
//
// the admin only (section 8: production schedule is his at population and after). The controls
// are admin-gated in the UI; every RPC is gated again on the server, which is the one that
// counts.
//
// end_date nullable is the whole shape of this table. Null renders a marker, set renders a
// bar. Section 5: rows 3-9 are campaign BARS, and a point-only model would show the room
// "MPB-6 start" and "MPB-6 end" as two markers instead of one block covering three weeks.
//
// Writes are optimistic on edit and delete, per section 6: the room is watching and a
// spinner is dead air. Create is not optimistic and cannot be, since there is no id to
// render until the server gives one; the form closing is the feedback there.
// ============================================================
function edFor(id){ return APP.grid.find(b => b.category === 'milestone' && b.id === id); }

function openMs(id, anchor){
  const b = id ? edFor(id) : null;
  // If the bar is gone from under us (someone else deleted it, or a reload landed between
  // the render and the click) then b is undefined and the editor would silently open as a
  // NEW campaign with the old row's anchor. Saving would then create a duplicate instead of
  // updating. Refuse and re-read instead.
  if (id && !b){ toast('That campaign is no longer there. Reloading.'); loadGrid().then(renderGrid); return; }
  APP.editing = b
    ? { kind:'ms', id:b.id, product:b.product, ref:b.ref || '', name:b.label, start_date:b.start_date,
        end_date:b.is_point ? '' : b.end_date, source:b.detail || '', lead:b.person_code || '',
        co_lead:APP.coLead[b.id] || '', anchor:anchor }
    : { kind:'ms', id:null, product:'', ref:'', name:'', start_date:'', end_date:'', source:'', lead:'',
        co_lead:'', anchor:'new' };
  // v0.4 had to guess the ref back out of v_grid's coalesced "ref name" label by splitting on
  // the first space. v_grid carries ref as its own column now, so the guess is gone.
  renderGrid();
  setTimeout(() => { edHint(); const e = document.getElementById('ed_name'); if (e) e.focus(); }, 0);
}
// One close for both editors. Two functions doing the same thing is the drift shape.
function closeEd(){ APP.editing = null; dbCloseModal(); renderGrid(); }
function edRead(){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  return { product:g('ed_product'), ref:g('ed_ref'), name:g('ed_name'), start_date:g('ed_start'),
           end_date:g('ed_end'), lead:g('ed_lead'), co_lead:g('ed_co_lead'), source:g('ed_source') };
}
const ED_FIELDS = ['ed_product','ed_ref','ed_name','ed_start','ed_end','ed_lead','ed_co_lead','ed_source'];
function edClear(){
  ED_FIELDS.forEach(id => { const f = document.getElementById(id); if (f && f.classList) f.classList.remove('err'); });
  edHint();
}
function edHint(){
  const e = document.getElementById('ed_err'); if (!e) return;
  e.textContent = '';
  e.className = 'ed-hint';
}
function edErr(msg, field){
  const e = document.getElementById('ed_err'); if (e) e.textContent = msg;
  const f = document.getElementById(field); if (f){ if (f.classList) f.classList.add('err'); if (f.focus) f.focus(); }
}

async function saveMs(){
  edClear();
  const v = edRead();
  if (!v.product)    return edErr('Pick a product. A campaign with no product is not a thing.', 'ed_product');
  if (!v.name)       return edErr('Give it a name.', 'ed_name');
  if (!v.start_date) return edErr('A start date is required.', 'ed_start');
  if (v.end_date && v.end_date < v.start_date) return edErr('End is before start.', 'ed_end');
  const id = APP.editing.id;
  const args = { p_product:v.product, p_ref:v.ref||null, p_name:v.name, p_start_date:v.start_date,
                 p_end_date:v.end_date||null, p_source:v.source||null, p_lead:v.lead||null,
                 p_co_lead:v.co_lead||null,
                 // Dead. A campaign takes its product's hue and nothing reads milestones.colour.
                 // The parameter is in the signature so a value must go; null is the honest one.
                 // Column and parameter come out at the merge with the other five.
                 p_colour:null };
  if (id === null){
    try {
      const { error } = await sb.rpc('create_milestone', args);
      if (error) throw error;
      APP.editing = null;
      await Promise.all([loadGrid(), loadCoLeads()]); renderGrid();
      toast('Campaign added.');
    } catch(e){ edErr((e&&e.message)?e.message:'The write failed.', 'ed_name'); }
    return;
  }
  // optimistic: patch the bar, close, render, reconcile behind
  const b = edFor(id), before = Object.assign({}, b);
  const beforeCo = APP.coLead[id];
  b.product = v.product;
  b.label = v.name;
  b.ref = v.ref || null;
  b.person_code = v.lead || null;
  b.colour = v.colour || null;
  b.start_date = v.start_date;
  b.end_date = v.end_date || v.start_date;
  b.is_point = !v.end_date;

  APP.editing = null; renderGrid();

    Object.assign(b, before);
    if (beforeCo) APP.coLead[id] = beforeCo; else delete APP.coLead[id];
    renderGrid(); toast(error.message || 'The edit did not save.'); return;
  }

}

// ABSENCES and BOOKINGS  (v0.17, the janitor block)  -  create, edit, delete
//
// The gates are the RPCs', read off the six bodies 18/07 and mirrored here so the UI never
// shows a control the server refuses:
//   absences  -> caller_roster_code(), active-agnostic: any APP.me, so posture 2 too.
//   bookings  -> caller_code() + active: APP.activeCode only, so posture 2 is refused.
//   another person's row -> caller_is_admin() only, on every one of the six.
//   assigning to someone else -> admin only, so the person field is a dropdown for admin and
//   fixed-to-self for everyone else.
// Both bars live in APP.grid (v_grid), not APP.tasks, so the optimistic patch and the delete
// splice go there, exactly like milestones.
// ============================================================
function abFor(id){ return APP.grid.find(b => b.category === 'absence' && b.id === id); }
function bkFor(id){ return APP.grid.find(b => b.category === 'instrument' && b.id === id); }
function trFor(id){ const t = APP.training.find(x => x.id === id); return t ? trainingBar(t) : null; }

// May the caller write this row? admin writes anyone's; a member writes only their own. Mirrors
// "if v_owner <> v_caller and not caller_is_admin() then raise" in all six RPCs. owner is the
// person_code (absence) or the chemist, which is b.person_code on an instrument bar too.
function mayWrite(owner){ return APP.isAdmin || (APP.me && owner === APP.me.code); }

function openAb(id, anchor){
  if (!APP.me){ toast('Not authorised.'); return; }
  const b = id ? abFor(id) : null;
  if (id && !b){ toast('That absence is no longer there. Reloading.'); loadGrid().then(renderGrid); return; }
  // Editing someone else's row without admin is refused by the server; do not open the editor
  // to be bounced on save. Creating is always self (or admin picks), so the new branch is open.
  if (b && !mayWrite(b.person_code)){ toast('That absence belongs to ' + personName(b.person_code) + '. Only they or an admin can change it.'); return; }
  APP.editing = b
    ? { kind:'ab', id:b.id, person:b.person_code, type:b.label, start_date:b.start_date,
        end_date:b.end_date, notes:b.detail || '', anchor:anchor }
    : { kind:'ab', id:null, person:(APP.isAdmin ? '' : APP.me.code), type:'', start_date:'',
        end_date:'', notes:'', anchor:'new' };
  renderGrid();
  setTimeout(() => { const e = document.getElementById('ab_start'); if (e) e.focus(); }, 0);
}

  const person = APP.isAdmin ? g('ab_person') : APP.editing.person;

  if (!v.end_date)   return abErr('An end date is required.', 'ab_end');

function msHtml(){
  const e = APP.editing;
  const prods = APP.lists.products.filter(p => p.active || p.code === e.product);
  const opt = prods.map(p => '<option value="' + esc(p.code) + '"' + (p.code===e.product?' selected':'') + '>'
            + esc(p.code) + (p.active?'':' (off)') + '</option>').join('');
  // Active roster plus whoever is already set, so an existing lead who has since gone inactive
  // survives an unrelated edit instead of being silently cleared.
  // v0.33.0: and onTeam. Same parenthesising and the same reason as the chemist filter.
  const lead = APP.roster.filter(p => (p.active && onTeam(p)) || p.code === e.lead)
    .map(p => '<option value="' + esc(p.code) + '"' + (p.code===e.lead?' selected':'') + '>'
            + esc(p.full_name) + '</option>').join('');
  // Co-lead is optional and cannot be the lead. Trainees (posture 2) ARE eligible: a trainee
  // co-leads with their mentor for exposure, so this is the whole roster bar the lead, not just
  // active members. The lead dropdown above stays active-only - a trainee co-leads, never leads.
  // v0.33.0: and on the team, plus whoever is already set, so a campaign co-led by somebody who
  // has since gone keeps its record through an unrelated edit. The lead dropdown got the same
  // escape for free: it already carried "or p.code === e.lead" for the inactive case.
  // v0.40.0: notLeaving, not onTeam. The paragraph above is why this list is deliberately open to
  // posture 2, and that same openness was letting posture 5 through: somebody working out their
  // notice was being offered as a co-lead on a campaign running past their last day.
  const colead = APP.roster.filter(p => p.code !== e.lead && (notLeaving(p) || p.code === e.co_lead))

    + (e.id ? '<button class="btn danger" onclick="delMs()">Delete</button>' : '')

// The person field: a dropdown for admin (assign anyone), a fixed read-only label for everyone
// else, because the RPC refuses a non-admin assigning to someone other than themselves. Active
// roster plus whoever is already set, so an inactive owner survives an unrelated edit.
function personField(labelText, fieldId, current, activeOnly){
  if (APP.isAdmin){
    // v0.33.0: onTeam on BOTH branches, not only the active-only one. activeOnly=false is the
    // absence field, where posture 2 must stay pickable and a leaver must not; activeOnly=true is
    // the booking chemist and the training mentor, where a leaver would otherwise still show
    // because the new model leaves their active flag alone. Parenthesised so the current-pick
    // escape overrides both tests, which is what keeps an existing row editable after they go.
    const pool = APP.roster.filter(p => ((activeOnly ? p.active : true) && onTeam(p)) || p.code === current);
    const opt = pool.map(p => '<option value="' + esc(p.code) + '"' + (p.code===current?' selected':'') + '>'
              + esc(p.full_name) + '</option>').join('');
    return '<label>' + labelText + '<select id="' + fieldId + '"><option value="">\u2014</option>' + opt + '</select></label>';
  }
  return '<label>' + labelText + '<span class="ed-fixed">' + esc(personName(current) + ' (' + current + ')') + '</span></label>';
}

  // ("trainee % is active; training is for a posture-2 (inactive) member") was dropped from

// ============================================================
// TASKS  (v0.7 Block 5a, v0.11 Block 5b)  -  create, edit, delete
//
// the admin only. All four task RPCs return caller_is_admin() = true, read off prod 16/07/26, so
// the UI gates on APP.isAdmin exactly as milestones do. Scope section 8's posture bullet says
// "everything else gates on caller_code()"; that is true about posture 2 and false as a
// description of the gate, and the merged doc owes the correction.
//
// Section 4 is the shape of this table and the whole reason the tool can answer anything:
// start_date and end_date are BOTH NULL OR BOTH SET, enforced by constraint. A start with no
// end is the row-23 pathology (79 days of bar for a report that is not 79 days of anyone's
// time) and the database refuses it. Both null is the backlog: the task exists, it is visible,
// it contributes nothing to load. So the bar carries one meaning only, time assigned, and
// v_load is real. The hint line says so at the point of typing.
//
// Create is NOT optimistic and cannot be: there is no id until the server gives one, and the
// form closing is the feedback. Edit and delete ARE optimistic (v0.11), because there the room
// is watching and a spinner is dead air. Same split as saveMs / delMs.
//
// THE SEAM (v0.11). Fields and owners are TWO RPCs and no RPC does both, so this is surfaced,
// not closed. Not closed with a migration either, and that was tested rather than waved off: a
// new-name RPC taking all 13 plus p_owners carries no overload risk and would make the write
// atomic. It still loses. Both RPCs gate on caller_is_admin() ALONE, so the GATE cannot split
// them: fail it and update fails first and owners never runs. set_item_owners' only other
// failure is a bad person code, and the owners UI is checkboxes built from APP.roster, so a
// code cannot be typed. What is left is network death between two calls, or a roster change
// mid-edit: rare, loud, self-correcting on re-read. A migration for that, on a model that moved
// five times in one day, is tidiness bought with risk. Merge candidate.
// ============================================================
function tkFor(id){ return APP.tasks.find(t => t.id === id); }

// id absent = create, which is what the "+ task" button calls with no arguments at all. Both
// parameters are ignored on that branch, so passing null and 'new' would only imply they do
// something. Same shape as openMs otherwise.
function openTk(id, anchor){
  const t = id ? tkFor(id) : null;
  // Gone from under us: another tab deleted it, or a reload landed between the render and the
  // click. Without this the editor opens silently as a NEW task wearing the old row's anchor,
  // and Save then CREATES a duplicate instead of updating. Refuse and re-read.
  // Not decoration. set_item_owners raises 'no task %' when the row is gone, but
  // update_schedule_item almost certainly does not, since a where id=p_id hitting zero rows
  // raises nothing. So a save against a deleted task would silently no-op the FIELDS and fail
  // loudly on the OWNERS. This moves that from save-time to click-time.
  if (id && !t){ toast('That task is no longer there. Reloading.'); loadTasks().then(renderGrid); return; }
  APP.editing = t
    ? { kind:'tk', id:t.id, anchor:anchor, title:t.title || '', product:t.product || '',
        status:t.status || '', start_date:t.start_date || '', end_date:t.end_date || '',
        due_date:t.due_date || '', review_due:t.review_due || '', approve_due:t.approve_due || '',
        effort:(t.effort_hours != null ? t.effort_hours : 8), reference:t.reference || '',
        // A copy. The editor must not hold the array APP.owners is rendering from, or an
        // abandoned edit would have already changed the grid.
        notes:t.notes || '', owners:(APP.owners[t.id] || []).slice() }
    : { kind:'tk', id:null, anchor:'new', title:'', product:'', status:'',
        start_date:'', end_date:'', due_date:'', review_due:'', approve_due:'',
        effort:8,
        reference:'',
        notes:'', owners:[] };
  renderGrid();
  setTimeout(() => { tkHint(); const e = document.getElementById('tk_title'); if (e) e.focus(); }, 0);
}
function tkRead(){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const own = [...document.querySelectorAll('#tk_owners input:checked')].map(i => i.value);
  return { title:g('tk_title'), product:g('tk_product'), status:g('tk_status'),
           start_date:g('tk_start'), end_date:g('tk_end'), due_date:g('tk_due'),
           review_due:g('tk_review'), approve_due:g('tk_approve'), effort:g('tk_effort'),
           reference:g('tk_reference'),
           notes:g('tk_notes'), owners:own };
}
// ***** RESERVE A NUMBER FROM THE SCHEDULE (v0.20.26) *****
//
// Calls reserve_lot_for_item / reserve_lr_for_item, which are wrappers around the queue's own
// reserve_lot / reserve_lr. The wrapper exists for one reason: a PostgREST call is ONE
// transaction, so allocating the number and writing it onto the task either both happen or
// neither does. Calling reserve_lot directly from here would be two round trips, and a failure
// between them leaves a number burned in the register against a task showing nothing, which is
// how one experiment ends up with two lot numbers. The wrapper also takes `for update` on the
// task row before allocating, so two browsers racing the same task cannot both claim.
//
// Every rule is enforced server-side (posture 1, product required, reference must be empty).
// The frontend mirrors them to keep the button honest, never as the guard.
const RESERVE_TYPES = { lot:null, lr:null };   // lazily loaded, see openReserve
function mayReserve(e){
  return !!(e && e.id && APP.activeCode && e.product && !(e.reference || '').trim());
}
async function openReserve(kind){
  const e = APP.editing && APP.editing.e;
  if (!mayReserve(e)) return;
  showModal('<div class="modal-title">Reserve a ' + (kind==='lot'?'lot':'lab report') + '</div>'
    + '<div class="modal-as">Loading types...</div>');
  // Lazily read the type list, and ONLY here. Putting lot_types/lr_types in the startup loads
  // would add two reads to every page open for a control most people touch rarely, and would
  // break the whole editor for a posture-2 member, whose caller_code() is null and who the
  // register's read policy therefore returns nothing to.
  if (!RESERVE_TYPES[kind]){
    const tbl = kind==='lot' ? 'lot_types' : 'lr_types';
    const { data, error } = await core.read(kind==='lot' ? 'lotTypesAll' : 'lrTypesAll');
    if (error){
      showModal('<div class="modal-title">Reserve a ' + (kind==='lot'?'lot':'lab report') + '</div>'
        + '<div class="modal-error">' + esc(tbl + ': ' + (error.message||'read failed')) + '</div>'
        + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>');
      return;
    }
    RESERVE_TYPES[kind] = (data||[]).slice().sort((a,b) =>
      String(a.value||a.code||a.name||'').localeCompare(String(b.value||b.code||b.name||'')));
  }
  const list = RESERVE_TYPES[kind];
  const val = r => String(r.value != null ? r.value : (r.code != null ? r.code : r.name));
  const opts = list.map(r => '<option value="' + esc(val(r)) + '">' + esc(val(r)) + '</option>').join('');
  const flagLab = kind==='lot' ? 'Use test' : 'Standalone';
  showModal('<div class="modal-title">Reserve a ' + (kind==='lot'?'lot':'lab report') + '</div>'
    // The product is shown, not chosen. It comes off the task, and the wrapper reads it off the
    // task again inside the transaction, so a stale editor cannot claim against the wrong one.
    + '<div class="modal-as">Product ' + esc(e.product) + ', on task ' + esc(e.title || ('#'+e.id)) + '</div>'
    + '<div class="field"><label>Type</label><select id="rs_type">' + opts + '</select></div>'
    + '<div class="field"><label>' + (kind==='lot'?'Purpose':'Subject') + '</label>'
    + '<input type="text" id="rs_text" value="' + esc(e.title || '') + '"></div>'
    + '<div class="field"><label><input type="checkbox" id="rs_flag"> ' + flagLab + '</label></div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" id="okBtn" onclick="doReserve(\'' + kind + '\')">Reserve</button></div>');
}
async function doReserve(kind){
  const e = APP.editing && APP.editing.e;
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  if (!mayReserve(e)){ if (errEl) errEl.textContent = 'This task can no longer take a number.'; return; }
  const type = (document.getElementById('rs_type')||{}).value || '';
  const text = ((document.getElementById('rs_text')||{}).value || '').trim();
  const flag = !!(document.getElementById('rs_flag')||{}).checked;
  if (!type || !text){ errEl.textContent = 'Pick a type and enter a ' + (kind==='lot'?'purpose':'subject') + '.'; return; }
  if (btn){ btn.disabled = true; btn.textContent = 'Reserving...'; }
  try {
    // Two literal rpc() calls, not one with the name in a variable. sched_checks.cjs finds the
    // RPC surface by matching a quoted name inside rpc(, so a computed name is invisible to it:
    // the check would have gone on passing while two unverified RPCs shipped. Naming them costs
    // three lines and keeps the whitelist meaning what it says.
    const { data, error } = (kind === 'lot')
      ? await sb.rpc('reserve_lot_for_item', { p_item_id:e.id, p_lot_type:type, p_purpose:text, p_is_use_test:flag })
      : await sb.rpc('reserve_lr_for_item',  { p_item_id:e.id, p_lr_type:type,  p_subject:text, p_standalone:flag });
    if (error) throw error;
    closeModal();
    // The number is already ON the task, written inside the same transaction that allocated it.
    // So this re-reads rather than assuming: the editor shows what the register actually wrote.
    e.reference = data;
    const fld = document.getElementById('tk_reference'); if (fld) fld.value = data || '';
    await loadTasks(); renderGrid();
    toast('Reserved ' + data);
  } catch(err){
    if (btn){ btn.disabled = false; btn.textContent = 'Reserve'; }
    if (errEl) errEl.textContent = (err && err.message) ? err.message : 'The reservation failed.';
  }
}

const TK_FIELDS = ['tk_title','tk_product','tk_status','tk_start','tk_end','tk_effort','tk_reference',
                   'tk_due','tk_review','tk_approve','tk_notes'];
function tkClear(){
  TK_FIELDS.forEach(id => { const f = document.getElementById(id); if (f && f.classList) f.classList.remove('err'); });
  tkHint();
}
function tkHint(){
  const e = document.getElementById('tk_err'); if (!e) return;
  e.textContent = '';
  e.className = 'ed-hint';
}
function tkErr(msg, field){
  const e = document.getElementById('tk_err'); if (e){ e.textContent = msg; e.className = 'ed-hint warn'; }
  const f = document.getElementById(field); if (f){ if (f.classList) f.classList.add('err'); if (f.focus) f.focus(); }
}
// The chip is a checkbox in a label; this only keeps the border in step with it.
function tkOwn(el){ el.parentNode.classList.toggle('on', el.checked); }

async function saveTk(){
  tkClear();
  const v = tkRead();
  if (!v.title)  return tkErr('Give the task a title.', 'tk_title');
  if (!v.status) return tkErr('Pick a status.', 'tk_status');
  // Caught here as well as by the constraint, because the round trip would come back as raw
  // constraint text and this is the one rule in the schema worth a sentence a human can read.
  if (!v.start_date !== !v.end_date)
    return tkErr('Start and end go in together. Leave both blank to keep it unscheduled.', v.start_date ? 'tk_end' : 'tk_start');
  if (v.start_date && v.end_date < v.start_date) return tkErr('End is before start.', 'tk_end');
  // the admin's rule, 22/07/26: a task with no dates at all cannot be finished. It is also what makes
  // the archive cutoff complete, since that ages a task from its latest date and a finished task
  // with none has no age to measure. Guarding it here means the case stops being created;
  // isArchived still returns false for any that already exist, so an invalid row stays ON the
  // wall where someone will see and fix it, rather than being tidied out of sight.
  // Checks all five, not just start/end: a task can carry a hard deadline or a review date with
  // no bar, and that is a real date to age from.
  if ((statusTerminal(v.status) || statusCancelled(v.status))
      && !v.start_date && !v.end_date && !v.due_date && !v.review_due && !v.approve_due)
    return tkErr('A task with no dates cannot be completed or cancelled. Give it at least one date.', 'tk_end');
  // v0.20.42, the mirror of assert_start_ok. Server-enforced too, so this is for the message, not
  // the safety. Points at the field the person should fix: the missing date, or the status that
  // does not fit the date they have.
  if (!startOk(v.status, v.start_date))
    return tkErr(v.start_date
      ? v.status + ' means work has begun, and this task does not start until ' + ddmmyy(d2n(v.start_date)) + '.'
      : v.status + ' means work has begun, so the task needs a start date.',
      v.start_date ? 'tk_status' : 'tk_start');
  // NINE shared. The merge migration (ran 21/07/26) recreated the RPCs without the three dead
  // PARAMS, so the gate is cleared and this matches prod:
  //   create_schedule_item  = these 9 + p_owners
  //   update_schedule_item  = these 9 + p_id          (no p_owners, by design)
  // n_defaults is still 0, so null means WIPE, not "leave alone": no partial edit, the form is
  // the row. One object, each call site adds its own extra. Dropped from the RPC signatures:
  //   p_milestone_id / p_milestone_offset_days / p_deadline_kind  (see handover 19/07 s8).
  // The COLUMNS themselves still exist on schedule_items (v_backlog, a probe-only view, selects
  // milestone_id, so the drop was refused) but nothing reads them; harmless leftover.
  const args = { p_title:v.title, p_product:v.product||null, p_status:v.status,
                 p_start_date:v.start_date||null, p_end_date:v.end_date||null,
                 p_due_date:v.due_date||null,
                 p_notes:v.notes||null,
                 p_review_due:v.review_due||null, p_approve_due:v.approve_due||null,
                 p_effort:(v.effort === '' ? 8 : Math.max(0, Math.min(8, Number(v.effort) || 0))),
                 p_reference:v.reference || null };
  const id = APP.editing.id;

  if (id === null){
    try {
      const { error } = await sb.rpc('create_schedule_item', Object.assign({ p_owners:v.owners }, args));
      if (error) throw error;
      APP.editing = null;
      dbCloseModal();   // no-op when the editor was inline; the overlay is already hidden
      await loadTasks(); renderGrid();
      toast('Task added.');
    } catch(e){ tkErr((e&&e.message)?e.message:'The write failed.', 'tk_title'); }
    return;
  }

  // ---------- edit (v0.11) ----------
  const t = tkFor(id);
  // openTk guards this at click-time and nothing reloads APP.tasks while an editor is open, so
  // this is close to unreachable. It is here because the alternative is a TypeError on the
  // first field assignment below. saveMs has the same hole and would throw the same way; that
  // is Block 4's and is not fixed here, but it is not copied either.
  if (!t){ toast('That task is no longer there. Reloading.'); APP.editing = null; await loadTasks(); renderGrid(); return; }

  // Optimistic, per section 6: the room is watching and a spinner is dead air. The patch lands
  // on APP.tasks and APP.owners, NEVER on APP.grid, which holds no task rows at all. taskBar()
  // re-derives colour, texture, owners and marks at render, so patching the source rows is the
  // whole job. saveMs has to patch a v_grid row field by field because it has nothing to
  // re-derive from.
  const before = Object.assign({}, t), ownBefore = (APP.owners[id] || []).slice();
  t.title = v.title;                    t.product = v.product || null;
  t.status = v.status;                  t.notes = v.notes || null;
  t.start_date = v.start_date || null;  t.end_date = v.end_date || null;
  t.due_date = v.due_date || null;      t.review_due = v.review_due || null;
  t.approve_due = v.approve_due || null;
  APP.owners[id] = v.owners.slice().sort();   // loadTasks sorts; match it or the next read jumps
  APP.editing = null; renderGrid();

  // UPDATE FIRST, and not because the fields matter more: both halves feed v_load, so neither
  // split is the more honest one. It is that UPDATE carries nearly all the failure surface
  // (product FK, status FK, the both-or-neither date constraint, the not-authorised raise) and
  // set_item_owners carries nearly none. Run the call that CAN fail first, and a routine
  // failure aborts before anything is half-applied. Owners-first would let a bad product FK
  // leave the owner set already rewritten.
  const up = await sb.rpc('update_schedule_item', Object.assign({ p_id:id }, args));
  if (up.error){
    // The server never changed, so the local revert restores the truth without a round trip.
    // This is saveMs exactly.
    Object.assign(t, before); APP.owners[id] = ownBefore; renderGrid();
    toast(up.error.message || 'The edit did not save.');
    return;
  }

  // ONE RULE: revert locally when the server did not change, RE-READ when it did. The fields
  // are saved and the owners may not be, so the server is genuinely split and only a re-read
  // can say what it now is. Do NOT also hand-revert the owners: that is a second implementation
  // of the thing the re-read is about to do, and it would be wrong for the fields either way.
  // Verbatim, because the message names the codes: "unknown person code(s): MJD, XYZ".
  const ow = await sb.rpc('set_item_owners', { p_item_id:id, p_owners:v.owners });
  if (ow.error){
    toast(ow.error.message || 'The owners did not save. The other fields did.');
    await loadTasks(); renderGrid();
    return;
  }
  loadTasks().then(renderGrid);
}

// item_owners cascades. Nothing else references schedule_items, so nothing refuses and nothing
// is named: delete_milestone REFUSES while tasks are anchored and reports the count, and this
// has no such guard, which makes a task delete strictly MORE destructive than the thing it
// mirrors. Still no confirm dialog: section 6 says none, the admin is the only writer, and the
// button already sits behind an opened editor rather than one click from the grid.
async function delTk(){
  const id = APP.editing && APP.editing.id;
  if (!id) return;
  const t = tkFor(id), i = APP.tasks.indexOf(t);
  if (i < 0){ toast('That task is no longer there. Reloading.'); APP.editing = null; loadTasks().then(renderGrid); return; }
  const own = APP.owners[id];
  APP.tasks.splice(i, 1); delete APP.owners[id];
  APP.editing = null; renderGrid();
  const { error } = await sb.rpc('delete_schedule_item', { p_id:id });
  if (error){
    APP.tasks.splice(i, 0, t); if (own) APP.owners[id] = own; renderGrid();
    toast(error.message || 'Could not delete.');
    return;
  }
  loadTasks().then(renderGrid);
  toast('Task deleted.');
}

// ***** THE START GATE (v0.20.42) *****
//
// Mirrors assert_start_ok on prod (migration 23/07/26). The SERVER enforces this, inside
// create_schedule_item and update_schedule_item; everything here exists so the refusal arrives as
// a sentence in the editor instead of a raw P0001 after a round trip.
//
// DERIVED, never the string 'In Progress'. Which statuses assert that work has begun is a tick in
// console.html, exactly as is_terminal and cancelled are. Naming the status here would put the rule
// in two places and let a rename in the console silently switch half of it off.
function statusNeedsStart(v){
  const s = (APP.lists.task_statuses || []).find(x => x.value === v);
  return !!(s && s.needs_start);
}
// Undated fails, because a status that asserts work has begun cannot sit on a task with no dates:
// the admin, 23/07/26, "how can work take place when there are no dates". A start date that has not
// arrived fails for the same reason one step on. Nothing is checked against the END date: a task
// that overruns is OVERDUE, which the board already computes from the dates, and forcing its
// status back would mean storing a fact the tool works out for itself.
function startOk(status, startDate){
  if (!statusNeedsStart(status)) return true;
  if (!startDate) return false;
  return d2n(startDate) <= today0();
}
// One builder for both the first render and every rebuild after a date change, so the two cannot
// disagree about what is selectable. The CURRENT value always survives, tagged, even when the
// dates no longer allow it: silently rewriting a field nobody touched is worse than a refusal you
// can read, and saveTk is where the refusal happens.
function statusOptions(current, startDate){
  return (APP.lists.task_statuses || [])
    .filter(s => (s.active || s.value === current) && (startOk(s.value, startDate) || s.value === current))
    .map(s => {
      const tag = !s.active ? ' (off)' : (startOk(s.value, startDate) ? '' : ' (needs a start date)');
      return '<option value="' + esc(s.value) + '"' + (s.value === current ? ' selected' : '') + '>'
           + esc(s.value) + tag + '</option>';
    }).join('');
}
// Rebuilds ONLY the status options. A full tkHtml re-render would drop focus and every other
// unsaved field in the editor, which is a much worse trade than a select that repopulates.
function tkSyncStatus(){
  const selEl = document.getElementById('tk_status'), startEl = document.getElementById('tk_start');
  if (!selEl || !startEl) return;
  selEl.innerHTML = statusOptions(selEl.value, startEl.value);
}

function tkHtml(){
  const e = APP.editing;
  const sel = (id, blank, opts, extra) => '<select id="' + id + '"' + (extra||'') + '>'
    + (blank ? '<option value="">\u2014</option>' : '') + opts + '</select>';
  const o = (val, label, on, off) => '<option value="' + esc(val) + '"' + (on?' selected':'') + '>'
    + esc(label) + (off?' (off)':'') + '</option>';

  const prods = APP.lists.products.filter(p => p.active || p.code === e.product)
    .map(p => o(p.code, p.code, p.code===e.product, !p.active)).join('');
  // Active plus whatever is already set, so an existing value on a switched-off lookup row
  // survives an unrelated edit instead of being silently cleared. Same as the lead dropdown.
  // v0.20.42 folds the start gate into the same builder tkSyncStatus uses.
  const sts = statusOptions(e.status, e.start_date);
  // Every roster member is selectable as an owner, posture-2 trainees included: a trainee can be
  // put on a task for exposure. This is an admin assigning them, not the trainee writing.
  // v0.33.0 closes the posture-3 hole the old comment here flagged: roster_until is the flag it
  // said was missing. Still NO active filter, which is the distinction the column exists for.
  // ALREADY-TICKED OWNERS SURVIVE. A leaver who co-owns an open task keeps their box, ticked, so
  // opening that task to reassign it does not silently drop them on save: tkOwn reads the boxes
  // and set_item_owners writes exactly what it is given, so a missing box IS a removal. Removing
  // them has to be a click somebody makes, not a side effect of opening the editor.
  // v0.40.0: notLeaving. This is the surface that mattered most of the four. A task assigned to
  // somebody in their notice period is work that will need reassigning before their last day, and
  // the tool was helpfully offering to create it.
  const own = APP.roster.filter(p => notLeaving(p) || e.owners.indexOf(p.code) >= 0).map(p => {
    const on = e.owners.indexOf(p.code) >= 0;
    return '<label class="own' + (on?' on':'') + '" title="' + esc(p.full_name) + '">'
      + '<input type="checkbox" class="tick" value="' + esc(p.code) + '"' + (on?' checked':'')
      + ' onclick="tkOwn(this)">' + esc(p.code) + '</label>';
  }).join('');

  return '<div class="editband"><div class="editor wide">'
    + '<label>title<input type="text" id="tk_title" size="26" placeholder="task" value="' + esc(e.title) + '"></label>'
    + '<label>product' + sel('tk_product', true, prods) + '</label>'
    + '<label>status' + sel('tk_status', true, sts) + '</label>'
    + '<label>start<input type="date" id="tk_start" value="' + esc(e.start_date) + '" onchange="tkSyncStatus()"></label>'
    + '<label>end<input type="date" id="tk_end" value="' + esc(e.end_date) + '"></label>'
    + '<label title="Hours per day this task takes, out of an 8h day. 8 = full day (the default). Dial down for part-time work; the workload sums these, not the calendar span.">hrs/day<input type="number" id="tk_effort" min="0" max="8" step="0.5" style="width:52px" value="' + esc(String(e.effort)) + '"></label>'
    // The three marks. start and end are the team's own working time; these three are dates that
    // are not. "hard deadline" is due_date under a name that says what it now means: a date
    // another department set, which is why it is optional and why the bar may legally run
    // past it. Column stays due_date; the label is the honest word.
    + '<label>hard deadline<input type="date" id="tk_due" value="' + esc(e.due_date) + '"></label>'
    + '<label>review due<input type="date" id="tk_review" value="' + esc(e.review_due) + '"></label>'
    + '<label>approve due<input type="date" id="tk_approve" value="' + esc(e.approve_due) + '"></label>'
    + '<label>owners<div class="owners" id="tk_owners">' + (own || '<span class="locked">no roster</span>') + '</div></label>'
    + '<label>notes<input type="text" id="tk_notes" size="18" placeholder="" value="' + esc(e.notes) + '"></label>'
    + '<label title="The lot (PRODUCT-YY-NN) or lab report (LRYYNNN) this task relates to. Free text, shows on the bar.">Lot / LR<input type="text" id="tk_reference" size="12" value="' + esc(e.reference || '') + '"></label>'
    // Shown only when a number can actually be claimed: the task is saved (the wrapper needs its
    // id), it has a product, the field is still empty, and the caller is posture 1. Every one of
    // those is enforced again server-side; hiding the button is courtesy, not the guard. Typing a
    // number by hand still works and is untouched, which is what keeps a historical reference or
    // a number claimed in the queue enterable.
    + (mayReserve(e) ? '<span class="rs-btns"><button class="btn rs-btn" onclick="openReserve(\'lot\')"'
        + ' title="Claim the next lot number for this product from the register, and write it here.">+ lot</button>'
        + '<button class="btn rs-btn" onclick="openReserve(\'lr\')"'
        + ' title="Claim the next lab report number from the register, and write it here.">+ LR</button></span>' : '')
    + '<div class="ed-act"><button class="btn primary" onclick="saveTk()">Save</button>'
    + '<button class="btn" onclick="closeEd()">Cancel</button>'
    + (e.id && APP.isAdmin ? '<button class="btn danger" onclick="delTk()">Delete</button>' : '')
    + '</div>'
    + '<div class="ed-hint" id="tk_err"></div>'
    + '</div></div>';
}

</script>
