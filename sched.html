<div id="toast" class="toast" style="display:none;"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
// [REMOVED] the environment table and the active-environment switch. There is no project to
// point at and no environment to choose: core.js holds the dataset and the identity.

const APP = {
  me: null,            // { code, full_name }
  activeCode: null,    // caller_code(): null on posture 2
  isAdmin: false,
  posture: null,       // '1 full' | '1 full (admin)' | '2 read + own absences'
  activeTab: 'board',  // the app opens on the OVERDUE board (the admin, 22/07/26), the queue's shape:
                       // the first thing on screen is what is late, and the schedule is one click
                       // away. lastTab is where the Read probe button returns you to.
  lastTab: 'board',
  // [REMOVED] the probe result and the seminar state (rows, loaded, error, search,
  //           series, presenter and the fold memory).
  lists: { task_statuses:[], absence_types:[], instruments:[], products:[] },
  listErr: {},
  view: 'grid',        // 'grid' | 'load'. A MODE, not a tab: same window, same day axis, same
                       // scroll position. Section 6: flip, the room decides, flip back.
  grid: [],            // v_grid, minus tasks. See loadTasks().
  coLead: {},          // milestone id -> co_lead_code. v_grid does not carry it, so it is read
                       // separately off milestones and looked up by id, like owners are for tasks.
  holidays: {},        // iso date 'yyyy-mm-dd' -> name. Public holidays, admin-set, shade the wall.
  maintenance: [],     // instrument_maintenance rows. PMOQ/maintenance windows on instrument rows.
  dutyTypes: [],       // v0.24.0. duty_types and duty_assignments, for the band 1 strip. Read here
  duties: [],          // and edited only in console.html: the schedule tool displays, the console edits.
  dutyErr: null,
  standing: [],        // v0.25.0. standing_roles, its FIRST read surface in this file. Written and
  standingErr: null,   // edited only in console.html panel 5; the Standing tab here is read-only.
  tasks: [],           // schedule_items, dated AND undated. The task source.
  owners: {},          // item_owners, item_id -> [person_code]
  training: [],        // the training table (mentor-entered, on any roster member since .21). Its own read
                       // path like tasks, not v_grid.
  trainErr: null,
  load: [],            // v_load: one row per person per day they are committed
  loadErr: null,
  roster: [],          // team_members() - carries mentor since a0.17
  gw: 0,               // the track's pixel extent, for colHover
  gridErr: null,
  taskErr: null,
  ownErr: null,
  hideCompleted: false, // default SHOWS completed now (the admin, 21/07/26). The "hide completed"
  showArchived: false, // finished work older than ARCHIVE_DAYS is off the wall by default
                       // (the admin, 22/07/26). A VIEW filter only: nothing is deleted and nothing is
                       // flagged on prod, so this toggle brings all of it straight back.
  showLegend: false,   // legend starts COLLAPSED (the admin, 22/07/26). It is a reference card, read
                       // once while learning the wall and never again, and it was costing ~90 CSS
                       // px of a ~645 px page every day to say the same thing. Persisted, so the
                       // one person who wants it open keeps it open.
  taskOwner: '',       // toggle still hides them on demand; the flag/label stay honest.
                       // task filter: '' = all, else a chemist code -> only that chemist's tasks.
  collapsed: {},       // key -> true
  scrolledOnce: false,
  todayX: 0,          // where today sits in track px. ONE source: the open-scroll rule and the
                      // today button are the same question, and a second copy of the expression
                      // is the MS_DEFAULT trap in a place no checker looks.
  pinL: null,         // v0.12: scrollLeft is frozen at this while an editor is open. null = free.
  editing: null       // the inline editor: null, or { id, anchor, ...fields }
};

// ---------- theme (shared key across the the site the bench tools) ----------
const THEME_KEY = 'tdtools-theme';
// Guarded, both ways, and this is the file:// requirement rather than defensive habit. A browser
// may refuse localStorage outright there and THROW on access rather than returning null. This
// block runs before anything else on the page, so an unguarded read takes the whole page down
// before core.js is ever asked for a row: a blank page, no error the user can act on, and a theme
// preference as the cause. core.js already makes this call for the dataset store and reports which
// mode it landed in; the theme is only a preference, so it fails to the default and says nothing.
// Identical in index.html, queue.html, console.html and sched.html. If you change one, change all.
function themeRead(){ try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } }
function themeWrite(v){ try { localStorage.setItem(THEME_KEY, v); } catch(e){ /* preference only, never fatal */ } }
(function(){ const s = themeRead() || 'light'; document.documentElement.setAttribute('data-theme', s); syncThemeIcon(s); })();
function toggleTheme(){ const c = document.documentElement.getAttribute('data-theme')||'light'; const n = c==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme', n); themeWrite(n); syncThemeIcon(n); }
function syncThemeIcon(t){ document.querySelector('.theme-toggle').innerHTML = t==='light' ? '&#9728;' : '&#9790;'; }

// ---------- banner ----------  [REMOVED]
// The staging banner read ACTIVE_ENV to say which project you were pointed at. There is one
// local dataset and no project, so there is nothing for it to announce.

// ---------- build currency ----------  [REMOVED]
// v0.39.0's stale-tab check is gone: the build id, the poll and gap constants, the dismissed
// flag, the server read, the staleness test, the checker, the banner renderer, the
// visibilitychange and focus listeners and the timers. Nothing is deployed, so no tab can be
// running a build older than the server's. This block held the only Date.now() in the file and
// the fetch of its own pathname, which was the last read that left the page.
//
// The head comment keeps v0.39.0 in full, marked. It is the record of a real defect, and of the
// diagnosis that matters more than the fix: it is NOT a cache problem, because an open tab makes
// no request at all.

// ---------- client ----------
// core.js is the seam. Same { data, error } shape the callers already handle, so every call site
// below reads exactly as it did.
const sb = { rpc: core.rpc, auth: core.auth };

// ---------- small helpers (lifted) ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').style.display='flex'; }
function closeModal(){ document.getElementById('modalOverlay').style.display='none'; }
document.addEventListener('keydown', e => { if (e.key!=='Escape') return; closeModal(); if (APP.editing) closeEd(); });
function lockBtn(b, label){ if(!b) return; b.dataset.label = b.textContent; b.disabled = true; b.textContent = label; }
let toastTimer = null;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display='none'; }, 10000); }

// ============================================================
// LOGIN  -  [REMOVED]
// ============================================================
// signIn, openChangePassword, doChangePassword, signOut and the two keydown listeners went with
// the screen. The auth SURFACE survives in core.js and is still exercised: the session is real,
// caller_roster_code is still the door, caller_code still decides the write tier, and
// sched_checks.cjs still asserts that shape.
//
// meLabel is kept: it is the identity line, not the login, and the header still prints it.
function meLabel(){ return APP.me ? (APP.me.full_name + ' (' + APP.me.code + ')') : ''; }

// The reset control. Drops the local store, re-seeds, and reloads so every derived view is
// rebuilt from the seed rather than patched.
function resetData(){
  if (!confirm('Discard all local changes and re-seed the bench dataset?')) return;
  core.reset();
  location.reload();
}

// ---------- viewing as ----------
// The stand-in for signing in. Lists everybody in the dataset; the choice goes to core.js, which
// persists it for all three tools and signs the session in as that person. A change reloads the
// page, so routing, reads and every gate run fresh as the new person, the way a sign-in would.
// Identical in queue.html, console.html and sched.html apart from the fallback each passes.
function viewAsFill(fallback){
  const cur = core.viewingAs() || fallback;
  const people = (core.db().people || []).slice().sort((a,b) => a.code.localeCompare(b.code));
  const opts = people.map(p => '<option value="' + esc(p.code) + '"' + (p.code === cur ? ' selected' : '') + '>'
                             + esc(p.code) + ' - ' + esc(p.full_name) + '</option>').join('');
  document.querySelectorAll('select[data-viewas]').forEach(s => { s.innerHTML = opts; });
}
function viewAsChange(code){ core.setViewingAs(code); location.reload(); }

// The bench opens signed in, as whoever Viewing as names. With nobody picked it is
// core.DEFAULT_USER, an ordinary chemist, which is the right seat for this page: the schedule is
// roster-wide and read-mostly, and posture 1 is what the write controls expect. The admin console
// is the page that needs the admin, and it passes the admin as its own fallback.
core.signInDefault();
viewAsFill(core.DEFAULT_USER);

// Say out loud which storage mode is live. Under file:// localStorage throws on access, so the
// store falls back to memory and changes last only for the session - the person looking at the
// page should not have to guess which one they are in.
(function(){
  const st = core.storageState();
  const el = document.getElementById('storeMode');
  if (el) el.textContent = st.mode === 'local'
    ? 'saved in this browser'
    : 'memory only, changes are lost on reload' + (st.why ? ' (' + st.why + ')' : '');
})();

// ============================================================
// AUTH ROUTING  -  NOT lifted. the queue's door is whoami(), which is active-only and
// would send posture 2 to the blocked screen. the schedule tool's door is caller_roster_code(),
// active-agnostic, so posture 2 reads. caller_code() then decides the write tier.
// Scope v0.9 section 8.
// ============================================================
let routedFor = null;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session){ routedFor = null; return; }
  if (session.user.id === routedFor) return;
  routedFor = session.user.id; routeAuth(session);
});

async function routeAuth(session){
  let rc;
  try {
    rc = await sb.rpc('caller_roster_code');
    if (rc.error) throw rc.error;
  } catch(e){
    // A throw here is a real fault (missing EXECUTE), not an off-roster verdict.
    // Show the message rather than hiding it behind a friendly screen.
    toast((e&&e.message) ? ('caller_roster_code() failed: ' + e.message) : 'identity check failed');
    return;
  }
  const rosterCode = rc.data || null;
  if (!rosterCode){
    toast('That account is not on the roster.');
    // The toast is the port's stand-in for the off-roster screen; this line stays after it fades.
    // The shell is shown with the tabs hidden, so the header, and the picker in it, is still
    // there: #app starts hidden, and a refusal that left it so would strand the person on a blank
    // page with no way to pick anybody else.
    showScreen('app'); document.querySelector('.tabs').style.display = 'none';
    document.getElementById('view-board').innerHTML = '<div class="empty">This account is off the roster, '
      + 'so the schedule is closed to it. Pick another person under Viewing as.</div>';
    return;
  }

  // Tolerated, not thrown: if either of these is broken the probe is the thing that
  // diagnoses it, so it has to stay reachable. Both are reported there verbatim.
  const [cc, ad] = await Promise.all([ sb.rpc('caller_code'), sb.rpc('caller_is_admin') ]);
  APP.activeCode = (!cc.error && cc.data) ? cc.data : null;
  APP.isAdmin    = (!ad.error && ad.data === true);
  APP.posture    = APP.activeCode ? (APP.isAdmin ? '1 full (admin)' : '1 full') : '2 read + own absences';

  let fullName = rosterCode;
  try {
    const tm = await sb.rpc('team_members');
    if (!tm.error && tm.data){ const row = tm.data.find(m => m.code === rosterCode); if (row) fullName = row.full_name; }
  } catch(_){}
  APP.me = { code: rosterCode, full_name: fullName };

  document.getElementById('identity').innerHTML = esc(meLabel()) + ' <span class="posture">&middot; posture ' + esc(APP.posture) + '</span>';

  // [REMOVED] the admin-only un-hide of the probe button.
  // activeCode, not me.code. Posture 2 has a roster code and no write, so showing it the button
  // would offer a control create_schedule_item is certain to refuse.
  if (APP.activeCode){ const nb = document.getElementById('btn-newtask'); if (nb) nb.style.display = ''; }
  APP.roster = [];
  try { const tm = await sb.rpc('team_members'); if (!tm.error && tm.data) APP.roster = tm.data; } catch(_){}
  showScreen('app');
  switchTab('board');
  reloadAll();
}

// v0.20.23: three views now, and the board is one of them. The tab strip is back, carrying
// Overdue and Schedule; it was deleted in .22 as a row of chrome holding one live tab, and it
// earns its ~36 CSS px again the moment it takes ~250 px of board off the top of the grid.
// The probe and the seminar tab are [REMOVED], so the strip carries two views and the board.
const TABS = ['board','grid','standing'];   // 'seminars' and 'probe' [REMOVED]
function switchTab(which){
  APP.activeTab = which;
  TABS.forEach(t => {
    const tab = document.getElementById('tab-' + t), view = document.getElementById('view-' + t);
    if (tab) tab.classList.toggle('active', t === which);
    if (view) view.style.display = (t === which) ? 'block' : 'none';
  });
  // [REMOVED] the probe button relabelling, which named the tab it returned to.
  // The grid was hidden when renderGrid last ran, so it measured as zeros and skipped. Now it
  // is visible and has a real position. Same for the open-scroll: the first render happened on
  // a hidden tab, so this is the first moment the grid can actually take a scrollLeft.
  if (which === 'grid'){ fitGrid(); openAtToday(); }
  // [REMOVED] the seminar tab's lazy first read.
  // Read-only, and its data is already loaded by reloadAll on boot (loadStanding, loadDuties,
  // loadLists), so no lazy fetch like seminars's: just paint. reloadAll re-renders it on Refresh.
  if (which === 'standing') renderStanding();
}
// [REMOVED] toggleProbe went with the probe panel.

async function reloadAll(){
  const jobs = [loadLists(), loadGrid(), loadTasks(), loadTraining(), loadCoLeads(), loadHolidays(), loadMaintenance(), loadLoad(), loadDuties(), loadStanding()];
  // [REMOVED] the seminar read joined this list unconditionally from v0.22.0.
  await Promise.all(jobs);
  renderGrid();
  // Read-only reference data, so it does not ride renderGrid the way the board does (the board
  // rides it because mutations touch it; nothing here mutates). Rendered on Refresh so an open
  // Standing tab updates, and on switchTab so first open paints without a Refresh.
  renderStanding();
}

// One screen left, so this is now a one-liner. Kept as a function because every caller still
// routes through it and a removal that reaches into callers is not a removal.
function showScreen(which){
  document.getElementById('app').style.display = which==='app' ? 'block' : 'none';
}

// ============================================================
// THE READ PROBE  (v0.1)  -  [REMOVED]
// ============================================================
// REGISTER_TABLES, PROBE_TABLES, PROBE_VIEWS, PRODUCTS_EXPECTED, probeObject, probeFn,
// readObject, runProbe, renderProbe and the copy path. 180 lines.
//
// WHAT IT WAS FOR, because the reason it goes is the reason it existed. Every read policy was
// written and validated in the SQL editor as postgres, which BYPASSES RLS, so no policy was
// proven until a real signed-in session hit it. This panel was that session: the only thing in
// the suite that could tell a denying policy (200, zero rows) apart from an empty table.
//
// There is no RLS on the bench and no session to prove: core.js answers every read out of one
// local dataset. A panel whose entire output would be "13 rows, pass" against a fixture it was
// handed is not a diagnostic, it is a mirror. So the panel goes.
//
// THE RULE IT CARRIED DOES NOT GO. Four of its six assertions are facts about the REGISTER, not
// about this panel -- the four tables named, all four reachable, and zero rows from them being a
// failure rather than an empty table. Those are retargeted in sched_logic.cjs onto the register
// reads in core.js. Only the two that were bookkeeping about the panel itself (no table probed
// twice, and the admin-code gate on the tab button) are deleted.

// ============================================================
// SETUP  (v0.2, Block 2)  -  the lists and lookups
//
// Governing rule, scope v0.9 section 5: functions and categories are code, everything
// else is data. Nothing here is seeded and nothing here is hardcoded. the admin types every
// row through this tab. That is not a compromise: it makes the population session the
// first real exercise of every create path, and if a list cannot be added from the UI
// the tool is not finished.
//
// Panels are in population order (section 9), which is FK order. A task cannot exist
// before a status exists. Work top to bottom.
// ============================================================
// deadline_kinds dropped v0.8: three marks name themselves, so there is nothing left to
// label. The TABLE stays on prod and stays in the probe, which is about read policies, not
// about whether the frontend reads it.
// CORRECTION OWED TO SCOPE SECTION 9 at merge: the population order reads task_statuses,
// deadline_kinds, absence_types, instruments, products. Step 2 no longer exists.
// Each entry gains `read`, the name of the core.js registry entry, beside the table key it
// already carried. The key stays because APP.listErr is keyed on it and the error messages name
// the table; the read name is what the seam takes.
const LISTS = [
  { key:'task_statuses',  read:'taskStatuses', order:true  },
  { key:'absence_types',  read:'absenceTypes', order:false },
  { key:'instruments',    read:'instruments',  order:true  },
  { key:'products',       read:'productsAll',  order:true  }
];

async function loadLists(){
  APP.listErr = {};
  const res = await Promise.all(LISTS.map(l => core.read(l.read)));
  LISTS.forEach((l, i) => {
    const { data, error } = res[i];
    if (error) APP.listErr[l.key] = error;
    const rows = data || [];
    rows.sort((a,b) => l.order
      ? ((a.sort_order||0) - (b.sort_order||0)) || String(a.value||a.code).localeCompare(String(b.value||b.code))
      : String(a.value||a.code).localeCompare(String(b.value||b.code)));

  });
}

// jsq is the one Setup-era render helper the grid still uses (task/absence/booking onclick
// handlers, category/group toggles). panel() and tick() left with the Setup tab in v0.18.
// A JS string literal that is also safe inside a double-quoted HTML attribute. Escape for
// JS first, then HTML-escape the lot: the parser decodes the entities before JS sees them,
// so a value carrying a quote of either kind survives both layers intact.
function jsq(s){ return esc("'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'"); }

// Bar labels: black or white by the fill's luminance, never a fixed colour. The statuses are
// the admin's to set and nothing stops a pale one, on which fixed white text is invisible. The
// crossover is where white and black contrast equally: L+0.05 = sqrt(1.05*0.05), so L = 0.18.
function inkOn(hex){
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#ffffff';
  const n = parseInt(hex.slice(1), 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const L = 0.2126*lin(n>>16 & 255) + 0.7152*lin(n>>8 & 255) + 0.0722*lin(n & 255);
  return L > 0.18 ? '#12161f' : '#ffffff';
}

// non-text UI is the bar. The window is narrower than it looks: >=3:1 against white needs
// L<=0.30, and >=3:1 against #1a1d28 needs L>=0.139. A pale yellow scores 12:1 in dark and
// 1.4:1 in light. Warn, never block: the colours are the admin's and the tool surfaces, he decides.

function d2n(s){ const p = String(s).slice(0,10).split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function n2d(n){ const d = new Date(n); return d; }
// core.now() is the pinned clock, and the only one. Was new Date(). This is THE clock for this
// file: the wall's today line, the overdue board, every horizon and every lateness test route
// through today0(), so pinning it here pins the whole page. UTC getters rather than local ones,
// because the pin is 09:00 SGT expressed as 01:00 UTC and local getters would land a viewer west
// of UTC on the previous day, which would make the render depend on where it was opened.
function today0(){ const d = core.now(); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
function ddmmyy(n){ const d = n2d(n), p = x => String(x).padStart(2,'0');
  return p(d.getUTCDate()) + '/' + p(d.getUTCMonth()+1) + '/' + String(d.getUTCFullYear()).slice(2); }

// ---------- onTeam, v0.33.0 (the admin, 31/07/26) ----------
//
// people.roster_until, added to prod 31/07/26 and carried out by team_members(). A date, null
// meaning current member, and it is the LAST DAY they should see the tools: normally the last day
// in the lab, not the last day of service, which is a payroll fact weeks later.
//
// WHY NOT active. active=false is POSTURE 2, the trainee and the person on long absence, and both
// of those belong on the dashboard and in the owner lists: somebody else is assigning work to
// them. A leaver does not. One flag cannot mean two things, so the second is a second column.
// The two are read INDEPENDENTLY everywhere below. Nothing here looks at active, and every
// surface that already filtered on active keeps doing so, unchanged, alongside this.
//
// today0() AND d2n, not a Singapore-pinned string like console.html's sgtToday(). Every date this
// page shows is measured against today0() - the buckets, the archive cutoff, overdue, the today
// line - and a predicate on a different axis could hide somebody whose task the same page still
// calls due today. One axis per page. The two resolve to the same boundary on a Singapore
// browser, and the server carries the real gate regardless: all five identity functions test
// sgt_today() there, so this is display only and cannot grant anything.
//
// INCLUSIVE. Their last day is a day they are still here. d2n already slices to 10, so a
// timestamp arriving where a date is expected cannot compare longer than the boundary.
function onTeam(p){
  if (!p || !p.roster_until) return true;
  return d2n(p.roster_until) >= today0();
}
// v0.40.0. THE SECOND PREDICATE, and it exists because onTeam CANNOT tell a trainee arriving from
// a chemist leaving. Posture 2 (trainee, active=false, no date) and posture 5 (offboarding,
// active=false, future date) are the same row to every test the page had: both are inactive, both
// are still inside their roster window. One belongs in every list that assigns future work and the
// other belongs in none of them.
//
// COMING IN HAS NO DATE, GOING OUT HAS ONE. That is the whole discriminator, and it is why this is
// not a new column: the moment a roster end is set, the person is leaving, whatever their active
// flag says. Section 4b of the open items considered a third flag and rejected it on exactly this.
//
// STRICTLY STRONGER THAN onTeam. No roster_until means onTeam is true, so notLeaving implies
// onTeam and the surfaces below carry this ALONE rather than "onTeam(p) && notLeaving(p)". The
// conjunction would read as two independent tests and one of them would be dead, and dead logic
// rots: somebody eventually relaxes the live half and cannot see that the dead half was load
// bearing for nothing.
//
// WHERE IT DOES NOT GO. Displays, lanes, dashboards, workload, and the absence field. A leaver in
// their notice period is still here: they still hold tasks, still appear on the wall, and can
// still be away next Tuesday. This narrows exactly one thing, being OFFERED something new.
//
// THE ESCAPES STAY. Every surface below keeps its "or whoever is already set" clause, so a leaver
// already on a task keeps their box ticked and simply stops being a choice for anything else.
// Removing them is a click somebody makes, never a side effect of opening an editor.
function notLeaving(p){ return !!p && !p.roster_until; }
// Convenience for the surfaces that hold a CODE rather than a roster row. Unknown codes read as
// on-team: '(unassigned)' is not a person, and a code that has left the roster entirely is
// already handled by whatever renders its name.
function codeOnTeam(code){
  const p = (APP.roster || []).find(x => x.code === code);
  return p ? onTeam(p) : true;
}

// THE LOAD VIEW  (v0.13, Block 6)
//
// Section 1's second read, and the room test itself: "Tomas is triple-booked in week 34, who
// else can take BPACH content."
//
// THE TRAP, and it is the reason this is not just sum(share). v_load gives an absence
// share = 0.0. The reasoning behind that is right, leave must not inflate a total. But summing
// alone, A PERSON ON LEAVE SUMS TO ZERO, AND SO DOES A FREE PERSON. Scan the wall for pale rows
// in week 34 and Marcus, on annual leave, is the palest thing on it: the "reassignments to
// people who are not there" trap, arriving through the front door of the feature meant to shut
// it. So the cell has THREE states, not two:
//     free    no rows at all
//     loaded  the sum of share
//     away    an absence row exists, whatever the sum says
// AWAY AND LOADED AT ONCE is a real state and the sharpest thing this grid can say: someone has
// scheduled work across Marcus's leave. It must not collapse to either one, which is why the
// hatch is a background-IMAGE over the ramp's background-COLOR. See the CSS note.
// ============================================================
async function loadLoad(){

// ***** THE ONE DERIVED SET, FOURTH CONSUMER *****
// Promised in v0.7 and in section 8.2 and here it is. v_load carries NO status column and does
// not know what is_terminal means, so a task hidden from the grid as finished is still counted
// here unless it is filtered from the SAME set the grid filtered from. That is Tomas reading
// 2.5 with 1.5 visible as bars: the lying load view, which section 8 says is worse than no load
// view. Do not write a second filter. This calls visibleTasks().
//
// source is branched on here: an instrument exclusion, the task filter, and away (absence).
// Instrument bookings are NOT workload (the admin's call, 21/07/26). A booking is a resource
// reservation; the task that runs the instrument already carries the load, so counting the
// booking too would double it. Only task and absence rows reach the sum, tooltip and away-mark.
// (v_load still emits the instrument rows; they are dropped here, the one place load is decided.)
function loadCells(){
  const vis = {}; visibleTasks().forEach(t => { vis[t.id] = true; });
  const out = {};
  APP.load.forEach(r => {
    if (r.source !== 'task' && r.source !== 'absence') return;
    if (r.source === 'task' && !vis[r.id]) return;
    const p = out[r.person_code] || (out[r.person_code] = {});
    const n = d2n(r.day);
    const c = p[n] || (p[n] = { load:0, away:false, bits:[] });
    // Added unconditionally. An absence's share is 0.0, so this is a no-op for it, and a branch
    // that skipped the add is a branch that could one day skip a real one.
    c.load += Number(r.share) || 0;
    if (r.source === 'absence') c.away = true;
    c.bits.push(r.source === 'absence' ? 'away: ' + r.label
                                       : r.label + '  ' + (Number(r.share) || 0).toFixed(2));
  });
  return out;
}

// Load is piecewise constant, so a div per DAY is 8 people x ~600 days = ~4800 nodes to say
// what ~40 segments say. One div per RUN instead: the same reasoning that made bars positioned
// divs over a background rather than a cell per day, and that made the day grid one gradient
// per track rather than 578 divs.
// The key carries the LABELS, not only the number. Two different tasks at 1.0 on adjacent days
// are two runs, because their tooltips differ and a run that merged them would tell the room
// the wrong story about what the load is made of.
function loadRuns(cells, W){
  const out = [];
  let cur = null;
  for (let n = W.start, i = 0; n <= W.end; n += DAY, i++){
    const c = cells[n];
    const key = c ? (c.load.toFixed(3) + '|' + c.away + '|' + c.bits.slice().sort().join('\u0001')) : '';
    if (cur && cur.key === key){ cur.days++; continue; }
    if (cur && cur.key) out.push(cur);
    cur = { key:key, i:i, days:1, n:n, load:c?c.load:0, away:c?c.away:false, bits:c?c.bits.slice().sort():[] };
  }
  if (cur && cur.key) out.push(cur);
  return out;
}

// A FLOOR, and it is not decoration. alpha = load would put a single 0.25 share at 25% alpha,
// which is .wk's defect exactly: there, and invisible. The checker's own note is that a
// projector eats anything under about 1.3:1, and .wk passed a 1.03 floor while nobody in the
// room could see it. This is the one number in the view set by eye, and a screen decides it.
const LOAD_FLOOR = 0.22;
function loadAlpha(v){ return LOAD_FLOOR + (1 - LOAD_FLOOR) * Math.min(1, v); }
// Over is CATEGORICAL, not more ramp. The room decides over versus not over; it never decides
// 2.5 against 3.0. The epsilon is float defence: three owners at 1/3 sum to 0.999...
function loadOver(v){ return v > 1.0001; }

// ---------- hue = product, texture = status (v0.10) ----------
//
// the admin's rule, 16/07/26, and the reason for it is not a diagram: in the current Excel, people
// dislike a whole bar of colour being attached to them when it is about their work. A wall that
// colour-codes individuals is a scoreboard of individuals however well it encodes.
//
//   HUE   = WHICH PRODUCT.  Categorical, so it belongs in the one channel that carries no order.
//   TEXTURE = STATUS.       Ordinal (pending -> current -> done), so it belongs in a channel
//                           that does: outline -> solid -> faded reads empty -> full -> spent.
//   GREY  = NO PRODUCT.     Not an exception anywhere. instrument_bookings.product is nullable
//                           (prod, 16/07/26), Miscellaneous tasks have none, absences have none.
//
// Why product and not campaign, which is what v0.6's picker tried to be: milestones.product is
// NOT NULL and instrument_bookings.product and schedule_items.product both carry it, so ONE hue
// runs down all three. "TLPDS Campaign 13 moved. What else is amber?" is the production schedule
// and its downstream work linked, and nothing on this grid did that before.
//
// No active filter, deliberately, on either lookup. v_grid's JOIN task_statuses has none, and
// adding one here would silently strip the fill off everything carrying a switched-off value.
// Returns a COLOUR, never null. .bar carries no background of its own: a task's fill has always
// come from this inline style and task_statuses.colour is NOT NULL, so the question never arose.
// It arises now, because all 13 products have a null colour, and null here would render the
// entire grid as invisible bars. Grey IS the value for "no product", not the absence of one.
// Same grey .bar.bk used for a booking, which is the same idea: no colour of its own.
// A no-product bar's fill. Was #7b8794, a slate grey that sat right on --text2 (#a0a3b0 dark /
// #4a4d5a light), the colour the STATUS legend draws its solid "In Progress" swatch in, so a
// product-less booking read as a status. This warm taupe is off the greys entirely. It is the
// fallback for a no-product OR an uncoloured product, and the fill for training bars. Swap the
// hex if you want a different neutral; it is the one dial.
const NO_PRODUCT = '#94836b';
function productColour(code){
  if (!code) return NO_PRODUCT;
  const p = APP.lists.products.find(x => x.code === code);
  return (p && p.colour) ? p.colour : NO_PRODUCT;   // uncoloured product reads as no product
}
function statusTexture(v){
  const s = APP.lists.task_statuses.find(x => x.value === v);
  return (s && s.texture) ? s.texture : 'solid';
}
// v0.16: is this status cancelled? A flag on the status, read the same way texture is, so the
// bar renderer stays a pure function of the row it is handed.
function statusCancelled(v){
  const s = APP.lists.task_statuses.find(x => x.value === v);
  return !!(s && s.cancelled);
}
// The twin of statusCancelled, and the reason it has to exist. is_terminal was reachable ONLY
// through hiddenStatuses(), which is gated on APP.hideCompleted, so "is this status finished"
// and "is this status hidden right now" were the same call. That is correct for the grid and
// WRONG for an alert: hideCompleted defaults off, so a board built on visibleTasks() would count
// completed tasks as overdue until someone happened to tick a view toggle, and would change its
// own contents when they did. An alert set cannot depend on a view switch.
// This is not a second copy of the derived set. hiddenStatuses() is BUILT from this same lookup;
// this exposes the primitive underneath it, exactly as statusCancelled already does.
function statusTerminal(v){
  const s = APP.lists.task_statuses.find(x => x.value === v);
  return !!(s && s.is_terminal);
}

// A task, shaped like a v_grid row so the renderer does not care where it came from.
function taskBar(t){
  return { category:'task', id:t.id, product:t.product, person_code:null, label:t.title,
           start_date:t.start_date, end_date:t.end_date, is_point:false, status:t.status,
           colour:productColour(t.product), texture:statusTexture(t.status), cancelled:statusCancelled(t.status), detail:t.notes, ref:null, reference:t.reference,
           _owners:APP.owners[t.id] || [], _marks:marksOf(t) };
}

// A training record, shaped the same way. No product, so the fill is NO_PRODUCT grey and the
// texture is the status - a grey task, distinct from an absence's hatch. person_code is the
// TRAINEE (that is what the row groups on); mentor rides the bar text and the ownership gate.
function trainingBar(t){
  return { category:'training', id:t.id, product:null, person_code:t.trainee_code, mentor:t.mentor_code,
           label:t.topic, start_date:t.start_date, end_date:t.end_date, is_point:false, status:t.status,
           colour:NO_PRODUCT, texture:statusTexture(t.status), cancelled:statusCancelled(t.status),
           detail:t.notes, ref:null };
}

// A maintenance / PMOQ window, drawn on the instrument's own row. label is the instrument code
// (that is what the instrument row groups on, same as a booking); mlabel is the window's name
// (PMOQ by default) and rides the bar text. No product colour: it draws as an amber hatch via the
// .mnt class, distinct from a chemist's solid booking.
function maintenanceBar(m){
  return { category:'maintenance', id:m.id, label:m.instrument, mlabel:m.label || 'PMOQ',
           start_date:m.start_date, end_date:m.end_date, is_point:false, colour:null,
           person_code:null, product:null };
}

// Terminal statuses drop out by default.
function hiddenStatuses(){
  const out = {};
  if (APP.hideCompleted) APP.lists.task_statuses.forEach(s => { if (s.is_terminal) out[s.value] = true; });
  return out;
}

// ***** THE ONE DERIVED SET *****
// This is the ONLY place is_terminal is applied to tasks. Three consumers: the bars in the
// product groups, the backlog rows, and Block 6's v_load, which joins back by source='task'
// and id. Neither v_grid nor v_load filters on status and v_load carries no status column, so
// hiding a done task from the grid without a shared notion of terminal leaves its load
// counted: Tomas reads 2.5 in week 34 with 1.5 visible as bars. That is the lying clash view
// section 8 forbids, arriving through the back door.
// Do not write a second filter. Call this.
// ***** THE ARCHIVE CUTOFF (v0.20.31) *****
//
// The grid grew forever. PAST_CUTOFF_DAYS bounds the AXIS, not the ROWS: a task from two years
// ago still gets a row, it just has no visible bar, so the wall accumulates a row per task ever
// created and "show completed" turns into a wall of history.
//
// FINISHED means terminal OR cancelled, not just terminal. A cancelled task is done with, and a
// rule that only caught "Completed" would let cancelled work pile up forever in the one place
// nobody looks. Cancelled is a separate flag from is_terminal (see statusCancelled), so it has
// to be named explicitly or it is missed.
//
// UNFINISHED WORK NEVER ARCHIVES, whatever its age. That is the admin's point and the whole design:
// a task three months past its end date and still In Progress is exactly the thing the wall
// should keep shouting about, and ageing it out would turn the cutoff into a way of losing
// problems quietly.
const ARCHIVE_DAYS = 42;   // six weeks
// Aged from the LATEST of the four dates, not from end_date alone. A task whose bar ended six
// weeks ago but whose approve date is next week has not stopped mattering, and end_date alone
// would archive it out from under the person waiting to approve it.
function lastDateOf(t){
  const ns = [t.end_date, t.due_date, t.review_due, t.approve_due, t.start_date]
    .filter(Boolean).map(d2n);
  return ns.length ? Math.max.apply(null, ns) : null;
}
function isArchived(t){
  if (!(statusTerminal(t.status) || statusCancelled(t.status))) return false;
  const last = lastDateOf(t);
  // A finished task with NO dates has no age, and "over six weeks old" cannot be asserted about
  // it. The first cut archived it immediately, which meant marking an undated task complete made
  // it vanish on the spot: stricter than the rule asked for, and the kind of surprise that
  // teaches people not to trust the wall. It stays. That leaves undated finished tasks as the one
  // path that still accumulates; closing it needs a created_at to age from, which is a schema
  // question and not this change's to answer.
  if (last === null) return false;
  return last < today0() - ARCHIVE_DAYS*DAY;
}
function archivedCount(){
  return APP.tasks.filter(isArchived).length + APP.training.filter(isArchived).length;
}
// The other side of the same cutoff. Archived is finished-and-old; VERY OVERDUE is the exact
// complement, unfinished-and-old, and it exists because .33 pulled the axis back to six weeks.
// A task whose dates are all further back than that cannot be DRAWN: px() puts its bar at a
// negative offset and the scrollport clips it, so it would sit in its product group as a row
// with nothing on it, which reads as "no work here" for the work that is most late. Moving it to
// a named section is what stops the axis change from swallowing it.
function isVeryOverdue(t){
  if (statusTerminal(t.status) || statusCancelled(t.status)) return false;
  // END DATE, not the latest of the five (the admin, 22/07/26). This section exists for bars that
  // cannot be DRAWN, and drawability is a fact about start and end alone: px() places the bar
  // from start to end and the scrollport clips anything left of the window. A mark sitting in
  // the window does not make an off-axis bar drawable, so keying on the latest date would leave
  // exactly the undrawable rows this section was built to catch sitting in their product group
  // showing nothing.
  // The three cases this resolves, all with start already older than six weeks:
  //   end past the cutoff but before today  -> overdue, bar draws clipped, STAYS in its product
  //   end before the cutoff                 -> nothing to draw, moves HERE
  //   end today or later                    -> still running, draws clipped, normal
  // end >= start throughout, so "end before the cutoff" already implies start is too.
  if (!t.end_date) return false;   // undated is Unscheduled's business, not this
  return d2n(t.end_date) < today0() - ARCHIVE_DAYS*DAY;
}

function visibleTasks(){
  const hide = hiddenStatuses();
  // Still ONE derived set. The archive is a second CONDITION inside it, not a second filter
  // written somewhere else, which is the thing the rule against a second filter is protecting.
  return APP.tasks.filter(t => !hide[t.status] && (APP.showArchived || !isArchived(t)));
}

// Training uses task_statuses too, so a completed training drops out under hide-completed the
// same way a task does. Same hiddenStatuses() set - one terminal notion, not a second filter.
// Same archive cutoff too: training records accumulate exactly as tasks do, and a course finished
// last year is history rather than schedule.
function visibleTraining(){
  const hide = hiddenStatuses();
  return APP.training.filter(t => !hide[t.status] && (APP.showArchived || !isArchived(t)));
}

function visibleBars(){
  // v_grid hands milestones their own colour column and instruments none. Both are overwritten
  // here with their PRODUCT's hue: one hue for one product across all three categories is the
  // entire point, and a campaign carrying its own colour would break it. milestones.colour is
  // now unread; the column stays on prod until the merge with the other four.
  // Absences are left alone: no product, so grey, which is what .bar.ab already draws.
  return APP.grid.filter(b => b.category !== 'task')
    .map(b => b.category === 'absence' ? b
            : Object.assign({}, b, { colour: productColour(b.product), texture: 'solid' }))
    .concat(visibleTasks().filter(t => t.start_date).map(taskBar))
    .concat(visibleTraining().filter(t => t.start_date).map(trainingBar))
    .concat(APP.maintenance.map(maintenanceBar));
}

// ---------- the three marks (v0.8) ----------
//
// the admin's rule, 16/07/26, and it is the line the scope never quite stated:
//
//     THE BAR IS the team'S OWN WORKING TIME. A MARK IS A DATE THAT IS NOT.
//
//   due_date     the hard deadline another department set. the team does not own it, so the bar
//                ends days BEFORE it and the gap is buffer. Absent when the task is the team's own
//                to finish, which is most of them.
//   review_due   the reviewer must complete the review by this date. the team owns the timeline;
//                the reviewer owns the work. That distinction is why this cannot be a bar.
//   approve_due  the same, for approval.
//
// All three optional, all at the admin's discretion. Prod migration 16/07/26: review_due and
// approve_due added nullable, both RPCs DROPped by old signature and CREATEd with the two
// appended (overloads = 1, grants back to public + authenticated).
//
// Why none of them is a bar: a review period drawn as a second task would be a bar that is
// nobody's time, on the grid only so it stays visible. That is row 23 exactly, the pathology
// section 4 exists to kill. Marks, therefore columns.
//
// NO CONSTRAINT ties end_date to due_date, deliberately. A bar running past the hard deadline
// is precisely what the tool has to be able to show.
//
// There is no resolution order any more and no single "the deadline". v0.7.2 removed the
// offset, which left a milestone link resolving to a campaign's start date and nothing else;
// the admin's rule then retired due_date-as-deadline. deadlineOf() is gone with them.
function marksOf(t){
  return [ { key:'due',     date:t.due_date,    label:'hard deadline', mark:'H' },
           { key:'review',  date:t.review_due,  label:'review due',     mark:'R' },
           { key:'approve', date:t.approve_due, label:'approve due',    mark:'A' } ].filter(m => m.date);
}
// Earliest mark. Sorts the Unscheduled group: the soonest date that constrains a task is what
// decides how urgent it is to give it dates.
function firstMark(t){
  const ds = marksOf(t).map(m => d2n(m.date));
  return ds.length ? Math.min.apply(null, ds) : null;
}

// Window: whatever the data spans, snapped to whole months, floored to a readable calendar
// around today so a grid with no rows in it is still a grid.
// Marks widen the window too, and this is the line most likely to be missed. A hard deadline
// 60 days past the last bar would otherwise fall outside the extent and silently vanish, which
// truncates "what is coming" without saying so. It is worse than that for an UNSCHEDULED task:
// it has no bar at all, so its marks are the only thing that can place it in the window.
// v0.20.34: the floor is no longer universal. A campaign or an instrument window that is STILL
// RUNNING drags the extent back to its own start, however far that is, because a bar clipped at
// its left edge misreads as "this began six weeks ago" for something that began in March. Tasks
// and absences stay bounded: a task that far back is Very Overdue and has its own section, and a
// clipped absence still says what it is (see labelOffset).
// STILL RUNNING, not merely present. A campaign that ended four months ago dragging the axis back
// four months would undo v0.33 entirely and put the year-wide grid back by another route. The
// test is end >= today, so the exemption expires with the campaign.
// v0.20.35: CAMPAIGNS ONLY. .34 exempted instrument bookings and maintenance windows too; the admin
// pulled them back to the six-week floor. A booking is a claim on a machine for a stretch of
// days, and the stretch that matters is the one from here on: how far back it began does not
// change who has the instrument this week. A campaign is the opposite, a single object with a
// span you read as a whole, and cutting its left edge misreads it as having begun six weeks ago.
const AXIS_EXEMPT = { milestone:true };
function windowOf(bars, marks){
  const t = today0();
  let lo = t - 30*DAY, hi = t + 180*DAY;
  const floor = t - PAST_CUTOFF_DAYS*DAY;
  let openStart = null;
  bars.forEach(b => {
    const s = d2n(b.start_date), e = d2n(b.end_date || b.start_date);
    if (s < lo) lo = s; if (e > hi) hi = e;
    if (AXIS_EXEMPT[b.category] && e >= t && (openStart === null || s < openStart)) openStart = s;
  });
  (marks || []).forEach(n => { if (n < lo) lo = n; if (n > hi) hi = n; });
  // After the data has had its say, not before: the floor is a cap on how far the data may
  // drag the extent left, not a competing minimum. hi is untouched on purpose.
  if (lo < floor) lo = floor;
  // The exemption runs AFTER the clamp, so it reopens the floor rather than competing with it.
  // Order matters: clamping second would throw the exemption away again.
  if (openStart !== null && openStart < lo) lo = openStart;
  // v0.20.36: the START is no longer snapped to the first of its month. It was, and that quietly
  // broke the six-week rule: the floor landed on today-42 and the snap then widened it to the
  // month boundary, up to 30 days further back. On 22/07/26 that made the axis open on 01/06,
  // 51 days, not 10/06. The month BAND does not need it (from = max(month start, W.start)
  // already draws a partial first month), so the snap was buying nothing and costing the rule.
  // The END keeps its snap: widening forward is free, and whole months read better ahead.
  const b2 = n2d(hi);
  const start = lo;
  const end   = Date.UTC(b2.getUTCFullYear(), b2.getUTCMonth()+1, 0);
  return { start, end, days: Math.round((end - start)/DAY) + 1 };
}

// Greedy lane packing. Milestones and absences can overlap on one row and must both stay
// readable; bookings cannot overlap at all, the exclusion constraint sees to that, so they
// always resolve to a single lane without being told.
function lanes(bars){
  const sorted = bars.slice().sort((a,b) => d2n(a.start_date) - d2n(b.start_date));
  const ends = [];
  sorted.forEach(b => {
    const s = d2n(b.start_date), e = d2n(b.end_date || b.start_date);
    let l = 0; while (l < ends.length && ends[l] >= s) l++;
    ends[l] = e; b._lane = l;
  });
  return { bars: sorted, count: Math.max(1, ends.length) };
}

// ---------- row model: what rows exist, before any bar is placed ----------

// Name leads, code follows small on the right. Absences already read this way (full name,
// then the three-letter code) and instruments were the only rows built the other way round.
// Falls back to the code alone when there is no name, which is every product today.
function nameFirst(code, name){
  return (name && name !== code) ? { label:name, sub:code } : { label:code, sub:'', mono:true };
}

function rowsFor(cat, bars){
  const inCat = bars.filter(b => b.category === cat);
  const byKey = k => inCat.filter(b => (b.product || MISC) === k);

  if (cat === 'milestone'){
    // Row per CAMPAIGN, not per product. The source sheet's campaign block is A3:A9 merged
    // and unlabelled, which is 7 lanes for 7 campaigns, not 7 products. TRV is a product
    // descriptor and has no business being the row header on a campaign row.
    // Ordered by product sort_order, then by date: the meeting walks product by product.
    const ord = {}; APP.lists.products.forEach(p => { ord[p.code] = p.sort_order || 0; });
    const active = {}; APP.lists.products.forEach(p => { if (p.active) active[p.code] = true; });
    return [{ group:null, rows: inCat.filter(b => active[b.product])
      .sort((a,b) => (ord[a.product] - ord[b.product]) || (d2n(a.start_date) - d2n(b.start_date)))
      .map(b => ({ key:'ms:'+b.id, label:b.label, sub:b.product, bars:[b] })) }];
  }
  if (cat === 'instrument'){
    // From the list, not from v_grid: an instrument with no bookings is the answer to
    // "is it free", so its row has to exist and be empty. Maintenance windows (a separate
    // category) ride the same row as the bookings, so a clash reads at a glance.
    const mnt = bars.filter(b => b.category === 'maintenance');
    // v0.26.0: bookable, not active. Owner-only equipment (PolyBlock, balances, fumehoods) is
    // active and in service and has an owner for maintenance and vendor contact, but nobody
    // books it, so an empty lane per item would be a wall of noise. It is filtered HERE and
    // deliberately NOT from the maintenance editors or the per-person owned list: the reason
    // those rows exist at all is that somebody maintains them.
    return [{ group:null, rows: APP.lists.instruments.filter(i => i.active && i.bookable !== false).map(i => Object.assign(
      { key:'in:'+i.code, bars: inCat.filter(b => b.label === i.code).concat(mnt.filter(b => b.label === i.code)) }, nameFirst(i.code, i.name))) }];
  }
  if (cat === 'absence'){
    // Every roster member gets a lane, active or posture 2. The person dropdown already offers
    // them all, so filtering the rows to active left a trainee pickable in the editor but with
    // no row to land on.
    // v0.33.0 closes the posture-3 hole the old comment here flagged as needing "a flag on
    // team_members": roster_until is that flag. A lane is a CONTAINER for absences still to be
    // entered, not a record of ones already taken, so a departed person with none is an empty
    // row for a person nobody can book leave for.
    // KEPT WHEN THEY STILL HAVE A BAR, which is what stops this being a record deletion. A
    // leaver's dated absences stay drawn on their own lane exactly as before; only the empty
    // lane goes. Same escape as every dropdown below, one axis along: there the current pick
    // survives, here the existing rows do.
    return [{ group:null, rows: APP.roster
      .filter(p => onTeam(p) || inCat.some(b => b.person_code === p.code))
      .map(p => ({
        key:'ab:'+p.code, label:p.full_name, sub:p.code,
        bars: inCat.filter(b => b.person_code === p.code) })) }];
  }
  if (cat === 'training'){
    // Group per trainee, row per training record. Keyed on the person, not a product, because
    // the read is "where is this person's training time". A trainee's group appears once they
    // have training on the wall. Edited from the bar (mentor-owned), never the row, so no tk.
    const byT = {};
    inCat.forEach(b => { (byT[b.person_code] = byT[b.person_code] || []).push(b); });
    return Object.keys(byT).sort((a, b) => personName(a).localeCompare(personName(b)))
      .map(code => ({ group: personName(code) + ' (' + code + ')',
        rows: byT[code].sort((a, b) => d2n(a.start_date) - d2n(b.start_date))
          .map(b => ({ key:'tr:'+b.id, label:b.label, bars:[b] })) }));
  }
  // tasks: group per active product by sort_order, then Miscellaneous, permanently last
  //
  // tk is the row's TASK ID and it is what makes the row header a click target (v0.11). It
  // rides the row rather than being parsed back out of key, because a key is a render-time
  // string and an id is the thing itself. Every task row carries it, dated or not: an
  // Unscheduled row has bars:[] and its label is the only surface it has.
  //
  // ONE builder for a task row. The product-group rows and the Miscellaneous rows were the
  // same expression written out twice, and both had to gain tk: a field added to one and not
  // the other is a convention with two implementations, one of which is wrong. The Unscheduled
  // row is genuinely a different shape (no bar, its own tip, product as a sub-label) and stays
  // its own expression.
  // v0.20.15: the lot/LR rides the row header's sub-slot, not the label. .rh-sub is mono, muted
  // and right-aligned, which is already what every other code in this column gets (product on a
  // campaign, instrument code, person code), and a lot number is that same kind of token. Folding
  // it into the label would put a code in the sans run and eat the title's width first, when the
  // title is the thing being read. sub was unused on a dated task row (the product is the group
  // heading above it), so this fills an empty slot rather than displacing anything.
  const taskRow = b => ({ key:'tk:'+b.id, tk:b.id, label:b.label, sub:b.reference || '', bars:[b], marks:b._marks });
  // Chemist filter (v0.20.11): APP.taskOwner '' shows all, else only tasks that chemist owns.
  // A view filter, not a data one, applied to both the dated groups and the unscheduled bucket.
  const ownF = b => !APP.taskOwner || (b._owners || []).includes(APP.taskOwner);
  // MOVED, not copied: a very-overdue task leaves its product group entirely, so it appears in
  // exactly one place and the product groups stop showing bar-less rows they cannot draw.
  const vo = b => isVeryOverdue(APP.tasks.find(t => t.id === b.id) || {});
  const groups = [];
  // Its own section, FIRST, above the products. Same shape as Unscheduled (rows on the axis with
  // no drawable bar), and first because "six weeks late and still open" outranks every product
  // grouping underneath it.
  const vob = [];
  APP.lists.products.filter(p => p.active).forEach(p => {
    byKey(p.code).filter(ownF).forEach(b => { if (vo(b)) vob.push(b); });
  });
  if (vob.length){
    // Sorted and labelled off end_date, the same date the predicate uses. Sorting on one date
    // and classifying on another is how a section ends up ordered by something it did not select
    // on, which reads as no order at all.
    vob.sort((a,b) => d2n((APP.tasks.find(t=>t.id===a.id)||{}).end_date)
                    - d2n((APP.tasks.find(t=>t.id===b.id)||{}).end_date));
    groups.push({ group:VERY_OVERDUE, rows: vob.map(b => {
      const t = APP.tasks.find(x => x.id === b.id) || {};
      const days = Math.round((today0() - d2n(t.end_date)) / DAY);
      return { key:'tk:'+b.id, tk:b.id, label:b.label,
               sub:[b.product, t.reference, days + 'd late'].filter(Boolean).join(' \u00B7 '),
               tip:[b.label, 'ended: ' + ddmmyy(d2n(t.end_date)), days + ' days past',
                    'status: ' + (t.status || ''),
                    (b._owners||[]).length ? 'owners: ' + (b._owners||[]).join(', ') : 'unassigned'].join('\n'),
               bars:[], marks:b._marks };
    }) });
  }
  APP.lists.products.filter(p => p.active).forEach(p => {
    const bs = byKey(p.code).filter(ownF).filter(b => !vo(b));
    if (bs.length) groups.push({ group:p.code, rows: bs.map(taskRow) });
  });
  // No bucket for rows on a deactivated product. Section 6: deactivating a product "drops the
  // group from the default view and takes its tasks, milestones and bookings out of sight with
  // it, destroying nothing". v0.3 kept them in an "(inactive products)" group on the reasoning
  // that vanishing rows feel destructive. Wrong: "destroys nothing" is about the data, and a
  // bucket that shows them defeats the swelling problem deactivation exists to solve. They are
  // one tick in Setup away from coming back.
  const misc = byKey(MISC).filter(ownF);
  groups.push({ group:MISC, rows: misc.map(taskRow) });

  // The undated tasks. Labelled "Unscheduled" on screen; the scope and v_backlog call this
  // the backlog, and the comments below follow the scope because they point at it.
  // Gathered as one group, not scattered through the product groups: it answers
  // "what is unscheduled", which is a question about the SET, and scattering the rows would
  // destroy the set to preserve a grouping the sub-label already carries. The rows sit on the
  // same day axis with no bar, which is what makes Block 5c's deadline marker land on them:
  // "due then, nobody has scheduled it" is the read, and a side panel could not say it.
  // Sorted by resolved deadline ascending, nulls last. is_terminal applies here too, from the
  // same set: a DONE UNDATED task drops out, which is why v_backlog (start_date only, no
  // status filter) is not what this reads.
  const bl = visibleTasks().filter(t => !t.start_date
      && (!APP.taskOwner || (APP.owners[t.id] || []).includes(APP.taskOwner))).sort((a, b) => {
    const x = firstMark(a), y = firstMark(b);
    if (x === null && y === null) return String(a.title).localeCompare(String(b.title));
    if (x === null) return 1;
    if (y === null) return -1;
    return x - y;
  });
  // An unscheduled row has no bar, so it has no tooltip either, and its marks would be
  // invisible in every sense. The row header carries them instead.
  groups.push({ group:UNSCHED, rows: bl.map(t => ({ key:'tk:'+t.id, tk:t.id, label:t.title,
    // Unlike a dated row, this sub-slot is already carrying the product, because Unscheduled is
    // one bucket across every product and the code is the only product signal a row has here.
    // So the lot/LR joins it rather than replacing it: an LR number encodes no product, and
    // dropping the code to make room would blind the bucket to keep a redundancy off a lot.
    sub:[t.product, t.reference].filter(Boolean).join(' \u00B7 '),
    tip: [t.title].concat(marksOf(t).map(m => m.label + ': ' + ddmmyy(d2n(m.date))),
                          t.reference ? ['lot/LR: ' + t.reference] : [],
                          (APP.owners[t.id]||[]).length ? ['owners: ' + (APP.owners[t.id]||[]).join(', ')] : ['unassigned']).join('\n'),
    // An unscheduled row has no bar and its marks are the whole point: "due then, nobody has
    // scheduled it" is the thing a side panel could never have said.
    marks: marksOf(t), bars:[] })) });
  return groups;
}

// Both of these live outside the render closure so they can be exercised. Which rows grow is
// the whole point of the bump, and getting it wrong is SILENT: a row that should have grown
// just quietly eats its own owner codes again, which is the defect this closes.
//
// Two marks on one day is not exotic: approve due and a hard deadline are commonly the same
// date. Nudge right rather than stack, so both letters stay readable and the order still reads
// left to right.
function nudgeMarks(mk){
  mk.sort((a, b) => a.x - b.x);
  let last = -1e9;
  mk.forEach(o => { if (o.x < last + MARK_W + 1) o.x = last + MARK_W + 1; last = o.x; });
  return mk;
}
function personName(code){
  if (!code) return '';
  const p = APP.roster.find(x => x.code === code);
  return p ? p.full_name : code;
}
// An absence type's short code if it has one, else the full value. A one-day bar shows almost
// nothing, so "AL" reads where "Annual Leave" is clipped to "An". The tooltip keeps the full value.
function absCode(value){
  const t = (APP.lists.absence_types || []).find(x => x.value === value);
  return (t && t.code) ? t.code : value;
}

function barText(b){
  // One convention, v0.9.7: a person mentioned INSIDE a bar is always the 3-letter code.
  // This was the odd one out, spelling the lead in full while instrument and task bars both
  // used codes. Codes are what the team says out loud, and they survive a short bar where
  // "Tomas Lindqvist" truncates to "Tomas K...". Full names stay where a person is a row's IDENTITY,
  // which is the absence rows. The tooltip has the full name either way.
  if (b.category === 'milestone')  return b.is_point ? '' : [b.ref, b.person_code, APP.coLead[b.id]].filter(Boolean).join(' \u00B7 ');
  if (b.category === 'instrument') return [b.product, b.person_code].filter(Boolean).join(' \u00B7 ');
  if (b.category === 'absence')    return absCode(b.label);
  if (b.category === 'maintenance') return b.mlabel || 'PMOQ';
  if (b.category === 'training')   return b.mentor || '';
  // The title is the row header, so the task bar carries what the header cannot: the owners.
  // Same split as a campaign, whose bar carries the ref and the lead. v0.20.15 finishes that
  // symmetry: the lot/LR leads, then the owners, exactly as a campaign reads "ref - lead -
  // co_lead". It was tooltip-only before, so a lot number could only be found by hovering one
  // bar at a time, which is the opposite of what a wall is for. Reference FIRST because it is
  // the thing being looked up; on a bar too short for both, the owners truncate and the lot
  // survives. Blank reference falls through the filter, so an unreferenced task reads exactly
  // as it did.
  if (b.category === 'task')       return [b.reference, ...(b._owners || [])].filter(Boolean).join(' \u00B7 ');
  return '';
}
function barTip(b){
  const bits = [(b.ref ? b.ref + ' ' : '') + b.label,
                ddmmyy(d2n(b.start_date)) + (b.is_point ? '' : ' to ' + ddmmyy(d2n(b.end_date)))];
  if (b.status) bits.push('status: ' + b.status);
  if (b.category === 'maintenance') bits.push('maintenance: ' + (b.mlabel || 'PMOQ'));
  if (b.person_code) bits.push((b.category === 'milestone' ? 'lead: ' : b.category === 'training' ? 'trainee: ' : '') + personName(b.person_code) + ' (' + b.person_code + ')');
  if (b.category === 'milestone' && APP.coLead[b.id]) bits.push('co-lead: ' + personName(APP.coLead[b.id]) + ' (' + APP.coLead[b.id] + ')');
  if (b.mentor) bits.push('mentor: ' + personName(b.mentor) + ' (' + b.mentor + ')');
  if (b._owners && b._owners.length) bits.push('owners: ' + b._owners.map(c => personName(c) + ' (' + c + ')').join(', '));
  if (b.category === 'task' && (!b._owners || !b._owners.length)) bits.push('unassigned');
  // Until the marks render on the axis, the tooltip is the only way to see one. Typing a date
  // you cannot then read back is not testable.
  (b._marks || []).forEach(m => bits.push(m.label + ': ' + ddmmyy(d2n(m.date))));
  if (b.product) bits.push(b.product);
  if (b.reference) bits.push('lot/LR: ' + b.reference);
  if (b.detail) bits.push(b.detail);
  return bits.join('\n');
}
// Column hover. The x arithmetic runs in TRACK coordinates: clientX is viewport, the wrap has
// scrolled, and the first ROWH_W px are the sticky label column, which is not a day.
let colDay = -1;
function colHover(e){
  const w = document.getElementById('gridwrap'), el = document.getElementById('colhl');
  if (!w || !el) return;
  const x = e.clientX - w.getBoundingClientRect().left + w.scrollLeft - ROWH_W;
  const d = (x < 0 || x >= APP.gw) ? -1 : Math.floor(x / DAY_W);
  // mousemove fires per pixel; this fires per DAY. Without the guard it is a style write and a
  // layout read every pixel of a drag across an 11,000px grid, projected, live.
  if (d === colDay) return;
  colDay = d;
  if (d < 0){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style.left = (ROWH_W + d*DAY_W) + 'px';
}
function colHide(){ colDay = -1; const el = document.getElementById('colhl'); if (el) el.style.display = 'none'; }

// Measure, never guess. The grid's height was calc(100vh - 210px): one number standing in for
// the header, the tabs, the legend AND the footer below. Every one of those can move, and when
// one does the grid's bottom edge slides off the window taking the horizontal scrollbar with
// it. That is what v0.8.1's MARKS group did by making the legend wrap to two lines.
// Fits the grid so the PAGE never scrolls and the grid scrolls inside itself, which is the
// whole premise of the sticky header and the sticky label column.
function fitGrid(){
  const v = document.getElementById('view-grid'), w = document.getElementById('gridwrap');
  // A hidden element measures as all zeros, which would compute a height off by the whole
  // chrome. renderGrid runs whichever tab is showing, so this is reached with the grid hidden.
  if (!v || !w || v.style.display === 'none') return;
  // VIEWPORT-relative top, against the VIEWPORT innerHeight. v0.20.14: the old code added
  // window.scrollY (document-relative) then subtracted it from a viewport innerHeight, mixing
  // frames, so any page scroll (or a measurement taken before layout settled) shortened the grid
  // by scrollY and stranded a dead band above the footer. rect.top alone is right at any scroll.
  const top = w.getBoundingClientRect().top;
  const foot = document.querySelector('.footer');
  const footH = foot ? foot.getBoundingClientRect().height : 0;
  // The .wrap padding-bottom sits between the grid and the footer and was never in the budget, so
  // the fit ran ~that much off. Read it rather than hardcode, so a padding change cannot desync.
  const wrap = w.closest('.wrap');
  const pad = wrap ? parseFloat(getComputedStyle(wrap).paddingBottom) || 0 : 0;
  const h = window.innerHeight - top - footH - pad - 6;
  // A floor, because a short window or a wrapped-to-four-lines legend must not compute a grid
  // with no rows in it. Below this the page scrolls, which is the lesser wrong.
  w.style.maxHeight = Math.max(220, h) + 'px';
}
// Browser zoom fires resize, so Ctrl +/- refits the grid. Given zoom IS the horizontal control
// (scope section 2, and the reason this is DOM and not canvas), that is not a bonus, it is the
// same requirement seen from the other axis.
window.addEventListener('resize', fitGrid);
// v0.20.14: refit after the page and the web fonts finish. The first fit runs in renderGrid before
// the fonts swap in; if the legend wraps taller in the fallback face, the grid is sized against
// that taller layout and left short. Both re-measure once the real layout is final.
window.addEventListener('load', fitGrid);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitGrid);

// ---------- the horizontal freezes while an editor is open (v0.12) ----------
//
// .editor is position:sticky left:0 inside .gridwrap{overflow:auto}, which is what keeps the
// form at the visible left edge however far right the grid is scrolled. Drag-select text
// right-to-left, overshoot the box, and the browser autoscrolls the nearest scroll container to
// follow the drag. That container is the grid, so the editor holds still and eleven thousand
// pixels of timeline slide underneath it.
//
// Pinned, NOT overflow-x:hidden. Hiding the scrollbar makes the scrollport ~15px taller, so the
// whole grid jumps the moment any editor opens: a guaranteed layout shift on every edit traded
// against a rare overshoot is the worse deal. This lets the scroll happen and puts it back.
//
// HORIZONTAL ONLY. Focusing tk_title is what brings an editor opened near the bottom into view,
// so pinning the vertical would fight the focus and could strand Save below the fold. Vertical
// is also the axis the meeting traverses; the horizontal is the one the editor has no business
// moving.
//
// The equality test is what stops this recursing: writing scrollLeft fires another scroll event,
// and the second pass finds them equal and returns.
function pinScroll(){
  if (APP.pinL === null) return;
  const w = document.getElementById('gridwrap');
  if (w && w.scrollLeft !== APP.pinL) w.scrollLeft = APP.pinL;
}

// v0.19: the bar label follows the horizontal scroll so it stays readable while any part of its
// bar is on screen, and it stops at the bar's right edge, never past it. The maths: a bar sits at
// track-x barLeft and the visible-left of the track is at track-x scrollLeft, so the label's offset
// inside its own bar is scrollLeft - barLeft, clamped to [0, barWidth - labelWidth]. The sticky
// label column width cancels out of both terms, so it is not in the sum. A scroll handler and not
// position:sticky because the bar is overflow:hidden (that clip is what holds the label to the bar),
// which would make the bar its own sticky scroll container and pin nothing. rAF-throttled; transforms
// do not reflow, so the offsetWidth reads in the loop do not thrash against the writes.
let _labelRAF = false;
// Pulled out of syncBarLabels in v0.20.34 so the one guarantee that matters here is testable.
// A bar clipped by the window start has a NEGATIVE left, so at scrollLeft 0 the offset comes out
// positive and pushes the label back to the visible edge. That is what keeps a truncated
// absence saying what it is instead of showing an anonymous band of hatch. Clamped to the bar,
// so the label never leaves the bar it belongs to.
function labelOffset(scrollLeft, barLeft, barWidth, spanWidth){
  const max = barWidth - spanWidth - 10;   // 5px bar padding each side
  let off = scrollLeft - barLeft;
  if (off < 0 || max < 0) return 0;
  return off > max ? max : off;
}
function syncBarLabels(){
  if (_labelRAF) return;
  _labelRAF = true;
  requestAnimationFrame(() => {
    _labelRAF = false;
    const w = document.getElementById('gridwrap'); if (!w) return;
    const S = w.scrollLeft;
    w.querySelectorAll('.bar > .bar-txt').forEach(span => {
      const bar = span.parentNode;
      const off = labelOffset(S, +bar.dataset.bl || 0, bar.offsetWidth, span.offsetWidth);
      span.style.transform = off ? 'translateX(' + off + 'px)' : '';
    });
  });
}

// The corner has been dead space since v0.9.6 took the date range out of it: it is kept only
// because it is what holds the label column opaque in the header, sticky on both axes at
// z-index 6. Always-visible dead space is what a navigation control is for. Not admin-gated:
// it moves the view and writes nothing.
// v0.20.37: the open-scroll, pulled out of renderGrid so switchTab can reach it too.
// clientWidth is 0 while the grid sits on a hidden tab, and scrollLeft on a zero-width element
// silently does nothing. Since v0.23 the app opens on the OVERDUE tab, so the first render
// always happens hidden: the scroll went nowhere and scrolledOnce was set regardless, and the
// Schedule tab opened flush left ever after. The guard is the same one fitGrid uses, for the
// same reason, and it is why this has to be callable from the tab switch rather than only from
// the render.
function openAtToday(){
  const w = document.getElementById('gridwrap');
  if (!w || APP.scrolledOnce || !w.clientWidth) return;
  w.scrollLeft = APP.todayX;
  APP.scrolledOnce = true;
}
function goToday(){
  const w = document.getElementById('gridwrap'); if (!w) return;
  // Moves the pin rather than being snapped back by it. The freeze exists to stop the timeline
  // moving by ACCIDENT, and a button press is deliberate. A control that looks alive and does
  // nothing is worse than either having it or not having it.
  if (APP.pinL !== null) APP.pinL = APP.todayX;

}

// A MODE, not a tab. The window, the day axis and the scroll position are all untouched, so
// "the room hits a clash, flips to load, decides, flips back" lands on the same week 34 it left.

// ***** THE OVERDUE BOARD (v0.20.16) *****
//
// Reads APP.tasks DIRECTLY, not visibleTasks(), and that is deliberate: see statusTerminal.
// It also ignores APP.taskOwner and the collapsed groups. Every view control on this page
// answers "what am I looking at"; the board answers "what is late", and a filter that can hide
// an alert is a filter that makes the alert worthless. One rule: nothing the user can toggle
// may change what this counts.
//
// COLUMNS ARE DERIVED, not the two strings the admin named. "Pending overdue, in progress overdue"
// is what task_statuses holds TODAY once terminal and cancelled are removed, and the columns are
// computed that way, in the list's own sort_order. Hardcoding 'Pending' and 'In Progress' would
// silently drop a status the moment one is added in console.html, and a board that silently stops
// counting a category is worse than no board.
function overdueCols(){
  return (APP.lists.task_statuses || []).filter(s => !s.is_terminal && !s.cancelled);
}
// The bucket for an overdue task nobody owns. Not a person, so it is pinned below the people
// rather than sorted among them, but it is NOT dropped: an overdue task with no owner is the
// worst case on the board, and a per-person rollup is exactly where it would have vanished.
const UNOWNED = '(unassigned)';
function overdueTally(){
  const cols = overdueCols();
  const ix = {}; cols.forEach((s, i) => { ix[s.value] = i; });
  // The VERY OVERDUE column (v0.20.33). It is an AGE bucket sitting beside STATUS buckets, which
  // is a mixed axis and would double-count if it were simply added: a six-month-late Pending task
  // is both. So the columns PARTITION instead. A late task lands in the age column if it is more
  // than six weeks past, otherwise in its status column, never both, and the row still sums to
  // that person's late work. Last position, because it is the escalation.
  const VO = cols.length;
  const t0 = today0();
  const rows = {};
  const seed = c => (rows[c] = rows[c] || { code:c, counts:cols.map(() => 0).concat([0]), total:0 });
  // Seed the roster so the board is one row per staff, stable between refreshes, and a clean
  // chemist reads as a row of zeros rather than as an absence you have to notice.
  // NOT filtered on active. Posture-2 trainees are selectable as task owners (v0.20.5), so they
  // can carry late work, and "who can be given a task" is the only sane membership rule for a
  // board about late tasks. Filtering on active was importing the WORKLOAD view's rule, which is
  // about who is at the bench this week, and that is a different question.
  // WHOLE roster, HZO included (the admin 23/07/26, reversing the .19 exclusion). Two boards sit on
  // this tab now, and the pair only works as a register if both list the same people: a name
  // present on one and missing from the other reads as a data fault, not as an editorial choice.
  // The .19 reasoning (the head's own row is furniture on a board about the bench) was sound for
  // ONE board of mostly zeros; it stops being sound the moment the second board makes the row
  // carry real information. The complement board that shared this seed went in v0.23.0.
  (APP.roster || []).forEach(p => seed(p.code));
  (APP.tasks || []).forEach(t => {
    const ci = ix[t.status];
    if (ci === undefined) return;   // completed, cancelled, or a status no longer on the list
    // dbHardDates, CALLED and not retyped. v0.38.0. This line carried its own copy of the date
    // list, which is exactly how the tab count and the dashboard card drift into two different
    // ideas of "late", each invisible from the other's screen. One definition, two readers, and
    // the narrowing to end_date + due_date reaches both at once by construction.
    // Counted ONCE per task per owner: a task that has blown its end date AND its hard deadline
    // is one late task, not two.
    if (!dbHardDates(t).some(d => d2n(d) < t0)) return;
    // Partition, not an extra tally: very overdue REPLACES the status column for that task.
    const col = isVeryOverdue(t) ? VO : ci;
    const own = APP.owners[t.id] || [];
    // Seeding off the OWNER as well as off the roster is the belt: it catches anyone who holds a
    // late task but is not in the seed. That is HZO by design, and it would be a departed owner
    // or a code no longer on the roster by accident. Either way the task stays counted.
    (own.length ? own : [UNOWNED]).forEach(c => { const r = seed(c); r.counts[col]++; r.total++; });
  });
  const list = Object.keys(rows).map(c => rows[c]);
  list.sort((a, b) => (a.code === UNOWNED) - (b.code === UNOWNED)
                   || (b.total - a.total)
                   || String(a.code).localeCompare(String(b.code)));
  return { cols:cols, rows:list, total:list.reduce((n, r) => n + r.total, 0) };
}
// ============================================================
// THE PERSONAL DASHBOARD  (v0.22.0)
//
// Replaces the board tab as the landing view. Scoped and closed 24/07/26; the sixteen decisions
// behind it are in the dashboard handover note section 1 and are not re-argued here.
// The four bands, top to bottom: the strip, theirs today, theirs next two weeks, the team.
//
// THE PROPERTY THIS SECTION IS BUILT AROUND: every open task this person owns lands in exactly
// ONE bucket. Not "mostly one". The existing overdue/current board pair earns its keep because
// the two totals add up to the whole, and a dashboard that lists one task under three headings
// teaches the eye that the headings mean nothing. dbBuckets partitions with early returns and a
// fixture adds the buckets back up against the input.
//
// DECISION 9, and it is the one most likely to be undone by someone being helpful: a band with
// nothing to say renders NOTHING. No "nothing outstanding", no empty card, no reassuring tick.
// A screen that always looks busy stops being read, and the whole point of putting this first is
// that it gets read.
//
// DECISION 5, the trap: write controls gate on OWNERSHIP, never on who is displayed. Viewing
// Tomas's dashboard must not let you set her statuses, and a task you and she both own must
// stay editable while you are looking at her page. So every gate below asks whether
// APP.activeCode owns THE TASK. It never asks whether you are looking at yourself.
// APP.activeCode, not APP.me.code: the latter is caller_roster_code(), present on posture 2,
// and a trainee shown a dropdown the database will always refuse is worse than no dropdown.
// This nearly shipped in v0.21.
const DB_HORIZON = 14;          // decision 8, the admin 24/07/26. Two weeks.
const DB_DAY = 86400000;

// v0.22.3: THERE IS NO SELECTED PERSON. the admin, 24/07/26: "no dropdown, no tabs. each person is a
// bubble. all 8 displayed at same time." So the dashboard does not take a person any more, and
