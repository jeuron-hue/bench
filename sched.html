// APP.dashCode is gone rather than defaulted: a piece of state nothing reads is a piece of state
// that will get read by mistake later. dbMayEdit never consulted it and still does not; with
// every plate on screen at once, decision 5 stops being a subtlety and becomes the whole thing.
// Order: YOU FIRST, then code order. One function, used by the grid and by the overdue board's
// name links, so the bubble a name jumps to cannot drift from the bubble that name sits above.
// v0.33.0: filtered on onTeam. This is the defect that started the whole roster_until build: CJR
// left, and his bubble stayed on the dashboard with a Running Now block and an hours figure,
// because this function seeded from the WHOLE roster and nothing here knew he had gone.
// NOT filtered on active, deliberately, and that distinction is the entire point of the column.
// A posture-2 trainee keeps their bubble: work gets assigned TO them, so a plate with nothing on
// it is a real answer. A leaver has no plate at all.
// Their tasks do not vanish with the bubble. Any open task they co-owned is still on its other
// owners' bubbles, and one they held alone falls to the (unassigned) bubble, which exists for
// exactly this and is the loudest place on the page.
function dbOrder(){
  const mine = (APP.me && APP.me.code) || '';
  return (APP.roster || []).filter(onTeam).sort((a,b) =>
    (b.code === mine) - (a.code === mine) || String(a.code).localeCompare(String(b.code)));
}
function dbIsMine(code){ return !!(APP.me && code === APP.me.code); }

// The write gate. Ownership of this task by the ACTIVE caller, or admin. Nothing about display.
function dbMayEdit(t){
  if (APP.isAdmin) return true;
  const c = APP.activeCode;
  return !!(c && (APP.owners[t.id] || []).indexOf(c) >= 0);
}

function dbOpen(t){ return !statusTerminal(t.status) && !statusCancelled(t.status); }
// TWO DATE SETS, and the split between them is v0.38.0's whole content (the admin, 06/08/26:
// "review and approve are only indicative dates. they should not sound any alerts").
//
//   dbHardDates   end_date and due_date. These ALERT. end_date is the last day of the team's own time
//                 bar; due_date is the hard deadline another department set. Blowing either is
//                 late work and somebody needs to know today.
//   dbDates       all four. These INFORM. Used by the forward-looking groups and by the sort key,
//                 never by a red one.
//
// WHY review_due AND approve_due CANNOT ALERT, which is the reasoning and not just the rule:
// section "the three marks" already says the reviewer owns the review and the approver owns the
// approval; the team owns only the timeline. So the person whose card turns red is not the person who
// can clear it. Worse, there is NO completion field for a mark anywhere in the schema, so a
// review done on the day it was due left the task red until the whole task closed. An alert
// nobody can discharge by doing their job correctly is a false alarm on a timer.
//
// The defect that surfaced it, seen 04/08/26: a task ending 06/08 with review_due 03/08 sat in
// the overdue group on the 4th and printed 06/08 beside the word overdue. A future date under a
// lateness heading is a screen contradicting itself, and the contradiction was the symptom; the
// four-date predicate was the cause.
//
// The forward group keeps all four deliberately. Green, inside the horizon, no bold: that is
// visibility, which is what an indicative date is FOR. Only the red is withdrawn.
function dbDates(t){ return [t.end_date, t.due_date, t.review_due, t.approve_due].filter(Boolean); }
function dbHardDates(t){ return [t.end_date, t.due_date].filter(Boolean); }
function dbLate(t){ const t0 = today0(); return dbHardDates(t).some(d => d2n(d) < t0); }
// The date that MADE it late, with which one it is. Nothing ties end_date to due_date,
// deliberately (a bar running past a hard deadline is a shape this tool has to be able to draw),
// so end_date can sit in the future while due_date is already past. Printing end_date blindly is
// what produced "overdue / 06/08/26" on the 4th. EARLIEST of the past ones, because that is the
// one that has been wrong for longest.
function dbLateMark(t){
  const t0 = today0();
  const past = [{ label:'ended', date:t.end_date }, { label:'hard deadline', date:t.due_date }]
    .filter(m => m.date && d2n(m.date) < t0)
    .sort((a, b) => d2n(a.date) - d2n(b.date));
  return past.length ? past[0].label + ' ' + ddmmyy(d2n(past[0].date)) : '';
}

// needs_start is a lookup flag the admin sets per status in the console, and it may be set on nothing
// at all. If it is set on nothing, "the status does not say work has begun" is true of EVERY
// status, and the should-have-started bucket would swallow every running task and cry wolf on all
// of them. So the bucket only exists once the flag is in use anywhere. Degrades to silence, not
// to noise: an unconfigured flag produces no false alarms.
function dbStartFlagInUse(){ return (APP.lists.task_statuses || []).some(s => s.needs_start); }

// The partition. Order of the early returns IS the precedence, and it is deliberate:
// late beats everything, then what is already meant to be under way, then what is coming, and
// last of all what is not on the calendar at all.
// v0.34.0: SIX buckets. Every one of the first five is reached through a date, so an open task
// with no start_date, not late and with nothing inside the horizon, used to match none of them
// and leave the partition in silence. The unscheduled return is LAST because everything above it
// is a stronger statement about the same task: an undated task that is late is late, and an
// undated task with a deadline this week is due this week. Only what survives all five is
// genuinely unplanned. Precedence, not a filter.
function dbBuckets(code){
  const t0 = today0(), hz = t0 + DB_HORIZON * DB_DAY;
  const flag = dbStartFlagInUse();
  const out = { overdue:[], running:[], notStarted:[], starts:[], due:[], unscheduled:[] };
  (APP.tasks || []).forEach(t => {
    const own = APP.owners[t.id] || [];
    // UNOWNED is not a person, it is the bucket the overdue board used to keep for tasks nobody
    // holds. The board carried that row because a per-person rollup is exactly where an ownerless
    // task disappears, and removing the board in v0.23.0 would have made it disappear for real.
    // Reusing the board's own constant so the two cannot drift apart into different ideas of
    // "nobody".
    if (code === UNOWNED ? own.length > 0 : own.indexOf(code) < 0) return;
    if (!dbOpen(t)) return;
    if (dbLate(t)) { out.overdue.push(t); return; }
    const s = t.start_date ? d2n(t.start_date) : null;
    // Not late and started: end_date, if any, is today or later, so this is genuinely running.
    // That falls out of the partition rather than needing its own test.
    if (s !== null && s <= t0){
      (flag && !statusNeedsStart(t.status) ? out.notStarted : out.running).push(t);
      return;
    }
    if (s !== null && s > t0 && s <= hz){ out.starts.push(t); return; }
    if (dbDates(t).some(d => { const n = d2n(d); return n > t0 && n <= hz; })){ out.due.push(t); return; }
    // !start_date, which is rowsFor's own test for the Unscheduled / KIV group, reused rather
    // than retyped: the Schedule tab and the dashboard disagreeing about what "unscheduled"
    // means would be invisible on screen. Two shapes reach here, and the second is the one the
    // scope missed: the task with no dates at all, and the task with no start_date whose only
    // deadline sits past the horizon. A start_date beyond the horizon does NOT reach here, and
    // must not: that is scheduled work, just further off than a two-week card reports.
    if (!t.start_date){ out.unscheduled.push(t); return; }
  });
  const key = t => Math.min.apply(null, [t.start_date].concat(dbDates(t)).filter(Boolean).map(d2n).concat([Infinity]));
  Object.keys(out).forEach(k => out[k].sort((a,b) => key(a) - key(b) || String(a.title).localeCompare(String(b.title))));
  return out;
}

// ---------- absences ----------
// Decision 10: on someone else's dashboard, dates only. Type and notes are yours alone. An
// absence type is a code on a grid bar and skimmable; the same code on a line of a dashboard is
// a colleague's medical business stated in a sentence. Absences are read off v_grid, the same
// source the wall uses, so there is no second definition of when somebody is away.
function dbAbsences(code){
  const t0 = today0(), hz = t0 + DB_HORIZON * DB_DAY;
  const rows = (APP.grid || []).filter(b => b.category === 'absence' && b.person_code === code
    && b.start_date && b.end_date && d2n(b.end_date) >= t0 && d2n(b.start_date) <= hz);
  rows.sort((a,b) => d2n(a.start_date) - d2n(b.start_date));
  return { today: rows.filter(b => d2n(b.start_date) <= t0),
           soon:  rows.filter(b => d2n(b.start_date) >  t0) };
}

// ---------- instruments ----------
// Owner_main or owner_backup, both from a0.17's migration. An instrument is on your plate when
// there is maintenance on it, which is the only thing about an instrument that is a to-do; owning
// one with nothing scheduled is a standing fact and belongs nowhere on a dashboard.
function dbInstruments(code){
  return (APP.lists.instruments || []).filter(i => i.active && (i.owner_main === code || i.owner_backup === code));
}
function dbMaintenance(code){
  const t0 = today0(), hz = t0 + DB_HORIZON * DB_DAY;
  const mine = {}; dbInstruments(code).forEach(i => { mine[i.code] = i; });
  return (APP.maintenance || [])
    .filter(m => mine[m.instrument] && m.start_date && m.end_date
              && d2n(m.end_date) >= t0 && d2n(m.start_date) <= hz)
    .map(m => ({ m:m, inst:mine[m.instrument], role: mine[m.instrument].owner_main === code ? 'main' : 'backup' }))
    .sort((a,b) => d2n(a.m.start_date) - d2n(b.m.start_date));
}

// ---------- how busy ----------
//
// the admin, 24/07/26: "the dashboard should also flag somehow if someone is over in workload." The
// first cut of this counted DAYS where committed effort exceeded one productive day, straight off
// the workload view's arithmetic. It was correct and useless, and the admin called it on sight.
//
// THREE FAULTS, COMPOUNDING, all mine:
//  1. effort_hours DEFAULTS TO 8, so every task reads full-time until someone dials it down, and
//     nobody has. Three overlapping tasks is 3.0/day, which is the normal state of a chemist
//     here, so the flag fired on nearly everyone nearly always. That is the cry-wolf failure this
//     same file guards against for should-have-started, where the bucket switches itself off if
//     needs_start is set on no status. The guard was not applied here and should have been: the
//     flag was measuring whether effort is MAINTAINED, not who is busy.
//  2. WRONG UNIT. Everything else on this dashboard counts tasks; that counted days, so the two
//     could not be read against each other. the admin's actual objection.
//  3. The window counted WEEKENDS. Fourteen calendar days is ten working days, so a reading of
//     "over on 11 days" was only reachable by calling a Saturday overloaded.
//
// So: concurrent tasks, in tasks, above a threshold. It needs no data anyone is maintaining and
// it is the most defensible proxy available. DB_BUSY_AT is a GUESS and is deliberately one line:
// three concurrent tasks is normal here, four may not be, and nobody has the numbers to say yet.
// If effort_hours ever gets maintained, load per day is the better measure and dbLoadDays is
// recoverable from the v0.23.0 build note.
//
// ---- v0.32.0. NO ALERT. A TALLY. (the admin, 27/07/26) ----
//
// The threshold is gone, the window is gone, the error ink is gone. the admin: "i dont need
// micromanagement of their hours ... this is supposed to be a time management device and not
// increase workload device ... it would be ok to just display total hours for that day."
//
// Which retires the whole line of thinking above, not merely its last version. Every attempt at
// this flag, from dbLoadDays through the task count to the hours threshold, was deciding on the
// team's behalf whether a day was too full. Each one needed the underlying number to be TRUE to
// be worth anything, and making it true meant somebody maintaining it daily. A tool that costs
// its users upkeep in order to tell them they are busy has added the work it claims to measure.
//
// So it states a fact and judges nothing. No threshold means nothing to tune, nothing to argue
// with, and nothing that has to be accurate for the display to be honest: it reports the hrs/day
// on the rows, whatever they say. If they all still say 8 because nobody has touched them, the
// total says so too and reads as the task count it is. That is a limitation of the DATA and it is
// visible, which is the difference between this and every version above.
//
// ALWAYS SHOWN, including 0h. Decision 9 and the overdue board's own rule: an answer given in the
// same place every day is read faster than one that appears only on a bad day, and a chip that
// shows up only when something is wrong is the alert this replaces wearing quieter ink.
//
// TODAY ONLY, so no horizon scan and no spans to fill. dbBuckets defines both buckets as started
// and not past their end, which is what "covers today" means, so the sum is over bucket
// membership and the date arithmetic that used to live here is not needed at all. What the card
// shows under RUNNING NOW and should-have-started is what the header adds up.
//
// Shared tasks still count in full for each owner; v_load still splits. Unchanged and recorded
// in the v0.31.0 note.
function dbDayHours(b){
  // Rounded because it goes straight into a label. 1.1 + 1.1 + 6.9 is 9.100000000000001, and the
  // header is the one place a float tail gets read by a person.
  const h = b.running.concat(b.notStarted).reduce((n, t) => n + dbEffortHrs(t), 0);
  return Math.round(h * 100) / 100;
}

// ---------- the overdue counts, per person ----------
//
// v0.23.2. the admin, 24/07/26: "add the 2 numbers to each member's section overdue in progress and
// overdue pending. even if the number is zero." This is decision 6's information relocated rather
// than deleted, which is what removing the board should have done in the first place: v0.23.0 took
// away the counts and left only the list, so "how bad is it" stopped being answerable at a glance
// and became something you counted rows for.
//
// COLUMNS ARE DERIVED, never hardcoded, exactly as the board derived them: overdueCols() is the
// statuses that are neither terminal nor cancelled. A fourth open status appears here on its own
// the day it is added in the console, and "In Progress" and "Pending" are never named in this
// file. The board's rule, kept.
//
// NO VERY-OVERDUE PARTITION. The board moved a six-week-late task OUT of its status column into an
// age column, which meant a row's status counts did not sum to that person's late work. Here they
// must: the row sits directly above the list it counts, and a number that does not match the rows
// under it is worse than no number. Age is still visible on the grid's Very overdue section.
//
// ALWAYS RENDERED, zeros and all, and that is the admin overriding decision 9 for this element
// specifically. Same argument the board made for itself: this is a standing register, not a popup
// that appears on a bad day, and a row of zeros IS the answer. It also means the bubble does not
// change height as work goes late, so nothing below it moves.
function dbOverdueBy(b){
  const cols = overdueCols();
  const counts = cols.map(c => b.overdue.filter(t => t.status === c.value).length);
  // A task whose status has since been switched off is in the overdue bucket but matches no
  // column. The board silently dropped those. Here that would break the sum against the list
  // directly below, so they get a cell of their own, and only when there are any.
  const other = b.overdue.length - counts.reduce((a, n) => a + n, 0);
  return { cols:cols, counts:counts, other:other };
}
function dbStatsHtml(b){
  const st = dbOverdueBy(b);
  if (!st.cols.length) return '';        // no open statuses configured: nothing this could say
  const cell = (label, n) => '<span class="db-stat' + (n ? ' db-hot' : '') + '">'
    + esc(label) + '<b>' + n + '</b></span>';
  return '<div class="db-stats"><span class="db-stl">overdue</span>'
       + st.cols.map((c, i) => cell(c.value, st.counts[i])).join('')
       + (st.other ? cell('other', st.other) : '')
       + '</div>';
}

// ---------- mentor / mentee ----------
// Decision 11: standing and static. Rendered as a fact, never as an action. Both directions come
// off the single self-referencing column a0.17 added, so a mentee list is a filter and there is
// no second column to keep in step.
function dbMentorOf(code){
  const p = (APP.roster || []).find(x => x.code === code);
  return (p && p.mentor) || null;
}
function dbMenteesOf(code){
  return (APP.roster || []).filter(p => p.mentor === code).map(p => p.code);
}

// ---------- seminars ----------  [REMOVED]
// dbPwMine and dbPwNext read APP.pw, which no longer exists. Band 1 loses its ambient "next
// session" line and the bubble loses its per-owner group; every other plate is untouched.

// ============================================================
// DASHBOARD RENDER
// ============================================================
function dbWhen(a, b){
  if (!a) return '';
  if (!b || b === a) return ddmmyy(d2n(a));
  return ddmmyy(d2n(a)) + ' to ' + ddmmyy(d2n(b));
}
// Decision 10, and with every plate on one screen it now matters eight times over rather than
// once. Type and note on your own bubble; dates and the bare word "away" on everybody else's.
// The person is passed in, never inferred: there is no ambient "current person" left to infer
// from, which is the point of removing the picker.
function dbAbsRow(a, code){
  return '<div class="db-item"><span class="db-when">' + esc(dbWhen(a.start_date, a.end_date)) + '</span>'
       + '<span class="db-ttl">'
       + (dbIsMine(code) ? esc(absCode(a.label)) + (a.detail ? ' <span class="db-dim">' + esc(a.detail) + '</span>' : '')
                         : '<span class="db-dim">away</span>')
       + '</span></div>';
}

// A status control when this caller owns the task, the status as plain text when they do not.
// Both are always rendered, so the row never changes shape depending on who is reading it.
function dbStatusCell(t){
  if (!dbMayEdit(t)) return '<span class="db-tag">' + esc(t.status) + '</span>';
  return '<select class="db-sel" onchange="dbSetStatus(' + t.id + ', this.value)">'
       + statusOptions(t.status, t.start_date) + '</select>';
}

// ---------- hrs/day, v0.30.0 (the admin, 27/07/26) ----------
// The same shape as the status cell one field along: a control when you own the task, quiet text
// when you do not, and BOTH always rendered so the row does not change shape depending on who is
// reading it. That rule is dbStatusCell's and it is inherited here rather than restated.
//
// A SELECT, where the task editor has a number input. The editor is a form you are already in
// with the keyboard; this is one field on a card you came to read, and a spinner asking for two
// clicks per half hour is the wrong control for a value people will change in passing.
//
// The grid is 0 to 8 in halves, seventeen options, and the editor's own step is what sets it.
// Two controls on the same column offering different values would be a disagreement about what
// the field means, and the one people reach for less often would be the one that looked wrong.
//
// Zero is offered. The prod check is 0-8 and the editor accepts 0, so a task deliberately parked
// at no daily cost stays settable from here; it is the workload view's way of carrying a task
// that occupies the calendar and not the day.
//
// The CURRENT value survives even when it is off the grid, which is statusOptions' rule and the
// same reason: a row written at 3.7 by some other path must not be silently rounded by a control
// nobody touched. It sorts into position rather than being appended, so the list stays ordered.
const DB_EFFORT_MAX = 8;
const DB_EFFORT_STEP = 0.5;
function dbEffortSteps(){
  const a = [];
  for (let h = 0; h <= DB_EFFORT_MAX + 1e-9; h += DB_EFFORT_STEP) a.push(Math.round(h * 2) / 2);
  return a;
}
// Null reads as 8. The column defaults to 8 on prod, so null is a task written before the column
// existed rather than a task at zero, and 8 is what every other reader of this field already
// assumes (saveTk, dbSetStatus, openTk). One assumption, four places, stated once here.
function dbEffortHrs(t){ return (t.effort_hours == null ? DB_EFFORT_MAX : Number(t.effort_hours)); }
function dbEffortCell(t){
  const v = dbEffortHrs(t);
  if (!dbMayEdit(t)) return '<span class="db-code db-eff">' + esc(String(v)) + 'h</span>';
  const steps = dbEffortSteps();
  if (steps.indexOf(v) < 0) steps.push(v);
  steps.sort((a, b) => a - b);
  return '<select class="db-sel db-eff" title="Hours per day this task takes, out of an 8h day.'
       + ' 8 = full day (the default). The workload view sums these, not the calendar span."'
       + ' onchange="dbSetEffort(' + t.id + ', this.value)">'
       + steps.map(s => '<option value="' + s + '"' + (s === v ? ' selected' : '') + '>'
                      + esc(String(s)) + 'h</option>').join('')
       + '</select>';
}
// The product hue rides a DOT, not the text. hue-means-product is the house grammar and belongs
// here too, but a product colour is chosen to be legible as a bar fill on the grid, not as 11px
// text on a card, and recolouring the code would have traded one unreadable wall for a fainter
// one. The dot carries the hue at full strength and the code stays in ink that can be read.
// background-color, longhand: the shorthand check only looks at layerable bar elements, but the
// reason that check exists is that a shorthand resets what a longhand leaves alone, and that is
// worth respecting rather than routing around.
function dbTaskRow(t, when){
  const prod = t.product
    ? ' <span class="db-code"><i class="db-dot" style="background-color:' + esc(productColour(t.product))
      + '"></i>' + esc(t.product) + '</span>'
    : '';
  return '<div class="db-item"><span class="db-when">' + esc(when) + '</span>'
       + '<span class="db-ttl">' + esc(t.title) + prod
       + (t.reference ? ' <span class="db-code">' + esc(t.reference) + '</span>' : '') + '</span>'
       + dbEffortCell(t) + dbStatusCell(t) + '</div>';
}
// v0.23.3. the admin, 24/07/26: "the whole block is in one colour ... otherwise it is just a wall of
// text". It was. Every heading inside a bubble rendered in the same muted grey, so eight bubbles
// of eight sections each gave the eye nothing to steer by.
//
// A TONE, not a boolean. The old signature took `hot`, which could only say late or not, and the
// wall was everything else being identical. Tones are TIERS OF URGENCY and there are four, which
// is the most a person reads as meaning rather than as decoration:
//   late   error red     already past a date
//   slip   amber         should be under way and is not
//   now    accent blue   happening today
//   ahead  green         inside the two-week horizon, nothing wrong with it
//   quiet  border grey   nothing with a clock on it
// v0.34.0 corrects that last line, which read "absences and standing facts, which are not work".
// The unscheduled group is work and it is quiet, so the tone cannot mean not-work. It means NO
// CLOCK: there is no date against which this can be early or late, so there is no urgency for the
// ink to be reporting. Still four urgency TIERS, which is the ceiling; quiet is the absence of
// one rather than a fifth.
// Each is a left rule as well as heading ink, so the sections chunk visually even at a glance
// where nobody is reading the words.
//
// This is a NEW grammar and it is worth being explicit that it does not collide with the grid's.
// On the grid, hue means PRODUCT and nothing else, which is why the workload view is a mode that
// replaces the grid rather than a category inside it. Here there are no bars and no product
// axis, so urgency is free to own the hue. The product hue still appears, as a dot on each row.
function dbGroup(label, inner, tone){
  if (!inner) return '';
  return '<div class="db-grp db-' + (tone || 'quiet') + '"><div class="db-gt">' + esc(label) + '</div>'
       + inner + '</div>';
}

// ---------- band 1, the strip ----------
//
// v0.24.0 completes it. Ambient, one line, the same for everyone, and it renders NOTHING when it
// has nothing to say: no duty running, no next session, no strip.
//
// GENERIC OVER DUTY TYPES. Nothing here names housekeeping or KYT, and nothing knows that one is
// weekly and the other quarterly. A type is on the strip when today falls inside an assignment's
// own dates, and show_final_days narrows that to the last N days for a type whose window is long
// but whose reminder should be late. That is the whole display rule, and it is why the schema
// needed no recurrence model: adding a duty type in the console puts it on the strip with no
// build at all.
//
// GROUPED BY TYPE AND PERIOD, so two names on one housekeeping week read as one entry with two
// names rather than as two entries. That is the same fact the two rows exist to record.
function dbDutyNow(){
  const t0 = today0(), types = {}, seen = {}, out = [];
  (APP.dutyTypes || []).forEach(t => { if (t.active) types[t.code] = t; });
  (APP.duties || []).forEach(d => {
    const ty = types[d.duty_type];
    if (!ty || !d.start_date || !d.end_date) return;
    const st = d2n(d.start_date), en = d2n(d.end_date);
    if (t0 < st || t0 > en) return;
    // The final-N rule. Inclusive of the last day, so show_final_days 1 means the closing day
    // only rather than nothing at all.
    if (ty.show_final_days != null && t0 < en - (ty.show_final_days - 1) * DB_DAY) return;
    const k = d.duty_type + '|' + d.start_date + '|' + d.end_date;
    if (!seen[k]){ seen[k] = { type:ty, start:d.start_date, end:d.end_date, who:[] }; out.push(seen[k]); }
    seen[k].who.push(d.person);
  });
  out.forEach(x => x.who.sort());
  out.sort((a, b) => (a.type.sort_order || 0) - (b.type.sort_order || 0)
                  || String(a.type.code).localeCompare(String(b.type.code)));
  return out;
}

function dbStripHtml(){
  const duties = dbDutyNow();
  if (!duties.length) return '';
  let h = '<div class="db-strip">';
  duties.forEach(d => {
    h += '<span class="db-sl">'
       + (d.type.colour ? '<i class="db-dot" style="background-color:' + esc(d.type.colour) + '"></i>' : '')
       + esc(d.type.name) + '</span>'
       + '<span class="db-sv">' + esc(d.who.map(personName).join(', ')) + '</span>'
       + '<span class="db-sv db-dim">' + esc(dbWhen(d.start, d.end)) + '</span>';
  });
  // [REMOVED] the next-seminar segment of the ambient strip.
  return h + '</div>';
}

// Inside a bubble these are the only two headings, so they say WHEN and not whose: the bubble's
// own header already said whose.
function dbTodayHtml(code, b){
  const abs = dbAbsences(code);
  let h = '';
  // v0.38.0. dbLateMark, not end_date. The old line printed end_date whenever there was one, so a
  // task late on its hard deadline and still inside its own bar printed a future date under the
  // word overdue. The label goes with the date because "overdue / 30/07/26" does not say whether
  // the team's own time ran out or somebody else's deadline did, and those are different conversations.
  h += dbGroup('overdue', b.overdue.map(t => dbTaskRow(t, dbLateMark(t))).join(''), 'late');
  // v0.35.0. The label carries the ACTION, not just the diagnosis. Overdue means work is late;
  // this means the board is lying, because the dates say under way and the status says pending.
  // A data-integrity alert outranking a lateness alert is the reason this one pulses and overdue
  // only bolds.
  h += dbGroup('should have started (update status)', b.notStarted.map(t => dbTaskRow(t, 'started ' + dbWhen(t.start_date))).join(''), 'slip');
  h += dbGroup('running now', b.running.map(t => dbTaskRow(t, dbWhen(t.start_date, t.end_date))).join(''), 'now');
  // Decision 10. Type and note on your own page; dates alone on anyone else's.
  h += dbGroup('away', abs.today.map(a => dbAbsRow(a, code)).join(''), 'quiet');
  h += dbGroup('instruments', dbMaintenance(code).map(x => '<div class="db-item">'
       + '<span class="db-when">' + esc(dbWhen(x.m.start_date, x.m.end_date)) + '</span>'
       + '<span class="db-ttl">' + esc(x.inst.name || x.inst.code)
       + ' <span class="db-code">' + esc(x.inst.code) + '</span>'
       + ' <span class="db-dim">' + esc(x.role) + ' owner</span></span>'
       + '<span class="db-tag">maintenance</span></div>').join(''), 'now');
  // [REMOVED] the seminar group, which was the eighth plate in this bubble.
  return h;
}

function dbNextHtml(code, b){
  const abs = dbAbsences(code);
  let h = '';
  h += dbGroup('starts, next ' + DB_HORIZON + ' days', b.starts.map(t => dbTaskRow(t, dbWhen(t.start_date, t.end_date))).join(''), 'ahead');
  h += dbGroup('due, next ' + DB_HORIZON + ' days', b.due.map(t => {
    const t0 = today0(), hz = t0 + DB_HORIZON * DB_DAY;
    const d = dbDates(t).map(d2n).filter(n => n > t0 && n <= hz).sort((x,y)=>x-y)[0];
    return dbTaskRow(t, ddmmyy(d));
  }).join(''), 'ahead');
  h += dbGroup('away', abs.soon.map(a => dbAbsRow(a, code)).join(''), 'quiet');
  // v0.34.0. LAST, below away, and that position is the argument. There are no band headings
  // inside a bubble, so every group above reads as one sequence ordered by how soon it needs you,
  // and this is the only one with no answer to give. At the floor it leaves the dated work
  // contiguous above it and nothing moves down when it grows.
  // firstMark is the grid's own function, the soonest date that CONSTRAINS a task, and it is what
  // sorts the Unscheduled group there. A bare date in the when column would read as a start date,
  // which is the one thing these rows do not have, so it carries a preposition the way the
  // should-have-started group does.
  h += dbGroup('unscheduled / KIV', b.unscheduled.map(t => {
    const m = firstMark(t);
    return dbTaskRow(t, m === null ? 'no date' : 'by ' + ddmmyy(m));
  }).join(''), 'quiet');
  return h;
}

// v0.22.3: eight bubbles, one per roster member, all on screen. No picker, because there is
// nothing to pick: the tool shows the whole team and yours is first.
//
// EVERY member gets a bubble, INCLUDING one with nothing on. Decision 9 says an empty plate
// renders genuinely empty, and an empty bubble is exactly that: a name and nothing under it. It
// is not the same as omitting the person, which would make "nothing on" and "failed to load"
// look identical, and it is the overdue board's own rule (a clean chemist reads as a row of
// zeros rather than as an absence you have to notice).
//
// GRID, not columns. CSS multi-column packs tighter but fills column-major, which would put the
// fifth person top-right and destroy the ordering the row above exists to carry. align-items
// start, so a bubble is as tall as its own contents rather than as tall as its neighbour.
// v0.23.4. the admin, 24/07/26: "super awkward to have mentee mentor stuck between the tasks ...
// should be in parenthesis after the person's name." Right, and the fault was categorical rather
// than positional: mentor and mentee are a STANDING FACT (decision 11, static until changed), and
// anything rendered in the body of a bubble reads as work because everything else there is. No
// position inside the list would have fixed that; it had to leave the list.
// Both directions in one parenthesis, mentor first, because that is the one you act on.
// No UNOWNED special case, deliberately. Both lookups resolve against the roster, and
// '(unassigned)' is not on it, so the unassigned bubble gets no relation by the ordinary rule
// rather than by an exception. A mutation removing an explicit guard here changed nothing, which
// is the test telling you the guard was decoration; the same argument that keeps your own bubble
// top-left by the tie rule instead of by a branch.
function dbRelation(code){
  const mentor = dbMentorOf(code), mentees = dbMenteesOf(code), bits = [];
  if (mentor) bits.push('Mentor: ' + personName(mentor));
  if (mentees.length) bits.push((mentees.length > 1 ? 'Mentees: ' : 'Mentee: ')
    + mentees.map(personName).join(', '));
  return bits.length ? '<span class="db-rel">(' + esc(bits.join('; ')) + ')</span>' : '';
}

function dbBubbleHtml(code, i){
  const b = dbBuckets(code);
  const un = (code === UNOWNED);
  const body = dbTodayHtml(code, b) + dbNextHtml(code, b);
  // The tally rides the header, where it reads as a property of the person rather than as another
  // line of work. Not on the unassigned bubble, which is not a person: the tasks in it are
  // nobody's hours until somebody takes them, and a total there invites reading it as capacity
  // that exists.
  const hrs = un ? ''
    : '<span class="db-hrs" title="Hours committed today: the hrs/day on every task under way or '
      + 'past its start date, added up. A task shared by two people counts in full for each. '
      + 'Not a target and not a limit.">' + dbDayHours(b) + 'h today</span>';
  return '<div class="db-bub' + (dbIsMine(code) ? ' db-me' : '') + (un ? ' db-un' : '') + '" id="db-p-' + i + '">'
       + '<div class="db-bh">' + esc(un ? UNOWNED : personName(code))
       + (un ? '' : '<span class="db-code">' + esc(code) + '</span>')
       + dbRelation(code) + hrs + '</div>'
       + dbStatsHtml(b)
       + body + '</div>';
}

// ---------- packing ----------
//
// CSS grid gives every cell in a row the height of the tallest one, so a bubble holding a single
// absence line left ~110 CSS px of dead space under it whenever it shared a row with a five-task
// bubble. That is most of a bubble's worth of window, per short bubble, per row.
//
// align-items:stretch was the cheap answer and is the wrong one: it makes the bubbles equal by
// growing the short one, so the space is still gone, just inside the card rather than between
// cards. CSS column-count packs properly but hands the split to the browser and needs
// break-inside:avoid to stop a card being cut in half mid-list, which is a rule with a history of
// being honoured unevenly.
//
// So the columns are packed here. Each bubble is weighed, then dropped into whichever column is
// currently shortest, leftmost on a tie. Two consequences, both accepted deliberately:
//   - Yours is ALWAYS top-left. It is weighed first into empty columns, so it takes column 0 by
//     the tie rule, not by a special case.
//   - Left-to-right no longer reads as code order. You read down one column, then the other.
//     At eight people that is cheap; the alternative was paying a bubble of window per row.
//
// WEIGHED, not measured. Measuring means rendering, reading offsetHeight and re-rendering, and
// renderGrid already runs once while its tab is hidden, where every measurement reads zero (see
// checker lesson 3). The weight is derived from what the bubble actually emits, so it tracks the
// content rather than a guess: rows, group headings, the fact line, and a second line allowed for
// a title long enough to wrap. It only has to be right enough to balance, and being wrong makes a
// column slightly long, not the layout incorrect.
const DB_ROW_H = 19, DB_GRP_H = 14, DB_HEAD_H = 24, DB_PAD_H = 20, DB_WRAP_AT = 52;
function dbWeigh(html){
  const rows = (html.match(/class="db-item"/g) || []).length;
  const grps = (html.match(/class="db-gt"/g) || []).length;
  const stat = (html.match(/class="db-stats"/g) || []).length;
  const wraps = (html.match(/class="db-ttl">[^<]{53,}/g) || []).length;
  // v0.23.4 dropped the .db-facts term: the relation moved into the header, which DB_HEAD_H
  // already covers, so that term could only ever have counted zero. The counts row took its
  // place and is a real line every bubble now carries.
  return DB_HEAD_H + DB_PAD_H + rows * DB_ROW_H + grps * DB_GRP_H + stat * DB_ROW_H + wraps * DB_ROW_H;
}
// Pure, so a fixture can drive it without a DOM. Returns one array of html strings per column.
function dbPack(cards, cols){
  const n = Math.max(1, cols|0);
  const h = new Array(n).fill(0), out = Array.from({ length:n }, () => []);
  cards.forEach(c => {
    let k = 0;
    for (let i = 1; i < n; i++) if (h[i] < h[k]) k = i;   // strict <, so ties keep the leftmost
    out[k].push(c.html); h[k] += c.w;
  });
  return out;
}
// documentElement.clientWidth and NOT an element's own, because renderGrid's first run happens on
// a hidden tab where element widths are zero. The document always has a width.
function dbCols(){
  const w = (document.documentElement && document.documentElement.clientWidth) || 1280;
  return w < 1000 ? 1 : 2;
}

// ONE + task, not one per bubble. the admin, 24/07/26: "the +task button on the dashboard is a common
// one for all. because the dashboard allows changes in status. and + task is a change in status
// of sorts." That framing also settles the concern with the per-bubble version: a button on every
// bubble makes "put work on Tomas's plate" the most discoverable action in the tool, which is a
// different social object from opening a form and choosing owners. One button, no owner
// pre-filled, is the existing flow with a shorter route to it.
//
// It gates on APP.activeCode, like the grid's own + task and like every other write here. It does
// NOT open a second editor: it expands the task category, switches to the grid and calls the
// editor that already exists, which carries the both-or-neither date rule, the startOk mirror and
// the undated-terminal guard. A second task form on the dashboard is the "becomes a second
// interface to maintain" the scoping warned about.
// v0.23.8: the form opens HERE, in a modal, instead of routing to the grid (the admin, 24/07/26).
//
// I argued against a dashboard task form on the grounds that a second editor is a second thing to
// maintain. That argument stands and this does not breach it: the modal hosts tkHtml(), the SAME
// builder the grid uses, so there is one editor rendered in two places. Identical field ids means
// tkRead() and saveTk() work untouched, and every rule they carry comes along: the both-or-neither
// date constraint, the startOk mirror, the undated-terminal guard, the owner checkboxes, and the
// lot/LR reserve buttons.
//
// APP.editing.modal is the one new piece of state and it exists to stop a DUPLICATE. renderGrid
// draws the new-task editor inline in the task band whenever APP.editing.anchor is 'new', so a
// Refresh with the modal open would put a second element with id tk_title in the document, and
// getElementById returns the first in document order, which is the grid's empty copy. saveTk
// would then read blanks off a form nobody typed into.
// showModal and closeModal are inside the checksummed lift, so they are WRAPPED here rather than
// given a wide flag. Two three-line wrappers against re-lifting a 108-line block and re-deriving
// its hash is the cheaper trade, and it keeps the lift's rule intact: override from outside.
// The class is cleared on close and not on the next open, because leaving it set would give
// whichever short dialog opened next a 1080px shell for no reason its author could see.
function dbShowWide(html){
  showModal(html);
  const b = document.getElementById('modalBody'); if (b) b.classList.add('modal-wide');
}
function dbCloseModal(){
  const b = document.getElementById('modalBody'); if (b) b.classList.remove('modal-wide');
  closeModal();
}

function dbNewTask(){
  if (!APP.activeCode){ toast('Adding tasks is for active members.'); return; }
  APP.editing = { kind:'tk', id:null, anchor:'new', modal:true, title:'', product:'', status:'',
                  start_date:'', end_date:'', due_date:'', review_due:'', approve_due:'',
                  effort:8, reference:'', notes:'', owners:[] };
  dbShowWide('<div class="modal-title">New task</div>' + tkHtml());
  setTimeout(() => { tkHint(); const e = document.getElementById('tk_title'); if (e) e.focus(); }, 0);
}

function renderDash(){
  const order = dbOrder();
  if (!order.length) return '';
  const codes = order.map(p => p.code);
  // The unassigned bubble is appended only when it has something in it, so on a tidy week it is
  // simply not there. Last, because it is not a person and does not belong among them, which is
  // the same position and the same reason the overdue board gave it.
  const unB = dbBuckets(UNOWNED);
  if (Object.keys(unB).some(k => unB[k].length)) codes.push(UNOWNED);
  const cards = codes.map((c, i) => { const html = dbBubbleHtml(c, i); return { html:html, w:dbWeigh(html) }; });
  const cols = dbPack(cards, dbCols());
  return dbStripHtml()
       + '<div class="db-cols">'
       + cols.map(c => '<div class="db-col">' + c.join('') + '</div>').join('')
       + '</div>';
}

// ---------- the two dashboard actions, and only these two ----------
// update_schedule_item has no defaulted params, so a status change has to send the whole row
// back. Rebuilt off APP.tasks, not off a form: there is no form here. Named p and not args so
// the ARG SET fixture, which anchors on saveTk's literal, cannot match this one instead.
async function dbSetStatus(id, status){
  const t = (APP.tasks || []).find(x => String(x.id) === String(id));
  if (!t) { toast('That task is no longer there. Reloading.'); await loadTasks(); renderGrid(); return; }
  if (!dbMayEdit(t)) { toast('That task is not yours to change.'); return; }
  const before = t.status;
  t.status = status; renderGrid();          // optimistic, same as saveTk
  const p = { p_id:t.id, p_title:t.title, p_product:t.product || null, p_status:status,
              p_start_date:t.start_date || null, p_end_date:t.end_date || null,
              p_due_date:t.due_date || null, p_notes:t.notes || null,
              p_review_due:t.review_due || null, p_approve_due:t.approve_due || null,
              p_effort:(t.effort_hours == null ? 8 : t.effort_hours),
              p_reference:t.reference || null };
  const { error } = await sb.rpc('update_schedule_item', p);
  if (error){ t.status = before; renderGrid(); toast(error.message || 'The status did not save.'); return; }
  loadTasks().then(renderGrid);
}

// v0.30.0. The THIRD writer of update_schedule_item, and the third to build the whole row by
// hand for the same reason: the function has no defaulted parameters, so a partial payload does
// not leave the other columns alone, it nulls them. Duplicated rather than folded into a shared
// builder with dbSetStatus, deliberately. The logic checker evals these functions out of the
// file by name, so a shared dependency is a harness edit every time, and the RPC ARG SET fixture
// now walks EVERY dashboard payload rather than the first it finds, which is what actually keeps
// the three in step. Named p, not args, so the fixture anchored on saveTk's literal cannot match
// this one instead.
//
// Clamped here as well as on the way in. Every value reachable through the select is already
// legal, so this catches nothing a user can do; it catches the next caller, and the clamp is
// what saveTk does with the same field.
async function dbSetEffort(id, hours){
  const t = (APP.tasks || []).find(x => String(x.id) === String(id));
  if (!t) { toast('That task is no longer there. Reloading.'); await loadTasks(); renderGrid(); return; }
  if (!dbMayEdit(t)) { toast('That task is not yours to change.'); return; }
  const before = t.effort_hours;
  const eff = Math.max(0, Math.min(DB_EFFORT_MAX, Number(hours) || 0));
  t.effort_hours = eff; renderGrid();       // optimistic, same as dbSetStatus
  const p = { p_id:t.id, p_title:t.title, p_product:t.product || null, p_status:t.status,
              p_start_date:t.start_date || null, p_end_date:t.end_date || null,
              p_due_date:t.due_date || null, p_notes:t.notes || null,
              p_review_due:t.review_due || null, p_approve_due:t.approve_due || null,
              p_effort:eff,
              p_reference:t.reference || null };
  const { error } = await sb.rpc('update_schedule_item', p);
  if (error){ t.effort_hours = before; renderGrid(); toast(error.message || 'The hrs/day did not save.'); return; }
  loadTasks().then(renderGrid);
}

// [REMOVED] dbPwReady, the one seminar write the dashboard offered (planning -> ready). It went
// with the tab that owns the rest of that editor.

// Hoisted out of renderGrid in v0.20.23 so the board view can use it too. A board that reports
// "0 late tasks" because the schedule_items read FAILED is the worst lie in the tool: it is the
// reassuring answer, given confidently, from no data.
function eb(label, e){ return '<div class="errbox">' + label + ': ' + esc((e.code?e.code+': ':'') + e.message) + '</div>'; }

// The OVERDUE board's own view. Kept out of renderGrid (v0.20.23) because the board now owns a
// tab: above the grid it was costing ~250 CSS px of a ~645 px page every day to say "nothing is
// late" six days in seven.
function renderBoard(){
  const el = document.getElementById('view-board');
  if (!el) return;
  const t = overdueTally();
  // The count rides the TAB, so the alert is still legible from the schedule tab. Putting the
  // board behind a tab is what makes this necessary: an alert you have to go and look for is a
  // report, not an alert.
  const tb = document.getElementById('tab-board');
  // "Tasks (3 late)", not "Tasks (3)". The tab carries two boards now, so a bare number would
  // read as a task count rather than an alert, which is the opposite of what it is for. The word
  // is what keeps the alert legible from the Schedule tab, which is the whole reason it rides
  // the tab at all.
  // v0.23.7: "Dashboard", not "Tasks" (the admin, 24/07/26). The tab has not been a task list since
  // v0.22.0 and the label was the last thing still calling it one. The count stays on it: it is
  // the only alert legible from the Schedule tab, which is the whole reason overdueTally survived
  // the board's removal.
  if (tb) tb.textContent = t.total ? 'Dashboard (' + t.total + ' late)' : 'Dashboard';
  // Recomputed here, not cached at load. today0() is what every bucket on this page measures
  // against, so printing anything else would be a header disagreeing with the rows under it.
  const tdEl = document.getElementById('tabdate');
  if (tdEl){
    const n = today0();
    tdEl.textContent = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n2d(n).getUTCDay()] + ' ' + ddmmyy(n);
  }
  // The tab count stays OVERDUE only. The second board is context, not an alert, and a tab that
  // counted both would report a number nobody is meant to act on.
  // v0.22.0: the dashboard goes first and the two team boards become band 4 under it. Both
  // boards stay, not just the overdue one. Decision 6 keeps "the existing overdue tally", and
  // the existing thing on this tab is a PAIR whose whole argument is that they are read across:
  // every open task is in exactly one of them, so the totals reconcile. Dropping half of a
  // deliberately complementary pair loses that and is a bigger change than the scoping asked
  // for. One line to reverse if it reads as too much under the personal section.
  // v0.23.0: the two team boards are GONE. the admin, 24/07/26: "the overdue board can be phrased
  // this way and removed entirely." He is right that it had become a summary of information the
  // bubbles now show in full, and decision 6's own reason (seeing someone else is late is how the
  // team self-corrects) is served better by the late tasks themselves than by a count of them.
  // Three things went with it. One is replaced, one survives, one is simply paid:
  //   - The (unassigned) row is REPLACED. A per-person rollup is exactly where an ownerless task
  //     vanishes, which is why the board carried that row at all. renderDash emits an unassigned
  //     bubble instead, on the same reasoning: an overdue task nobody owns is the worst case.
  //   - overdueTally SURVIVES, for the tab count and nothing else. It is the one thing the board
  //     did that a bubble cannot: be legible from the Schedule tab.
  //   - The RECONCILIATION property is paid. Overdue plus current summed to every open task, so
  //     "did one fall between them" was checkable by adding two numbers. Nothing replaces it.
  //     Worth knowing it was spent rather than discovering later that it is missing.
  el.innerHTML = (APP.taskErr ? eb('schedule_items', APP.taskErr) : '')
               + (APP.ownErr  ? eb('item_owners', APP.ownErr)   : '')
               + renderDash();
}

// ============================================================
// STANDING  (v0.25.0)  -  read-only, roster-wide
//
// The one-view lists the roster sheet used to give, and the loss the migration made plain: the
// dashboard answers "what is on MY plate", but the sheet answered "where does everything sit for
// the whole year", and nothing in the tool did until now.
//
// Three panels, in the order people ask:
//   1. Duties, the full year. GENERIC OVER DUTY TYPE exactly as the strip is: one section per
//      active type, grouped by period, nothing naming housekeeping or KYT. Anchored on today, so
//      the current period reads first and past periods dim above it rather than vanishing.
//   2. Standing roles, five rows, main and backup. Its first read surface anywhere but admin.
//   3. Instrument owners, grouped BY OWNER the way the sheet grouped them and the way the question
//      is asked ("what is Tomas on"), not one row per instrument.
//
// Reads only data reloadAll already loaded: APP.duties/dutyTypes, APP.standing, APP.lists.
// instruments. No RPC, no new load on this path.
// ============================================================

// Every period of every active duty type, grouped by type then period, two names on one week
// folded to one row. Same fold as dbDutyNow, but across the whole table rather than today only,
// and it keeps past periods (dimmed by the caller) rather than filtering to the live window.
function stDutyPeriods(){
  const types = {}, out = [];
  (APP.dutyTypes || []).forEach(t => { if (t.active) types[t.code] = t; });
  const byType = {};
  (APP.duties || []).forEach(d => {
    const ty = types[d.duty_type];
    if (!ty || !d.start_date || !d.end_date) return;
    const k = d.duty_type + '|' + d.start_date + '|' + d.end_date;
    if (!byType[ty.code]) byType[ty.code] = {};
    if (!byType[ty.code][k]) byType[ty.code][k] = { start:d.start_date, end:d.end_date, who:[], notes:{} };
    const g = byType[ty.code][k];
    g.who.push(d.person);
    // v0.29.0. The topic is PER PERSON. v0.26.0 folded it to one note on the period and raised
    // noteSplit when the two rows disagreed, because the writer of the day forced them equal and
    // a disagreement meant something had gone round it. KYT has two submitters making two
    // submissions, so two different topics is the normal case, not a fault. noteSplit is gone
    // rather than left always-true, and the note is keyed by person.
    if (d.note != null && String(d.note) !== '') g.notes[d.person] = d.note;
  });
  Object.keys(types).forEach(code => {
    const ty = types[code], periods = Object.values(byType[code] || {});
    periods.forEach(p => p.who.sort());
    periods.sort((a, b) => d2n(a.start) - d2n(b.start));
    out.push({ type:ty, periods:periods });
  });
  out.sort((a, b) => (a.type.sort_order || 0) - (b.type.sort_order || 0)
                  || String(a.type.code).localeCompare(String(b.type.code)));
  return out;
}

// Owner -> the instruments they are main on, each carrying its backup. Grouped by main only:
// the sheet groups by main, and a person appearing under their own main list and again under
// every instrument they back would read as busier than they are. Backup is shown on the row.
function stInstrumentsByOwner(){
  const insts = (APP.lists.instruments || []).filter(i => i.active && i.owner_main);
  const by = {};
  insts.forEach(i => { (by[i.owner_main] = by[i.owner_main] || []).push(i); });
  const owners = Object.keys(by).sort((a, b) => personName(a).localeCompare(personName(b)));
  owners.forEach(o => by[o].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)
                                        || String(a.code).localeCompare(String(b.code))));
  const orphan = (APP.lists.instruments || []).filter(i => i.active && !i.owner_main)
                   .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)
                                || String(a.code).localeCompare(String(b.code)));
  return { owners:owners, by:by, orphan:orphan };
}

// v0.27.0. Days of a duty period that a person is actually away for.
//
// Absences come off APP.grid, category 'absence', which is what dbAbsences reads and what the
// wall draws. There is no second definition of away in this file and this does not add one.
//
// Counted in days rather than reported as a boolean because the severity IS the number: the
// worked example is Priya on housekeeping 20/07 to 24/07 with her secondment starting on the
// Friday, which is one day of five and a shrug. Five of five is somebody else covering. A flag
// that reads the same for both would be noise.
//
// Deliberately NOT a block and NOT a warning on write. Public holidays and maintenance windows
// are visual-only in this tool and duties are ambient; this is the same posture. It tells you a
// swap is worth considering. It never refuses one.
function stAwayDays(code, start, end){
  const st = d2n(start), en = d2n(end);
  const abs = (APP.grid || []).filter(b => b.category === 'absence' && b.person_code === code
    && b.start_date && b.end_date);
  if (!abs.length) return 0;
  let days = 0;
  for (let t = st; t <= en; t += DB_DAY){
    if (abs.some(b => d2n(b.start_date) <= t && d2n(b.end_date) >= t)) days++;
  }
  return days;
}

// Total days a period spans, inclusive of both ends. The denominator for the above.
function stSpanDays(start, end){
  return Math.round((d2n(end) - d2n(start)) / DB_DAY) + 1;
}

function renderStanding(){
  const el = document.getElementById('view-standing');
  if (!el) return;
  const t0 = today0();
  let h = '';

  // ---- panel 1, duties, full year ----
  h += '<div class="st-panel"><div class="st-h">Duties</div>';
  if (APP.dutyErr){ h += eb('duty_assignments', APP.dutyErr); }
  const duties = stDutyPeriods();
  const anyDuty = duties.some(d => d.periods.length);
  if (!anyDuty){
    h += '<div class="st-empty">No duties scheduled.</div>';
  } else {
    duties.forEach(d => {
      if (!d.periods.length) return;
      h += '<div class="st-sub">'
         + (d.type.colour ? '<i class="db-dot" style="background-color:' + esc(d.type.colour) + '"></i>' : '')
         + esc(d.type.name) + '</div>';
      // A type whose end_date is a DEADLINE rather than the far end of a working window is the
      // one that carries show_final_days: that setting exists to hold the strip back until the
      // reminder is due, so it is the type's own declaration that the closing date is the point
      // that matters. Nothing here names KYT; set show_final_days on any type and it reads the
      // same way. HK has it null, so HK shows a span and no due date.
      const due = d.type.show_final_days != null;
      // A long type flows into columns; a short one does not. 51 housekeeping weeks in a
      // full-width table is a column of dates beside an acre of nothing, and 51 rows of scroll.
      // Four KYT quarters split across columns would be worse than leaving them alone, so the
      // threshold is on the count rather than applied to everything.
      h += '<div class="st-list' + (d.periods.length > 10 ? ' st-cols' : '') + '">';
      d.periods.forEach(p => {
        const st = d2n(p.start), en = d2n(p.end);
        const live = t0 >= st && t0 <= en, past = en < t0;
        const cls = live ? ' st-live' : (past ? ' st-past' : '');
        // The span is the row's date cell; the point is called out separately, so a deadline
        // type shows BOTH and a window type shows only the span it actually occupies.
        let mark = '', near = false;
        if (due){
          const days = Math.round((en - t0) / DB_DAY);
          // The reminder window is the type declaring when its deadline becomes news, so it is
          // also when the mark should read as urgent. Outside it the day count is useful but not
          // pressing: a topic due in 310 days is not the same colour as one due in 11.
          near = !past && t0 >= en - (d.type.show_final_days - 1) * DB_DAY;
          mark = past ? 'closed'
               : (days === 0 ? 'due today'
               : (days === 1 ? 'due tomorrow' : 'due in ' + days + ' d'));
        } else if (live){
          mark = 'current';
        }
        // Who on this period is away during it, and for how much of it.
        const span = stSpanDays(p.start, p.end);
        const clash = p.who.map(c => ({ code:c, days:stAwayDays(c, p.start, p.end) }))
                           .filter(x => x.days > 0)
                           .sort((a,b) => b.days - a.days);
        h += '<div class="st-p' + cls + (due ? ' st-due' : '') + (near ? ' st-near' : '') + '">'
           + '<div class="st-pl">'
           + '<span class="st-when">' + esc(dbWhen(p.start, p.end)) + '</span>'
           + '<span class="st-who">' + esc(p.who.map(personName).join(', ')) + '</span>'
           + '<span class="st-now">' + esc(mark) + '</span>'
           + '</div>'
           // One line per submitter, because each of them submits their own. A name with nothing
           // against it is the one still to be set, which is the whole reason to show it by name
           // rather than as a single "topic not set" for the period.
           + (due ? p.who.map(c => '<div class="st-note' + (p.notes[c] ? '' : ' st-todo') + '">'
               + esc(personName(c)) + ': ' + esc(p.notes[c] || 'topic not set')
               + '</div>').join('')
             : p.who.filter(c => p.notes[c]).map(c => '<div class="st-note">'
               + esc(personName(c)) + ': ' + esc(p.notes[c]) + '</div>').join(''))
           + clash.map(x => '<div class="st-clash' + (x.days >= span ? ' st-clash-all' : '') + '">'
               + esc(personName(x.code)) + ' away '
               + (x.days >= span ? 'the whole period' : x.days + ' of ' + span + ' d')
               + '</div>').join('')
           + '</div>';
      });
      h += '</div>';
    });
  }
  h += '</div>';

  // Roles and instrument owners are both short; they share a row below the full-width duties.
  h += '<div class="st-two">';

  // ---- panel 2, standing roles ----
  h += '<div class="st-panel"><div class="st-h">Standing roles</div>';
  if (APP.standingErr){ h += eb('standing_roles', APP.standingErr); }
  const roles = (APP.standing || []).filter(r => r.active)
                  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)
                               || String(a.code).localeCompare(String(b.code)));
  if (!roles.length){
    h += '<div class="st-empty">No standing roles.</div>';
  } else {
    h += '<table class="st-tbl"><thead><tr><th>Role</th><th>Main</th><th>Backup</th></tr></thead><tbody>';
    roles.forEach(r => {
      h += '<tr class="st-row">'
         + '<td class="st-role">' + esc(r.name || r.code) + '</td>'
         + '<td class="st-who">' + esc(r.main ? personName(r.main) : '') + '</td>'
         + '<td class="st-who st-dim">' + esc(r.backup ? personName(r.backup) : '') + '</td>'
         + '</tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  // ---- panel 3, instrument owners ----
  h += '<div class="st-panel"><div class="st-h">Instrument owners</div>';
  if (APP.listErr && APP.listErr.instruments){ h += eb('instruments', APP.listErr.instruments); }
  const io = stInstrumentsByOwner();
  if (!io.owners.length && !io.orphan.length){
    h += '<div class="st-empty">No instruments.</div>';
  } else {
    io.owners.forEach(o => {
      h += '<div class="st-sub">' + esc(personName(o)) + '</div>';
      h += '<table class="st-tbl"><tbody>';
      io.by[o].forEach(i => {
        h += '<tr class="st-row">'
           + '<td class="st-role">' + esc(i.name || i.code)
           + ' <span class="db-code">' + esc(i.code) + '</span>'
           // Owned but not booked. Says why the item has no lane on the Schedule grid, which is
           // otherwise the obvious next question when you find it listed here and nowhere else.
           + (i.bookable === false ? ' <span class="st-tag">no booking</span>' : '')
           + '</td>'
           + '<td class="st-who st-dim">'
           + (i.owner_backup ? 'backup ' + esc(personName(i.owner_backup)) : '') + '</td>'
           + '</tr>';
      });
      h += '</tbody></table>';
    });
    if (io.orphan.length){
      h += '<div class="st-sub st-dim">Unowned</div>';
      h += '<table class="st-tbl"><tbody>';
      io.orphan.forEach(i => {
        h += '<tr class="st-row"><td class="st-role">' + esc(i.name || i.code)
           + ' <span class="db-code">' + esc(i.code) + '</span></td><td class="st-who"></td></tr>';
      });
      h += '</tbody></table>';
    }
  }
  h += '</div>';  // instrument owners panel
  h += '</div>';  // st-two

  el.innerHTML = h;
}

function renderGrid(){
  const el = document.getElementById('view-grid');
  // Every mutation and every load already ends in renderGrid, so driving the board from here
  // keeps the two views in step through one line instead of twenty call sites, each of which is
  // a chance to update the grid and leave the board stale.
  renderBoard();
  // v_grid or schedule_items failing means no grid. item_owners failing does NOT: the grid
  // still renders and every task just shows no owner, which is exactly the loud version of
  // the failure Block 6 would otherwise hit silently. Show it and carry on.
  if (APP.gridErr || APP.taskErr){
    el.innerHTML = (APP.gridErr ? eb('v_grid', APP.gridErr) : '')
                 + (APP.taskErr ? eb('schedule_items', APP.taskErr) : '');
    return;
  }
  const ownBox = APP.ownErr ? eb('item_owners', APP.ownErr) : '';
  // Training, like item_owners, is non-fatal: the grid renders and training just does not show,
  // with the error loud rather than a silently empty TRAINING category.
  const trainBox = APP.trainErr ? eb('training', APP.trainErr) : '';
  // v_load failing does not kill the schedule view, so it is not in the block above. It is only
  // fatal to the view that reads it, and there it is loud rather than an empty grid of free
  // chemists, which is the one lie this view must never tell.
  const loadBox = (APP.view === 'load' && APP.loadErr) ? eb('v_load', APP.loadErr) : '';

  // The innerHTML at the end of this function destroys #gridwrap, and a new element opens at
  // 0/0. v0.6 restored the position only on the FIRST render, so every render after it threw
  // the view to the far left and the top. Capture before, restore after.
  const prev = document.getElementById('gridwrap');
  const keep = prev ? { l: prev.scrollLeft, t: prev.scrollTop } : null;

  const bars = visibleBars();
  const markDates = visibleTasks().reduce((a, t) => a.concat(marksOf(t).map(m => d2n(m.date))), []);
  const W = windowOf(bars, markDates);
  const px = n => (n - W.start)/DAY * DAY_W;
  const gw = W.days * DAY_W;
  APP.gw = gw;          // colHover needs the track's extent to know when it has left it
  colDay = -1;          // the element below is about to be rebuilt hidden; forget where it was

  // legend: statuses only. The category colours are three, and each one sits inside a
  // labelled category, so a legend entry for them would be noise. Section 6 wants four or
  // five statuses on screen, not twenty undocumented fills.
  // PRODUCTS first: hue is the loudest thing on the grid and this is what it means.
  // Only coloured ones. A product with no colour draws grey, which is what "no product" draws,
  // so listing it with a grey swatch would claim a distinction that does not exist.
  // THE LEGEND SWAPS WITH THE BODY, and that is what makes --over legal. While the load view is
  // up there is not a single product hue on the screen, so hue-means-product is not in force and
  // red is free to mean wrong. Were load a category INSIDE the grid instead of a mode replacing
  // it, neither the accent ramp nor the red would be allowed. Products, statuses and marks are
  // also simply not what this view is about: every swatch would be noise.
  let lg = '';
  if (APP.view === 'load'){
    // WORKLOAD, not LOAD. The button says workload and the band says WORKLOAD, and three names
    // for one thing is how a room ends up unsure whether they are the same thing.
    const sw = v => '<span class="lg-ramp" style="background-color:rgba(var(--load-rgb),' + loadAlpha(v).toFixed(3) + ')"></span>';
    const it = (tip, inner) => '<span class="lg" title="' + esc(tip) + '">' + inner + '</span>';
    lg = '<div class="legend" title="One row per chemist. How much of each day is already spoken for.">'
       + '<span class="legend-lab">WORKLOAD</span>'
       + it('0.25 of a chemist\'s day. A task with four owners gives each of them a quarter of it.',
            sw(0.25) + '<span>quarter</span>')
       + it('0.5 of a chemist\'s day. A task with two owners gives each of them a half.',
            sw(0.5) + '<span>half</span>')
       + it('1.0. One task with one owner. An instrument booking always counts as a full day, whoever else is on it.',
            sw(1) + '<span>one full commitment</span>')
       + it('More than one full commitment on a single day. A flat colour rather than a darker blue, '
            + 'because the ramp stops at 1.0 on purpose: the room decides over or not over, never 2.5 '
            + 'against 3.0. Hover the block itself for the exact figure and what makes it up.',
            '<span class="lg-ramp" style="background-color:var(--over)"></span><span>over</span>')
       // The state that closes section 8's trap, and it needs saying out loud in the tooltip too:
       // zero is what a free chemist sums to AND what someone on leave sums to.
       + '<span class="lg-sep"></span>'
       + it('An absence and scheduled work on the same day: someone has put work across this chemist\'s '
            + 'leave. The sharpest thing this view can tell you, and the reason away is a texture rather '
            + 'than a number.',
            '<span class="lg-ramp away" style="background-color:rgba(var(--load-rgb),' + loadAlpha(0.5).toFixed(3) + ')"></span><span>away, and still carrying work</span>')
       + it('An absence. Leave carries no load, so this row sums to ZERO, exactly like a free chemist\'s '
            + 'does. The hatch is the only thing that tells them apart.',
            '<span class="lg-ramp away"></span><span>away</span>')
       + '</div>';
  } else {
  // v0.13.2: a tooltip on every legend item that carries a meaning the swatch cannot. Product
  // swatches are exempt: a colour next to a code IS the sentence. The rest are not self-evident
  // to anyone who did not build this, which is the same reason the legend exists at all.
  const prds = APP.lists.products.filter(p => p.active && p.colour);
  lg = '<div class="legend"><span class="legend-lab" title="Hue is the product, and only the product. Every bar takes its product\'s colour, whatever it is and whoever is on it. No product draws grey.">PRODUCTS</span>';
  lg += prds.length ? prds.map(p => '<span class="lg" title="' + esc('Every bar for ' + p.code + ' draws in this colour: campaigns, tasks and instrument bookings alike.')
      + '"><i style="background:' + esc(p.colour)
      + '"></i><span>' + esc(p.code) + '</span></span>').join('')
    : '<span class="lg" style="color:var(--muted)">none coloured yet: every bar draws grey. Setup, panel 4.</span>';

  // The texture swatch is deliberately HUE-NEUTRAL. It says how a status is drawn, and the hue
  // is the product's to say. Colouring these would put two meanings back in one channel, which
  // is the thing this whole version undoes.
  const sts = APP.lists.task_statuses.filter(s => s.active);
  // background-COLOR here too, for the same reason as the bars: a cancelled status's swatch
  // carries .lg-strike, whose strike is a background-image, and an inline background shorthand
  // would reset it. The swatch is grey (var(--text2)) rather than a hue because the legend
  // teaches the TEXTURE, and the hue is the product's to say, not the status's.
  const texSw = t => t === 'outline' ? '<i class="bar out" style="position:static;box-shadow:inset 0 0 0 1.5px var(--text2)"></i>'
                   : t === 'faded'   ? '<i class="bar fade" style="position:static;background-color:var(--text2)"></i>'
                   :                   '<i class="bar" style="position:static;background-color:var(--text2)"></i>';
  lg += '<span class="lg-sep"></span><span class="legend-lab" title="Texture is the status: outline, solid, faded. The hue stays the product\'s, so a bar tells you what it is AND how far along it is at once.">STATUS</span>';
  lg += sts.length ? sts.map(s => '<span class="lg' + (s.cancelled ? ' lg-strike' : '') + '" title="'
      + esc(s.value + '. Drawn ' + (s.texture || 'solid') + ', in its product\'s colour.'
            + (s.cancelled ? ' Cancelled: struck through, the work stopped and nothing came of it.' : '')
            + (s.is_terminal ? ' Completed: hidden from the grid AND the workload view unless "hide completed" is unticked.' : ''))
      + '">' + texSw(s.texture || 'solid')
      + '<span>' + esc(s.value) + '</span></span>').join('')
    : '<span class="lg" style="color:var(--muted)">none yet</span>';
  // The toggle belongs with the statuses, since that is what it acts on. It used to be pushed
  // to the far right by margin-left:auto, which read as "over there somewhere" at 1450px and
  // as "off the screen" once .wrap was widened.
  if (sts.some(s => s.is_terminal))
    lg += '<label class="lg-tog" title="Ticked, completed work is out of sight, which is the default. Untick to bring it back onto the grid; it returns to the workload view too, from the same set, so the numbers cannot say one thing while the wall says another.">'
        + '<input type="checkbox" class="tick" ' + (APP.hideCompleted?'checked':'')
        + ' onclick="setHideCompleted(this.checked)">hide completed</label>';
  // Shown only when it is actually hiding something, and it names the number. A filter that
  // silently removes rows and gives no way back is how people stop believing the wall; a count
  // makes the omission visible without spending any room when there is nothing to say.
  const arc = archivedCount();
  if (arc || APP.showArchived)
    lg += '<label class="lg-tog" title="Finished work (completed or cancelled) whose last date is more than six weeks past is off the wall by default, so the grid does not grow a row for every task ever created. Nothing is deleted and nothing is flagged on the server: this is a view filter and this tick brings it all back. Unfinished work NEVER archives, however old, which is the point.">'
        + '<input type="checkbox" class="tick" ' + (APP.showArchived?'checked':'')
        + ' onclick="setShowArchived(this.checked)">show archived (' + arc + ')</label>';
  // No campaign swatch and, as of v0.10, no booking swatch either. Both draw in their product's
  // hue now, so a fixed swatch labelled "booking" would be false for every booking that has a
  // product. Same reasoning v0.6 used to drop the campaign swatch, one category later.
  // "away" survives it: an absence has no product and never will, so grey hatched is always
  // true. Position says the rest, since a booking sits under INSTRUMENTS and nothing else does.
  lg += '<span class="lg-sep"></span>'
      + '<span class="lg" title="An absence. Grey hatched always, and it is the one swatch that can never be wrong: an absence has no product and never will.">'
      + '<i class="bar ab" style="position:static"></i><span>away</span></span>';
  // H is not self-evident to anyone who did not build this, and the legend exists precisely
  // because 20 undocumented fills work in one person's head and not on a wall.
  // A span, not an <i>: .lg i is (0,1,1) and would override .mark's width and height. That is
  // the same cascade that stacked the owner chips, one rule later.
  const markTip = [
    'A date someone outside the team is holding you to. It is not the team\'s working time, which is what the bar is, so it is a mark ON the day rather than a bar reaching to it.',
    'The date the work has to be with the reviewer. Same rule: a mark, not a bar.',
    'The date approval has to be done by. Same rule: a mark, not a bar.'
  ];
  lg += '<span class="lg-sep"></span><span class="legend-lab" title="A mark is a date the team does not own. The bar is the team\'s own working time; a mark is somebody else\'s deadline sitting on the same axis. A mark turns red once the bar has run past it.">MARKS</span>'
      + ['H','R','A'].map((c, i) => '<span class="lg" title="' + esc(markTip[i]) + '"><span class="mark" style="position:static">' + c
      + '</span><span>' + ['hard deadline','review due','approve due'][i] + '</span></span>').join('');
  lg += '</div>';
  }

  // ONE gate for BOTH legends (the grid's and the workload view's), applied after the branch
  // rather than inside each: two copies of "is the legend showing" is how one of them ends up
  // answering differently. The toggle bar always draws, so the control sits in the same place
  // whichever state it is in; collapsed, that bar is the whole cost, about 22 CSS px against the
  // card's ~90.
  const legToggle = '<div class="lgbar"><button class="lg-toggle" onclick="toggleLegend()"'
    + ' title="The legend is a reference card: what the colours, textures and letters mean. Read'
    + ' once while learning the wall, then folded away. It remembers whether you left it open.">'
    + (APP.showLegend ? 'legend \u2212' : 'legend +') + '</button></div>';
  lg = legToggle + (APP.showLegend ? lg : '');
  // header: month band, day numbers, today marker
  let mon = '', day = '';
  let c = W.start;
  while (c <= W.end){
    const d = n2d(c), m0 = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    const next = Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1);
    const from = Math.max(m0, W.start), to = Math.min(next - DAY, W.end);
    mon += '<div class="gmon" style="left:' + px(from) + 'px;width:' + ((to-from)/DAY+1)*DAY_W + 'px">'
         + MON[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2) + '</div>';
    c = next;
  }
  for (let n = W.start, i = 0; n <= W.end; n += DAY, i++){
    const wd = n2d(n).getUTCDay();
    const hol = APP.holidays[n2d(n).toISOString().slice(0,10)];
    day += '<div class="gday' + (wd===0||wd===6?' we':'') + (hol?' hol':'') + '"'
         + (hol ? ' title="' + esc(hol) + '"' : '')
         + ' style="left:' + (i*DAY_W) + 'px;width:' + DAY_W + 'px">'
         + n2d(n).getUTCDate() + '</div>';
  }
  const t = today0();
  const nowIn = t >= W.start && t <= W.end;
  const nowPx = px(t) + DAY_W/2;
  // ONE source for "where today sits". The open-scroll rule below and goToday() are the same
  // question asked twice, and a second copy of this expression is the MS_DEFAULT trap exactly,
  // in a place no checker looks. Same fix as --dayw and --markw: one source, nothing to drift.
  APP.todayX = nowIn ? Math.max(0, px(t) - PAST_DAYS*DAY_W) : 0;

  // weekend bands and month rules, drawn once and reused in every track
  let bg = '';
  for (let n = W.start, i = 0; n <= W.end; n += DAY, i++){
    const wd = n2d(n).getUTCDay();
    if (wd === 6) bg += '<div class="wk" style="left:' + (i*DAY_W) + 'px;width:' + (2*DAY_W) + 'px"></div>';
    if (n2d(n).getUTCDate() === 1 && n > W.start) bg += '<div class="mb" style="left:' + (i*DAY_W) + 'px"></div>';
    // Holiday band last in the iteration, so on a weekend holiday it paints over the .wk.
    if (APP.holidays[n2d(n).toISOString().slice(0,10)]) bg += '<div class="hol" style="left:' + (i*DAY_W) + 'px;width:' + DAY_W + 'px"></div>';
  }
  if (nowIn) bg += '<div class="now" style="left:' + (nowPx-1) + 'px"></div>';

  const rowHtml = (r, indent) => {
    const L = lanes(r.bars);

    // Marks are placed BEFORE the bars are drawn, because whether a chip lands on a bar is
    // what decides this row's height.
    // A mark before the cutoff is not drawn. A bar can be clipped and squared because it has a
    // span to continue; a chip is a point and there is no honest way to draw one off-grid. The
    // tooltip still carries every mark, cutoff or not.
    const mk = nudgeMarks((r.marks || []).filter(m => d2n(m.date) >= W.start)
                                         .map(m => ({ m:m, x: px(d2n(m.date)) + DAY_W/2 - MARK_W/2 })));

    // Does any chip land on any bar? A chip is opaque, so on a short bar it does not clip the
    // owner codes, it erases them: IPB under an H reads as G. When that happens the marks take
    // a lane of their own and THIS ROW ALONE grows by LANE_H.
    // Adaptive on purpose. Under the admin's rule all three marks normally fall to the RIGHT of the
    // bar's end (the writing finishes, then review, then approval; a bar ends days BEFORE a
    // hard deadline), so the common row stays 32px on the axis the meeting traverses. A chip
    // ON the bar means the work runs past that mark, which is the row worth drawing the eye to
    // anyway, so paying 22px exactly there is the right place to pay it.
    // EVERY ROW IS UNIFORM. The chip always sits on the bar's own lane and the row never grows.
    // v0.8.3 to v0.9.4 bumped the marks to a lane of their own when a chip landed on a bar,
    // because an opaque chip eats the owner codes: IPB under an H reads as G. the admin retired it
    // 16/07/26 on the arithmetic: a task carrying review and approval is at LEAST three days,
    // so 60px of bar, and the owner codes span barely one day at the bar's LEFT edge. A chip is
    // 13px and its position is its DATE, so a mark inside the bar sits near the bar's END,
    // where there is no text. The collision is possible and not likely, and the bump paid 13px
    // on every affected row to insure against it.
    // "the human eyes love uniformity" - and uniform rows are worth more than an edge case.
    // marksHitBars() and the box arithmetic are deleted rather than left unused: dead code that
    // once decided a layout is the thing a future session resurrects by accident.
    const markTop = ROW_PAD + 3;
    const h = ROW_PAD + L.count*LANE_H + ROW_PAD;

    let inner = bg;
    L.bars.forEach(b => {
      const s = d2n(b.start_date), e = d2n(b.end_date || b.start_date);
      // Entirely before the cutoff: nothing to draw. The ROW stays, because age is not a reason
      // to hide a task. is_terminal is the mechanism for dropping finished work and this is not
      // it; a still-open task whose dates are all more than a year old is a data-quality tell,
      // and an empty row is the tool saying so rather than the tool forgetting.
      if (e < W.start) return;
      // Straddles the cutoff: draw FROM the cutoff and square the left corner, the Gantt
      // convention for "continues off this edge".
      // Not clamping and letting the browser clip a negative left looks identical at scrollLeft
      // 0 and then LIES: the clipping is done by the sticky label column, not by the track, so
