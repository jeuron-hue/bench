    v0.39.0 [REMOVED] THE STALE TAB. the admin, 06/08/26: "multiple chemists have to be reminded to ctrl+shift+R
          because they leave their chrome open".
          THE DIAGNOSIS IS NOT CACHING, and getting that wrong sends you to the wrong fix. An open
          tab makes no request at all, so it cannot be served a stale response; it is simply still
          running the JavaScript it parsed on Monday. No cache header, no meta tag and no
          cache-buster at deploy time can reach a page that is not asking. Ctrl+Shift+R works
          because it is a RELOAD. GitHub Pages gives no header control regardless: no _headers
          file, no config, no lever. The only thing that can fix this is the page asking whether it
          is still current, which is what this is.
          HOW. BUILD_ID is baked in. On focus, on visibilitychange and every fifteen minutes, a
          Range request for the first 4 KB with cache:'no-store' reads the head comment's build
          line off the server and compares. A few hundred bytes, not 640 KB. Focus is where the
          value is: somebody back at the tab after lunch is checked for free, and that is the exact
          population this exists for.
          DIFFERS, NOT NEWER. A rollback leaves the tab ahead of the server, which is just as wrong
          to keep running, and comparing version strings numerically is a parser nobody needs.
          NEVER AN AUTOMATIC RELOAD. Somebody half way through a task modal loses everything they
          typed, and a tool that throws away your work to fix its own staleness has made the worse
          trade. The banner asks. Later dismisses it for that build id only, so it nags once.
          SILENT ON FAILURE. Offline or a Pages blip puts up nothing. "Could not check" is noise on
          a strip whose entire job is to be ignorable until it is not.
          NOT GATED ON AUTH, deliberately. Signed out overnight with the tab still open is a common
          shape and that tab is still stale.
          BUILD_ID IS A SECOND COPY of the head build line. Held by an assertion in
          sched_checks.cjs that reads both literals out of the raw file and requires them equal.
          FIXED BANNER COLOURS, not var(--accent). White on the dark accent #4a7cff is 3.74:1,
          under the floor for 12px bold, so binding to the theme variable would ship a banner that
          passes contrast in one theme and fails in the other. #3a6aee under white is 4.69:1 and
          does not move. The rule sits BELOW the hash-guarded the queue lift as an override, because
          the guard caught the first attempt to put it beside .banner and said exactly that.
          KNOWN AND ACCEPTED: two sticky banners at top:0 overlap if the staging banner and this
          one show together. Non-prod only, cosmetic.
          Tell: a blue strip at the top of the page after a deploy, with Reload and Later.

          of equal height. The visible symptom was raggedness; the cost was dead space, because a
          CSS grid gives every cell in a row the height of the tallest, so a one-line bubble
          beside a five-task bubble left most of a bubble's worth of window empty. align-items
          :start did not help and never could: it governs the card inside its cell, not the row.
          THREE OPTIONS, and the cheap one is the wrong one. align-items:stretch equalises the
          bubbles by growing the short one, so the space is still gone, just inside the card.
          CSS column-count packs properly but hands the split to the browser and needs
          break-inside:avoid to stop a card being cut mid-list. So: weigh each bubble, drop it in
          the shortest column, leftmost on a tie.
          TWO CONSEQUENCES, both taken deliberately. Yours is always top-left, and by the tie rule
          rather than a special case, because a special case is what someone tidies away. And
          left-to-right stops reading as code order: you read down one column, then the other.

          renderGrid's first run is on a hidden tab where every measurement reads zero (checker
          lesson 3). The weight is derived from what the bubble emits, so it tracks content rather
          than a guess, and a wrong weight makes a column slightly long rather than the layout

          trainees create/edit/delete absences. Booking RPCs gate on caller_code() plus an

          reading the geometry. It was never only the shorthand. The line was defined as a
          percentage band, transparent 0-48%, ink 48-52%, transparent: 4% of an 18px bar is

          attached (class="bar fade xcl", confirmed), the CSS applied, and the line had no
          height to paint. On the 11px swatch it was 0.44px, worse. The two theories I chased,

          the render path top to bottom, not theorising, is what found it.

          --strike calc(50% - 1px) .. calc(50% + 1px), transparent) is a crisp 2px line at any
          height, bar or swatch. --strike raised to 0.92/0.90 alpha so it survives .bar.fade

          the texture dropdown is the KIV-in-the-status-column mistake wearing new clothes,
          cramming a second meaning into a channel that already carries one. Faded reads "done,
          fruit borne"; outline reads "never started"; solid reads "active". All three lie about
          a cancelled task. So cancelled rides its own flag, exactly as completed does: a status
          is a texture PLUS zero or more fate flags, and this file has had that two-axis shape
          since is_terminal.

          it fired on is_terminal, where "struck out, dead" LIED about a completed status, which
          is alive and finished. That argument inverts here: on a cancelled task "struck out,
          dead" is the truth. The mark was never wrong, it was on the wrong flag. the admin's reading
          is the whole design: faded says the work stopped, the strike says nothing came of it,
          and Completed (faded, not struck) versus Cancelled (faded, struck) are two states the
          wall can tell apart from two independent marks.

          cancelled from outline, solid or faded, and you want to see it was cancelled AND how
          far it got, so the strike layers over whatever texture the bar had. Same reasoning
          that made a deadline a mark rather than a bar: a fact laid on, not the bar's own state.
          background-IMAGE, a single horizontal band via a gradient, over the background-COLOR
          that carries the product hue. 8.4 again: the shorthand would eat the hue; the image
          layers. This is why away, which is also background-image, and cancelled can coexist on
          one bar without either winning.

          cancelled task stays on the wall or drops off is ALREADY governed by counts-as-

          inside .gridwrap{overflow:auto}, which is what keeps the form at the visible left edge
          however far right the grid is scrolled. Drag-select text right-to-left, overshoot the
          box, and the browser autoscrolls the nearest scroll container to follow the drag. That
          container is the grid. So the editor holds still and eleven thousand pixels of
          timeline slide underneath it: "scrolls the whole timeline to the left", exactly.
          FIXED BY PINNING scrollLeft, not by changing overflow. overflow-x:hidden while editing
          reads like the obvious answer and is a trap: dropping the horizontal scrollbar makes
          the scrollport ~15px taller, so the whole grid JUMPS the moment any editor opens, on
          every edit, standing at a desk. Trading a rare overshoot for a guaranteed jump is the
          worse deal. The pin lets the scroll happen and puts it straight back, so the cost is

          there and NULL), label is name alone rather than ref||' '||name, and ref is appended

    v0.4  Block 4. Milestone CRUD. the admin only (section 8: the production schedule is his).

          is the one that counts.

          renders a bar. Section 5 is explicit that rows 3-9 are campaign BARS and that a
          point-only model would show the room "MPB-6 start" and "MPB-6 end" instead of one
          block covering three weeks. The editor hint says so at the point of typing.
          Optimistic on edit and delete, per section 6: the room is watching and a spinner is

          not optimistic and cannot be, since there is no id until the server gives one; the

          verbatim, because the count is the useful part.

          render and click) used to open the editor as a NEW campaign carrying the old row's
          anchor, so saving would create a duplicate instead of updating. Now refuses and

          every defined function lands inside the one script block. Two builds in a row put a
          whole script past the closing html tag because that was done by hand.

          sticks, so the label rode off the left edge and the tool showed unlabelled rows.

          min-width. Split into a full-width band plus a sticky max-content label.
          Added a lint (position:sticky must never share a block with width/min-width:100%),
          because this is a layout fact no node-side render test can see.
    v0.3  Block 3. The grid, read-only. Two-level: category, group, row (section 3).
          Row model, and the half of it that is NOT v_grid:
            Production schedule - row per product carrying milestones, lanes on overlap.
            Instruments - row per instrument from the LIST, so an unbooked instrument still
              shows an empty row. v_grid holds bookings, not instruments; building rows from
              it would hide every free instrument, which is the booking question unanswered.
            Tasks - group per active product by sort_order, Miscellaneous permanently last,
              row per task. Tasks on a deactivated product fall into an "(inactive products)"

          edit, and called it most of the unwieldiness. A frozen column deletes it outright.
          No fixed window. Section 11 killed the horizon window: zoom is the horizontal
          control and the meeting traverses vertically. Extent = what the data spans, snapped
          to whole months, floored to today -30/+180 so an empty grid still reads as a
          calendar. Zoom is Ctrl +/-, which is why section 2 said DOM and not canvas.
          Bars are positioned divs over a background day grid, NOT a cell per day. At the

          Nothing is seeded. Every row goes in through this tab by hand, which makes the
          population session the first real exercise of every create path.
          Products is reorder + activate only. Add and rename stay the queue's add_product /
          console.html; two add-paths for one list is the drift these tools exist to kill.
          Reorder is up/down, one full-array call per click (scope section 11: bulk, never
          per-row, so no intermediate inconsistent order ever reaches the table).
          "Counts as finished" is task_statuses.is_terminal, added to prod 16/07/26 with

    v0.1  Block 1. Shell + auth + probe.

              posture 2 to the blocked screen. the schedule tool's door is caller_roster_code(),

            - ALLOWED_DOMAIN. Dead constant in the queue (declared, never read).
            - The login placeholder. the queue reads "you@bench.local"; logins are actually

          functions, through a real JWT for the first time. Backend was validated only
          under a faked request.jwt.claims as postgres, which bypasses RLS.
          Prerequisite migration (applied to prod 16/07/26): the 9 non-products the schedule tool

          authenticated. RLS filters a grant, it does not replace one, so every read

  /* v0.14: .lg.fin removed. It struck the label through and dimmed it to 0.5, both saying
     "this status is dead". Fade = done is the agreement, and the faded swatch (.bar.fade,
     opacity 0.45) already carries it; the label stays readable. A terminal status can be very
     much alive: KIV is parked to be reactivated, and a line through it drew the opposite. */
  /* A separator, not a card edge, so it follows the rows onto --rule. .legend and .gridwrap
     keep --border: those ARE card edges and they match .tablewrap and .modal, which is what
     --border is for. The distinction is the whole finding, not the colour. */
  .lg-sep{width:1px;height:16px;background:var(--rule);}
  /* v0.7.1: margin-left:auto dropped. It pushed the toggle to the right edge of the legend,
     which was tolerable at 1450px and strands it 1500px from the statuses it controls at
     1830px, with the label running off the screen. It sits with the statuses now, which is
     where it belongs anyway. */
  .lg-tog{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text2);cursor:pointer;}

  /* max-height here is a FALLBACK for the first paint only. fitGrid() measures and overrides
     it inline, because 210px was a guess at the combined height of the header, the tabs, the
     legend and the footer, and it was already wrong: v0.8.1's MARKS group made the legend wrap
     to two lines and pushed this element's bottom edge, and the horizontal scrollbar sitting on
     it, off the bottom of the window. Do not tune this number. It encodes four other elements
     and nothing tells you when one of them moves. */
  .gridwrap{border:1px solid var(--border);border-radius:8px;overflow:auto;background:var(--card);max-height:calc(100vh - 210px);}
  .ginner{position:relative;}
  /* ---- v0.9.5 separators ----
     All of these were 1px var(--border), which is the queue's CARD EDGE ink: 1.50:1 in light and
     1.21:1 in dark against --card. --rule is the grid's own structural ink, already drawing the
     month boundaries and the label column's right edge, at 1.93:1 and 1.68:1.
     Second time --border has been caught too weak in this grid. v0.5.1 measured it at 1.5:1
     light and 1.3:1 dark for the weekend day numbers and moved them off it. Same ink, same
     verdict, different element.
     Still 1px everywhere. the admin: "don't make the line too heavy otherwise it becomes a
     horizontal bar code." Weight is the wrong lever at a 32px pitch; the ink was. */
  .ghead{position:sticky;top:0;z-index:5;display:flex;background:var(--bg2);border-bottom:1px solid var(--rule);}
  .gcorner{position:sticky;left:0;z-index:6;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--rule);display:flex;align-items:flex-end;padding:0 10px 4px;font-family:var(--font-mono);font-size:10px;color:var(--muted);}
  /* Drag handle on the title column's right edge (v0.20.12). Lives in the sticky corner so it stays
     pinned; startRhwDrag resizes the --rhw var live. */
  .rhw-grip{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:7;}
  .rhw-grip:hover{background:var(--accent);opacity:0.6;}
  .gdays{position:relative;flex:0 0 auto;}
  .gmon{position:absolute;top:0;height:17px;font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--text);border-left:1px solid var(--rule);padding-left:5px;line-height:17px;white-space:nowrap;overflow:hidden;}
  /* Day numbers ARE the date axis: the most-read thing on the grid, primary content rather
     than chrome. Two signals, not one: weight AND colour. Weekday 600/--text against weekend
     400/--muted.
     Weight is doing most of the work here, and it is the reason three rounds of contrast
     tuning did not land. At 9px a weight step separates two runs of digits better than a
     colour step does, and contrast.cjs cannot see weight at all, so it kept reporting 16.8:1
     against 5.1:1 and calling a solved problem solved. The weekend numbers cannot simply go
     lighter: they still have to be legible, since knowing the 11th is a Saturday is the whole
     point of reading them. */
  .gday{position:absolute;top:17px;height:16px;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--text);text-align:center;line-height:16px;}
  .gday.we{font-weight:400;color:var(--muted);}
  .gday.hol{color:var(--warn);font-weight:600;}

  .grow{display:flex;border-bottom:1px solid var(--rule);}
  /* ---- v0.9.3 ----
     background is a SHORTHAND, and --accent-dim is rgba. So this did not tint the label
     column, it REPLACED var(--card) with a translucent film and the bars scrolled under it in
     plain sight. background-image layers over the background-color instead: opaque card, tint
     on top, and .rh keeps the one job a sticky column has.
     Same fix on the two bands below. They bleed less (--card behind .grpband happens to be the
     same colour, and .catband only loses its darker --bg2 base) but it is one bug in three
     places and leaving two of them is worse than not knowing. .colhl also showed through all
     three, which is a highlight painting over the labels rather than under them.
     NOT fixed, and it is the same shape: table.data th is sticky:top with a --accent-dim
     shorthand background. It is inside the lifted block (792-899, and that range was recorded
     as 582-689 until 17/07/26: verify by hash, f15651f3aacc185d, never by line number) and
     shared with the queue and seminars, and .tablewrap is overflow-x only, so nothing scrolls
     under it inside the panel.
     A scrolled PAGE would. Fixing it here alone gives three tools that differ, which is the
     same call as the parked palette issue. */
  .grow:hover .rh{background-image:linear-gradient(var(--accent-dim), var(--accent-dim));}
  /* The name is the row's identity and the thing the room reads while walking down the grid,
     so it carries weight; the code beside it is a lookup, and stays light. Same split as the
     day numbers. */
  .rh{position:sticky;left:0;z-index:4;flex:0 0 auto;background:var(--card);border-right:1px solid var(--rule);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;font-weight:600;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .rh .code{font-family:var(--font-mono);font-size:11px;}
  .rh .rh-sub{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--muted);margin-left:auto;padding-left:8px;}
  .track{position:relative;flex:0 0 auto;}
  /* ---- v0.8.2 the day grid ----
     Excel has a gridline per day column and that is what makes a position readable: the eye
     traces the line up to the number in the header. Without it an H chip floats at "about the
     20th", which is fine with four rows on screen and useless with forty.
     NOT a line per mark. Three marks across forty tasks is 120 vertical lines and the grid
     becomes a barcode. One line per DAY fixes every position, not just the marks: where a bar
     starts, where a booking ends.
     A gradient, not 578 divs per row. One element per track and zero nodes, which is the whole
     reason bars are positioned over a background instead of a cell per day.
     Weaker than --wk (a 40px band, read at a glance) and much weaker than --rule (the month
     boundary). A 1px line needs to be crisp, not strong. This is a screenshot question and the
     checker cannot settle it: the day-number saga went four rounds because contrast.cjs kept
     reporting a solved problem solved while the answer was font weight.
     Pitch comes from --dayw, set once from JS off DAY_W. */
  .track,.gdays{background-image:repeating-linear-gradient(to right, var(--day) 0 1px, transparent 1px var(--dayw));}
  /* ---- v0.9 column hover ----
     The vertical counterpart to .grow:hover .rh, and the same --accent-dim so the two read as
     one language: hovering a row lights its label, hovering a day lights its column.
     ONE element, moved on mousemove. A div per day is 578 x 60 = ~35,000 nodes, which is the
     thing the whole bar-over-background design exists to avoid.
     No z-index, and first in tree order inside .ginner, so it paints UNDER everything
     positioned after it: bars, the today line, the sticky row headers, the sticky date header.
     A column highlight painted over the bars would be a tint on top of the data. */
  .colhl{position:absolute;top:0;bottom:0;width:var(--dayw);background:var(--accent-dim);pointer-events:none;}
  .track .wk{position:absolute;top:0;bottom:0;background:var(--wk);pointer-events:none;}
  /* Holiday band: same mechanism as the weekend, drawn AFTER .wk in the DOM so it paints on top
     where a holiday lands on a weekend (holiday tint wins). Warm, to read distinct from the grey weekend. */
  .track .hol{position:absolute;top:0;bottom:0;background:var(--hol);pointer-events:none;}
  .track .mb{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);pointer-events:none;}
  .now{position:absolute;top:0;bottom:0;width:2px;background:var(--error);z-index:3;pointer-events:none;opacity:0.8;}
  /* z-index 5, and it must stay under .gcorner's 6. .ghead is position:sticky with a z-index,
     so it IS a stacking context, and .gdays is position:relative with z-index auto, so it is
     not: this label competes directly with .gcorner rather than being nested under it. At 7 it
     won, and "today" printed over the date-range corner whenever the grid was scrolled right
     far enough to push the today line off the left. Still above .gmon and .gday, which are
     z-index auto. */
  .nowlab{position:absolute;top:0;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--error);z-index:5;background:var(--bg2);padding:0 3px;line-height:17px;}

  /* Band and label are two elements on purpose. The band spans the full scroll width so the
     strip reads across the grid; the label is the sticky part. Doing both on one element
     cannot work: min-width:100% makes it wider than the viewport, and a sticky element wider
     than its scrollport never sticks, so the text rides off the left edge the moment the grid
     scrolls to today. That is exactly what v0.3 shipped. */
  /* A top border too, so a category reads as a SECTION BREAK rather than as one more row.
     It pairs with the row above it into a 2px double line at exactly four places in the grid,
     which is a break rather than a barcode. This earns its keep in LIGHT theme specifically:
     --bg2 and --card are both #ffffff there, so the band has no tint at all and only its accent
     text separates it from the rows. Light is the default theme. */
  .catband{background:var(--bg2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;}
  .catband:hover{background-image:linear-gradient(var(--accent-dim), var(--accent-dim));}
  /* v0.13.1: a band that ANNOUNCES rather than collapses. No pointer, no hover tint, no
     triangle, because collapsing this one would hide the only rows there are. */
  .catband.static{cursor:default;}
  .catband.static:hover{background-image:none;}
  .cat{position:sticky;left:0;z-index:4;display:flex;align-items:center;gap:9px;padding:7px 10px;width:max-content;}
  .cat-t{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0.6px;}
  .cat-n{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
  .grpband{background:var(--card);border-bottom:1px solid var(--rule);cursor:pointer;}
  .grpband:hover{background-image:linear-gradient(var(--accent-dim), var(--accent-dim));}
  .grp{position:sticky;left:0;z-index:4;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 24px;width:max-content;}
  /* v0.7.3: the group was outranked by its own children. 11px mono 600 --text2 against a row
     at 12px sans 600 --text is smaller AND lighter than the thing it contains, so APD read as
     a footnote to the task under it.
     Three levels, three TYPE LANGUAGES, not three sizes:
       CATEGORY  accent, mono, uppercase, wide tracking
       GROUP     text,   mono, uppercase, tighter tracking
       row       text,   sans, mixed case, bold
     A header does not have to be bigger than its content; uppercase mono with tracking says
     header on its own, which is how .cat-t already works without being bigger than anything.
     Bands cannot carry this and that is on the record: v0.3 found --bg2 and --card are both
     #ffffff in light, which is why .wk was absent rather than faint. .catband is --bg2,
     .grpband is --card, rows are --card, so in light theme all three are ONE PLANE. Fixing
     that needs grid-local rgba tints like --wk, and it moves what the contrast checker has to
     measure. Type first; look at it; add the tint only if type is not enough. */
  .grp-t{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text);letter-spacing:0.4px;text-transform:uppercase;}
  .grp-n{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
  .caret{font-size:9px;color:var(--muted);width:9px;display:inline-block;}
  .rh.indent{padding-left:26px;}

  .bar{position:absolute;border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:600;line-height:1;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;color:#fff;cursor:default;}
  /* v0.19: the label rides the horizontal scroll to stay readable while any part of its bar is on
     screen, clamped to the bar by syncBarLabels(). will-change keeps the transform on the compositor. */
  .bar-txt{will-change:transform;}
  .bar.pt{border-radius:2px;transform:rotate(45deg);padding:0;}
  /* Starts before the past cutoff. Square left corner = "continues off this edge"; a bar that
     genuinely starts at the grid's first day keeps its rounded one. That contrast IS the tell. */
  .bar.cutl{border-top-left-radius:0;border-bottom-left-radius:0;}
  /* v0.10: .bar.ms and .bar.bk are gone. A campaign and a booking take their product's hue like
     everything else; one hue per product across all four categories is the whole point.
     A bar with no product, or a product with no colour yet, keeps the default fill below. */
  /* Outline sets box-shadow and colour inline and never a background, so there is nothing to
     override. This states the intent and gives classlint the rule it wants. */
  .bar.out{background:transparent;}
  .bar.fade{opacity:0.45;}
  .bar.ab{background:repeating-linear-gradient(45deg,#8a8f98,#8a8f98 4px,#6f747c 4px,#6f747c 8px);}
  /* Maintenance / PMOQ: amber hatch, dark ink. Reads as "down, not booked" and never as a chemist's
     solid booking. Fixed ambers so it is theme-independent, like the absence hatch. */
  .bar.mnt{background:repeating-linear-gradient(45deg,#e2a54a,#e2a54a 4px,#c2872c 4px,#c2872c 8px);color:#241c0a;}
  /* ---- v0.16 ----
     Cancelled: a single horizontal band struck across the bar, drawn as a background-IMAGE so it
     LAYERS over the product hue in background-color rather than replacing it (8.4). The band is
     ~2px centred: transparent to 48%, ink 48-52%, transparent after. --strike is dark on the
     light theme and light on the dark, so it reads against a mid hue either way. It rides over
     .out and .fade both, because a task can be cancelled from any texture and the strike is a
     fact laid on top, not the bar's own state. An outline bar has no fill, so the strike is the
     only ink crossing it, which is correct: the line is the whole point. */
  /* v0.16.1: a FIXED 2px line via calc stops, not a percentage band. The band was 48-52% =
     4% of an 18px bar = 0.72px, sub-pixel, which browsers drop: the strike was "rendering" and
     invisible, and no shorthand or data fix could have helped because the line had no height.
     calc(50% +/- 1px) is a crisp 2px line at ANY bar or swatch height. --strike is near-opaque
     so it still reads after .bar.fade halves the whole element to 0.45. */
  /* v0.16.3: the bar strike is currentColor, which IS the bar's text ink (color:inkOn(hue),
     set inline per bar). So the line matches the label on every bar for free, and it also fixes
     a latent bug: --strike was a fixed near-black that read on yellow but would have vanished on
     a dark hue like KRD teal or SAF purple. inkOn already chose black-or-white for contrast
     against that fill, which is exactly what the strike needs.
     The SWATCH keeps --strike, NOT currentColor: the swatch fill is --text2 grey and so is its
     inherited color, so a currentColor strike there would be grey on grey, invisible. */
  .bar.xcl{background-image:linear-gradient(to bottom, transparent calc(50% - 1px), currentColor calc(50% - 1px), currentColor calc(50% + 1px), transparent calc(50% + 1px));}
  .lg-strike{position:relative;}
  .lg-strike i{background-image:linear-gradient(to bottom, transparent calc(50% - 1px), var(--strike) calc(50% - 1px), var(--strike) calc(50% + 1px), transparent calc(50% + 1px)) !important;}
  /* ---- v0.13 ----
     Geometry deliberately identical to .bar's, so flipping views does not change the row
     rhythm: ROW_PAD + LANE_H + ROW_PAD is 32px in both, and the eye keeps its place.
     background-IMAGE for the hatch, never the background shorthand. The shorthand REPLACES,
     which is what ate the sticky row header in v0.9.3, so an away cell would have hidden the
     very load it is there to be seen against. The image LAYERS over the inline background-color
     and away-plus-loaded shows both. */
  .lcell{position:absolute;border-radius:3px;}
  .lcell.over{background-color:var(--over);}
  .lg-ramp{display:inline-block;width:26px;height:12px;border-radius:2px;vertical-align:middle;}
  /* v0.13.1: ONE rule for both, and the sharing is the point rather than a saving. The swatch
     and the cell are the same thing at two sizes, so a legend that carries its own copy of the
     hatch is a legend that can drift from what it describes. It already had: the rule was
     .lcell.away alone, .lg-ramp.away picked up nothing, and the legend drew "away, and still
     carrying work" as a plain blue block and "away" as 26x12 of nothing. The grid cells were
     correct the whole time. CLASSES cannot see this class of defect: it asks whether a class
     has a rule ANYWHERE, and "away" did. A screenshot is the only instrument for it. */
  .lcell.away, .lg-ramp.away{background-image:repeating-linear-gradient(45deg, var(--lhatch) 0 4px, transparent 4px 8px);}
  .bar-lab{position:absolute;font-family:var(--font-mono);font-size:10px;color:var(--text2);white-space:nowrap;pointer-events:none;line-height:1;}
  .emptyband{border-bottom:1px solid var(--rule);}

  /* ---- v0.4 inline editor ----
     A band plus a sticky max-content label, the same shape as .catband, and for the same
     reason. Section 6: no modals. It opens below the row and pushes the grid down; it never
     covers the timeline, because a dialog over the timeline is dead air with a room watching. */
  .editband{background:var(--accent-dim);border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);}
  .editor{position:sticky;left:0;width:max-content;display:flex;align-items:flex-end;gap:8px;padding:9px 10px;}
  .editor label{font-family:var(--font-mono);font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .editor input,.editor select{padding:4px 6px;font-family:var(--font-body);font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);outline:none;}
  /* The native date-picker icon is drawn by the browser and takes the scheme, not our colours, so
     on dark it was a dark icon on a dark field, invisible. color-scheme flips the icon and the
     picker popup to dark-appropriate. */
  [data-theme="dark"] input[type="date"]{color-scheme:dark;}
  .editor input:focus,.editor select:focus{border-color:var(--accent);}
  .editor input.err{border-color:var(--error);}
  /* v0.17: the person field when the caller cannot reassign it (non-admin). Same box metrics as
     an input so the row of fields stays aligned, but inert: it states who the row is for and
     cannot be changed, because the RPC would refuse a reassignment anyway. */
  .ed-fixed{padding:4px 6px;font-family:var(--font-body);font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text2);}
  .ed-hint{font-family:var(--font-mono);font-size:10px;color:var(--muted);padding-bottom:6px;max-width:190px;line-height:1.4;}
  .ed-hint.warn{color:var(--warn);}
  .ed-act{display:flex;gap:6px;}
  /* ---- v0.12.1 ----
     The two grid controls: + campaign / + task on a category band, today in the corner.
     .btn's vocabulary at a smaller size, not a new one. .btn has been the suite's "you can act
     on this" look since the queue (accent border, accent-dim fill, accent ink, inverting to solid
     on hover) and Save and Cancel wear it six inches below these. Only the SIZE changes: 12px
     with 7-14 padding is a form button and would be gross in a 32px band.
     No new hue, and that is the tool's own rule, not restraint. HUE = PRODUCT is the whole of
     v0.10 and the legend is on screen saying so, so a fresh UI colour would mean "button" in
     the one channel the room reads as "which product". --accent is the only non-product colour
     this tool has and it already means exactly what these two are.
     ONE rule: the bodies were byte-identical and differed only by margin-left, which is a
     convention with two implementations waiting to drift. The margin is the one real difference
     (one follows a label in a band, the other is alone in a corner) so it is the only thing
     stated twice. .gcorner is align-items:flex-end, so today lands on the day numbers' baseline
     rather than floating in the middle of the header.
     Measured rather than waved at, because "a shade under .cat-t's 4.7" was the guess and it
     was wrong by more than a shade. Accent ink on the pill's own fill (accent-dim blended over
     --bg2) is 4.2:1 light and 4.3:1 dark; white ink on solid accent, which is the hover, is
     4.7:1 light and 3.7:1 dark. All four clear 3:1, the hover in dark by the least. No PAIRS
     row: CONTRAST measures a var against a var and this ground is a blend, so it would need a
     second mechanism to watch a pair that is not in question. */
  .catadd,.todaybtn{font-family:var(--font-mono);font-size:11px;font-weight:500;padding:3px 10px;border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);border-radius:4px;cursor:pointer;}
  .catadd:hover,.todaybtn:hover{background:var(--accent);color:#fff;}
  .catadd{margin-left:6px;}
  .taskfilter{margin-left:8px;padding:2px 5px;font-family:var(--font-body);font-size:11px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text2);outline:none;cursor:pointer;vertical-align:middle;}
  [data-theme="dark"] .taskfilter{color-scheme:dark;}
  /* v0.13: .subtab.active's vocabulary, one size down. A mode toggle says which mode it is IN,
     not which mode it would take you to, and solid-when-on is how the tabs already say it. */
  .todaybtn.on{background:var(--accent);color:#fff;}
  /* ---- v0.13.1 ----
     THE DELETE BUTTON HAS NEVER BEEN RED. .danger existed only as .link.danger, so class="btn
     danger" fell through to plain .btn and Delete has rendered identically to Cancel since Block
     4. A destructive action wearing Cancel's clothes, and delete_schedule_item has no guard at
     all: nothing references schedule_items and item_owners cascades silently.
     Found by the check below, not by looking. Nobody looked, for two blocks.
     Outside the lift because .btn and .link.danger are both inside it. Sixth override.
     Measured: error ink on error-bg is 4.7:1 light and 4.5:1 dark; white on solid error at
     hover is 5.4:1 and 3.3:1. */
  .btn.danger{border-color:var(--error);background:var(--error-bg);color:var(--error);}
  .btn.danger:hover{background:var(--error);color:#fff;}
  .cornerbtns{display:flex;gap:6px;align-items:center;}
  /* ---- v0.15 ----
     The row delete. Its OWN cell, never in with the On toggle: On is two-way and delete is
     one-way, and a destructive control sharing a cell with a reversible one is how a
     muscle-memory tick lands on delete. Error-red on HOVER only, so a panel at rest does not
     read as a row of alarms: the x is muted until the pointer is on it. */
  /* ---- v0.11 ----
     The two surfaces of ONE rule: click the task, wherever the task is drawn. A dated task is
     drawn twice, as a label and as a bar; an unscheduled task is drawn once, because rowsFor
     gives it bars:[] and an unscheduled task need not carry a single date to place one at.
     cursor ALONE on .rh, no outline to match .bar.clk's. .grow:hover .rh already tints the
     header via background-image, so an outline would be a second tell on one element at one
     moment. The cursor is the affordance and the tint is the row. */
  .bar.clk{cursor:pointer;}
  .bar.clk:hover{outline:2px solid var(--text);outline-offset:1px;}
  .rh.clk{cursor:pointer;}
  .emptycat{padding:10px 10px 10px 26px;font-family:var(--font-mono);font-size:11px;color:var(--muted);position:sticky;left:0;width:max-content;}

  /* ---- v0.7, cap raised v0.20.13 ----
     .wrap lives at line 286, INSIDE the lifted the queue block, and min(1500px,96vw) is right
     there: it holds forms and tables, and a 1900px line of text is unreadable. Here width IS
     the horizon. Overridden here rather than edited there, because the lift is shared with
     the queue and seminars and stays byte-identical. Same shape as v0.3's .panel table.data{width:auto}
     override, and for the same reason: a rule that is correct in the queue and wrong for a day grid.
     v0.7 set the cap at 1800, which cleared the old 1500 but still binds on the fleet: at 1920,
     98vw is 1881 and the 1800 cap throws away 81px, about 4 day columns. The board scrollport
     (.gridwrap) sits inside .wrap, so that is lost columns, not just margin. Cap raised to 2560
     so 98vw binds on a 1920 laptop (a consistent 2vw gutter, ~19px each side) while a genuinely
     wide external (ultrawide/4K) still caps.
     Not 100vw: the grid card wants to sit in a page, not be the page. .footer is capped
     separately at 1180px and sits outside .wrap, so it stays centred and narrower. */
  .wrap{max-width:min(2560px, 98vw);}

  /* v0.20.14: the lifted .footer reserves 24px above and below a single 11px copyright line, and
     fitGrid subtracts that whole box from the grid budget, so the padding is grid rows given up.
     Trimmed to 10px here (post-lift override; the .footer rule itself is inside the checksummed
     lift and must not be edited). Horizontal padding stays 24px to match the card gutter. */
  .footer{padding:10px 24px;}

  /* ---- v0.20.17 compact chrome ----
     MEASURED, not assumed. The day pitch in a native 1920x1200 capture is 30 device px against
     DAY_W = 20 CSS px, so the fleet runs at 150% display scaling and the real CSS viewport is
     1280x800. Two things follow. First, v0.13's cap raise was a no-op here: 98vw is 1254px, so
     the 1800 cap never bound and never had. Second, and the reason for this block, page chrome
     was eating ~222 of ~645 usable CSS px above the grid, about a third of the window, and every
     px of it was measured in a frame 1.5x larger than the real one.
     All four rules below are inside the checksummed lift, so they are overridden here, never
     edited there. fitGrid measures gridwrap's top, so every px trimmed above lands in the grid
     with no arithmetic to keep in sync. */
  .header{padding:8px 24px;}
  /* The subtitle was stacked under the title, making the header-left column 39.5px tall and the
     tallest thing in the row. Beside it instead: the row's floor becomes the buttons at 34px,
     and the header goes 68.5 -> 51. Baseline-aligned so the 10px sub sits on the 15px title's
     line rather than floating. */
  .header-left{flex-direction:row;align-items:baseline;gap:9px;}
  /* Horizontal padding is the "bezel" as much as the margin is: 24px a side on a 1254px card is
     48px of board. 12 still clears the card's 8px corner radius. Vertical 20 -> 10 top and
     bottom, and the bottom half returns to the grid through fitGrid. */
  .wrap{padding:10px 12px;}
  .tab{padding:7px 16px;}
  .legend{padding:7px 12px;margin:8px 0 8px;}
  /* The collapsed legend's entire footprint. Bare, no card chrome: a border and a background
     around one small word would cost most of what folding the legend away just saved. */
  .lgbar{margin:6px 0 7px;}
  /* Sit with the Lot/LR field rather than in the editor's action row: they act ON that field,
     and a claim button next to Save reads as another way to save. */
  .rs-btns{display:flex;align-items:flex-end;gap:6px;}
  .rs-btn{padding:5px 10px;font-size:11px;}
  .lg-toggle{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.5px;
             color:var(--muted);background:none;border:none;padding:0;cursor:pointer;}
  .lg-toggle:hover{color:var(--accent);}

  /* The .odb board rules lived here and went in v0.23.0 with the two tables they styled: about
     25 rules, every one of them dead the moment renderBoard stopped emitting a board. Deleted
     rather than left behind. Neither checker asks whether a RULE has an emission (only the
     reverse), so nothing would ever have raised them, and a stylesheet describing markup the
     file cannot produce is one nobody can reason about afterwards. overdueTally itself stays,
     for the tab count. */
  /* ---------- the personal dashboard (v0.22.0) ----------
     db- prefixed throughout. The file already carries 165 class names and neither checker can
     see two elements fighting over one, which is how .pw-stat shipped; a prefix is the only
     thing that makes that collision impossible rather than merely unlikely. */
  /* v0.22.3: written at final density from the start, so none of it belongs in the v0.22.1
     override block. That block overrides rules set before the window was measured; it is not the
     place every later size goes, or it stops being a revertible unit and becomes a stylesheet.
     Two columns and not three because the content decides: a task title next to a 140px date
     column needs roughly 380px to avoid truncating on sight, and three columns leaves it 250.
     v0.22.4: the columns are FLEX and their contents are packed in JS. grid was giving every cell
     in a row the height of the tallest, so a one-line bubble beside a five-task bubble left most
     of a bubble's worth of window empty. align-items:start did not help: that governs the card
     inside its cell, not the row's height. */
  /* The per-person overdue counts. Always drawn, zeros and all. */
  .db-stats{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:3px 0 5px;border-bottom:1px solid var(--border);margin-bottom:5px;}
  .db-stl{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .db-stat{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
  .db-stat b{font-weight:600;margin-left:5px;color:var(--text2);}
  /* Non-zero takes error ink, zero recedes. The board's own alphabet: red has to stay worth
     something, so it marks late work and nothing else on this card. */
  .db-stat.db-hot{color:var(--error);}
  .db-stat.db-hot b{color:var(--error);}
  /* Not a person, so it does not wear a person's ink. Amber rather than error red: an unowned
     task is a gap in planning, and painting it the same colour as a late one would make the two
     compete when they are different questions. */
  .db-bub.db-un{border-color:var(--warn);}
  .db-bub.db-un .db-bh{color:var(--warn);}
  /* v0.32.0. Muted, not error, and no border colour that means anything. This is a value, so it
     is inked like the mono selects it adds up rather than like the alert it replaced. A chip on
     every bubble every day cannot also be a warning. */
  .db-hrs{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--muted);background:var(--bg2);border-radius:3px;padding:0 5px;letter-spacing:0.3px;}
  /* Pushed right by margin-left:auto rather than by a spacer or space-between on .tabs: the tab
     strip is a shared rule with three button children elsewhere in this file, and widening its
     contract to carry a fourth non-button child is the .toolbar mistake. */
  /* v0.24.2: bigger, bolder, and in full ink. 15px/600 against the tabs' 13px/500, so it reads as
     the heaviest thing on the row without becoming a fourth tab: it is not clickable and must not
     look it, which is why it keeps the mono face and gains weight rather than the accent colour.
     --text and not --muted. Muted is 5.15:1 and legible, but a date the whole dashboard is
     measured against should not be the faintest thing on its own row. --text is 16.8:1. */
  /* v0.24.3: 16px/700 in the accent. v0.24.2 argued against the accent on the grounds that the
     tabs own it and the date would read as clickable; the admin overruled, and the objection was
     thinner than it sounded, because the date sits at the far right with no underline and no
     hover. The fixture that pinned "never the accent" encoded my preference rather than a
     requirement, so it went with the argument.
     Legible at 6.46:1 rather than 4.69, because --accent is darkened in light this build. */
  .tabdate{margin-left:auto;align-self:center;font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:0.5px;padding-right:4px;}
  .db-cols{display:flex;align-items:flex-start;gap:8px;margin:6px 0;}
  .db-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .db-bub{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:8px 12px 10px;}
  /* Yours is first AND marked. Position alone is a rule you have to know; the accent edge is one
     you can see. Nothing else about the bubble changes, because it is not a different KIND of
     card, just the one you were looking for. */
  .db-bub.db-me{border-color:var(--accent);}
  .db-bh{display:flex;align-items:baseline;gap:7px;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:0.4px;margin-bottom:5px;}
  .db-bub.db-me .db-bh::after{content:'you';font-size:9px;font-weight:400;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .db-grp{margin:0 0 12px;padding-left:9px;border-left:2px solid var(--border);}
  .db-grp:last-child{margin-bottom:0;}
  /* Four tiers of urgency, each a left rule AND the heading ink, so a bubble chunks visually
     before a single word is read. Every colour is an existing theme variable, so both themes
     follow without a second palette to keep in step. */
  /* v0.24.1 contrast. MEASURED against the card, not eyeballed: --ok came in at 3.54:1 on white
     and fails the 4.5 floor outright, and --accent and --warn cleared it by 4% on text that is
     10px, uppercase and letterspaced. Dark was comfortable throughout (8.28, 4.73, 8.20).
     The tiers get their OWN four variables rather than borrowing --error / --warn / --accent /
     --ok. Three reasons, in order. The dark values below are today's values exactly, so dark is
     provably unchanged rather than argued to be. --accent is the suite's brand blue and appears
     on every tool; darkening it to fix a 10px heading would be fixing the wrong thing in the
     wrong place. And a tier is a distinct idea from "ok" or "warn", so it should have been its
     own name from the start.
     The left rules keep the same hues as the headings: a rule is graphic, carries no meaning the
     text does not also carry, and has no contrast floor to meet. */
  :root, [data-theme="light"]{ --db-late:#c83030; --db-slip:#7d4a00; --db-now:#2b52c9; --db-ahead:#17734a;
                               --db-wash-off:rgba(200,48,48,0.00); --db-wash-on:rgba(200,48,48,0.10); }
  [data-theme="dark"]{ --db-late:#ff4a4a; --db-slip:#e8a33d; --db-now:#4a7cff; --db-ahead:#4ac78b;
                       --db-wash-off:rgba(255,74,74,0.00); --db-wash-on:rgba(255,74,74,0.10); }
  .db-late{border-left-color:var(--db-late);}
  .db-late .db-gt{color:var(--db-late);font-weight:700;}
  /* v0.35.0. The pulse runs between two TONE COLOURS, never down to transparent. Fading opacity
     drops the text under the contrast floor at the trough, and the harness reads declared colours,
     so it would report green on a label that had gone unreadable half the time: the rule-goes-quiet
     failure this file has already been bitten by twice. Both endpoints are proven pairs.
     The amber endpoint is also the border colour, so the group reads as one object rather than as
     a red label that has escaped an amber box. */
  .db-slip .db-gt{color:var(--db-late);animation:db-pulse 1.1s ease-in-out infinite;}
  @keyframes db-pulse{0%,100%{color:var(--db-late);}50%{color:var(--db-slip);}}
  /* v0.35.0b. THE WHOLE GROUP BREATHES, not one line of it. A heading pulsing above four calm rows
     is easy to look past; the block moving is not. Three things move on the same clock so it reads
     as one object having a problem rather than three decorations: the heading colour, the rule down
     the left, and a wash behind the rows.
     THE RULE THICKENS TO 3px as well, which is static. Motion carries the alarm, width carries the
     fact, and the fact has to survive prefers-reduced-motion. */
  @keyframes db-pulse-rule{0%,100%{border-left-color:var(--db-late);}50%{border-left-color:var(--db-slip);}}
  /* THE WASH IS THE ONE THAT COULD GO WRONG. A background moving under text changes that text's
     contrast, and the harness reads declared colours, so a wash heavy enough to bury the rows would
     never show up as a failure. Both ends are asserted against the blended background in
     sched_checks, at the darkest point of the cycle, not just at rest. */
  /* ONE RULE for this selector, not two. It was split across a border-colour rule up here and the
     animation rule below, and the checker assertion written against it silently read only the
     first, passed, and reported eight mutations killed that were all still alive. A selector
     appearing twice is the trap; the checker now concatenates every match, and the source no
     longer gives it the chance. */
  .db-slip{border-left-color:var(--db-slip);border-left-width:3px;background-color:var(--db-wash-off);
           animation:db-pulse-rule 1.1s ease-in-out infinite, db-pulse-wash 1.1s ease-in-out infinite;}
  @keyframes db-pulse-wash{0%,100%{background-color:var(--db-wash-off);}50%{background-color:var(--db-wash-on);}}
  @media (prefers-reduced-motion: reduce){
    .db-slip .db-gt{animation:none;color:var(--db-late);}
    .db-slip{animation:none;border-left-color:var(--db-late);background-color:var(--db-wash-on);}
  }
  .db-now{border-left-color:var(--db-now);}
  .db-now .db-gt{color:var(--db-now);}
  .db-ahead{border-left-color:var(--db-ahead);}
  .db-ahead .db-gt{color:var(--db-ahead);}
  /* --ok itself is fixed too, and globally in light, because it fails everywhere it is used and
     not only here: .auth-ok and .v-pass are text at 3.54:1, and .toast paints WHITE on it, which
     is the same pair inverted and equally thin. Darkening improves all four. Declared here rather
     than in the palette because the palette is inside the checksummed lift, which is overridden
     from outside and never edited; the file already carries a second light block for exactly
     this, added in v0.20.17. */
  :root, [data-theme="light"]{ --ok:#17734a; }
  /* v0.24.4: the dark row this block always needed. `:root` matches the html element in BOTH
     themes at equal specificity, so with nothing after it this override was winning in dark too,
     and dark painted light's green at 2.87:1 on the card. Every other light override in the file
     (grid inks, load, tiers) already carries its dark counterpart; this and the brand block below
     were the only orphans. Value is the palette block's, byte for byte. */
  [data-theme="dark"]{ --ok:#4ac78b; }
  /* v0.24.3, and this is the one that touches the brand. --accent at 4.69:1 and --warn at 4.68:1
     were the two thinnest inks left in light, and both cleared the floor by four percent, which
     is not a margin. They now sit at 6.46 and 6.39.
     I declined to touch --accent in v0.24.1, on the grounds that a 10px heading is the wrong
     reason to move a brand colour. That reasoning does not survive the scope changing: this is
     not one heading, it is the active tab, every person's name, every panel title, every link and
     now the date, in the theme most of the team reads. The HUE is held and only the lightness
     moves, and DARK IS UNTOUCHED, which is where the brand blue reads as a colour rather than as
     text.
     --accent-dim moves with it. It is that same blue at 8%, and a tint drifting away from the ink
     it tints is the kind of thing nobody reports and everybody notices.
     --muted (5.15) and --error (5.36) are deliberately left. Both clear the floor with room, and
     darkening --muted would flatten the de-emphasis it exists to carry. */
  :root, [data-theme="light"]{ --accent:#2f56c4; --accent-dim:rgba(47,86,196,0.10); --warn:#8a5200; }
  /* v0.24.4: same repair as --ok above. Without this row, dark computed the darkened light blue
     at 2.60:1 and light's warn at 2.63:1 on the card, and "dark is untouched" was true of the
     dark block's text while false of what a dark screen painted. Values are the dark palette and
     grid blocks', byte for byte, tint included. */
  [data-theme="dark"]{ --accent:#4a7cff; --accent-dim:rgba(74,124,255,0.10); --warn:#e8a33d; }
  /* Absences and standing facts keep the neutral rule: they are not work and must not compete
     with the four tiers that are. */
  .db-quiet{border-left-color:var(--border);}
  /* Product hue, the house grammar, at dot scale. */
  .db-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:baseline;}
  .db-gt{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
  .db-item{display:flex;align-items:center;gap:12px;padding:5px 0;border-top:1px solid var(--border);font-size:13px;}
  .db-when{font-family:var(--font-mono);font-size:12px;color:var(--text2);flex:0 0 168px;white-space:nowrap;}
  .db-ttl{flex:1 1 auto;color:var(--text);font-weight:500;}
  .db-code{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
  .db-dim{color:var(--muted);}
  .db-tag{font-family:var(--font-mono);font-size:11px;color:var(--text2);border:1px solid var(--border);border-radius:3px;padding:1px 7px;white-space:nowrap;}
  .db-sel{font-family:var(--font-mono);font-size:11px;padding:2px 5px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);max-width:190px;}
  /* hrs/day, v0.30.0. A FIXED box, and that is the whole reason it is a class rather than two
     more properties on .db-sel. Options run "0h" to "7.5h", so a select sized to its content is
     a different width on every row, and the status controls beside it stop forming a column.
     flex, not width alone: .db-item is a flex row, so the basis is what holds the box open, and
     the same rule then fits the read-only span without caring that it is not a select. */
  .db-eff{flex:0 0 62px;width:62px;box-sizing:border-box;text-align:center;}
  .db-act{font-family:var(--font-mono);font-size:11px;padding:2px 9px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:4px;color:var(--accent);cursor:pointer;white-space:nowrap;}
  .db-lnk{font-family:inherit;font-size:inherit;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-align:left;}
  .db-lnk:hover{text-decoration:underline;}
  /* Header ink, deliberately quiet. It is a standing fact sitting on a line of names and alerts,
     so it must be legible without competing with either. */
  .db-rel{font-family:var(--font-body);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0;}
  .db-strip{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:8px 14px;margin:10px 0;border:1px solid var(--border);border-radius:6px;background:var(--bg2);font-size:12px;}
  .db-sl{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .db-sv{color:var(--text);}

  /* ---- v0.25.0 STANDING tab ----
     Reference data, so it reads like a printed roster, not like the dashboard's live bubbles.
     Every colour is a theme token (--text/--text2/--muted/--card/--border), no hue override, so
     there is no light-only or dark-only ink here to pair: both themes take these rules unchanged.
     Two columns of panels on a wide viewport, one on a narrow one, so the whole year and the two
     short tables sit side by side rather than stacking to a scroll. */
  .st-panel{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:10px 14px 12px;margin:0 0 14px;break-inside:avoid;}
  .st-h{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin:0 0 8px;}
  /* v0.36.0. THE WHITE WALL. Both panels here put FOUR different things at full --text: the owner
     group header, the instrument name, the role name and the main holder. Thirty rows of maximum
     ink with nothing leading, so the eye has no entry point and reads it as a block of text rather
     than as a structure.
     The fix is fewer things shouting, not more colours. --text2 already existed and neither panel
     used it, so the tiers were binary: full or muted. Now the owner header is the ONLY full-ink
     thing in the instruments panel and it gets a rule above it, because the owner is the axis the
     panel is organised on and you scan it before anything else. */
  .st-sub{font-size:13px;font-weight:600;color:var(--text);margin:16px 0 5px;padding-top:9px;
          border-top:1px solid var(--border);display:flex;align-items:baseline;}
  .st-sub:first-of-type{margin-top:2px;padding-top:0;border-top:none;}
  .st-tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .st-tbl th{text-align:left;font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:2px 10px 5px 0;border-bottom:1px solid var(--border);}
  .st-row{border-top:1px solid var(--border);}
  .st-row:first-child{border-top:none;}
  .st-row td{padding:5px 10px 5px 0;vertical-align:baseline;}
  .st-when{font-family:var(--font-mono);font-size:12px;color:var(--text2);white-space:nowrap;width:170px;}
  .st-who{color:var(--text);}
  /* THE LABEL, NOT THE ANSWER. In the roles table this is the role you scan for and the holder
     beside it is what you came to read; in the instruments panel it is one of thirty names under an
     owner heading. Either way it is the index and not the payload, so it sits one tier down. It
     stays perfectly legible: --text2 clears the contrast floor in both themes and is asserted. */
  .st-role{color:var(--text2);font-weight:500;}
  .st-now{font-family:var(--font-mono);font-size:11px;color:var(--accent);white-space:nowrap;text-align:right;}
  .st-dim{color:var(--muted);}
  /* v0.28.0. These used to read .st-live td and .st-past td, which stopped matching the moment
     duty periods became blocks: the rules survived, the cells did not, and a past week would have
     kept full-strength ink. Targeted at the parts by name instead, so they hold whichever
     structure carries them. .st-row keeps its own rules because the roles and instrument panels
     are still real tables. */
  .st-live .st-when{color:var(--text);font-weight:600;}
  .st-live .st-who{color:var(--text);}
  .st-past .st-when,
  .st-past .st-who,
  .st-past .st-now,
  .st-past .st-note{color:var(--muted);}
  .st-past td{color:var(--muted);}
  .st-empty{font-size:13px;color:var(--muted);padding:4px 0;}
  /* v0.26.0. The topic sits under its pair rather than in a fourth column: it is free text and a
     column wide enough for a sentence would starve the three that carry the dates and names. */
  .st-note{font-size:12px;color:var(--text2);margin-top:2px;}
  /* v0.28.0. Duty periods are blocks, not table rows, so a long type can flow into columns.
     51 housekeeping weeks as a full-width table was a narrow strip of content beside an acre of
     nothing, and 51 rows of scroll. Two columns at the 1280 fleet width, three on a wide screen.
     break-inside on the block keeps a period and its clash line together in one column. */
  .st-list{margin:2px 0 4px;}
  .st-cols{column-count:2;column-gap:22px;}
  @media (max-width:900px){ .st-cols{column-count:1;} }
  @media (min-width:1500px){ .st-cols{column-count:3;} }
  .st-p{break-inside:avoid;page-break-inside:avoid;padding:3px 0;border-top:1px solid var(--border);}
  .st-p:first-child{border-top:none;}
  .st-pl{display:flex;gap:12px;align-items:baseline;font-size:13px;}
  .st-pl .st-when{flex:0 0 auto;width:auto;}
  .st-pl .st-who{flex:1 1 auto;min-width:0;}
  .st-pl .st-now{flex:0 0 auto;margin-left:auto;}
  .st-todo{color:var(--muted);font-style:italic;}
  /* v0.27.0. An absence overlapping a duty. Warn, never error: it is a swap worth considering,
     not a fault. Full coverage gets the stronger ink because that one needs somebody else. */
  .st-clash{font-size:12px;color:var(--warn);margin-top:2px;}
  .st-clash-all{font-weight:600;}
  .st-past .st-clash{color:var(--muted);font-weight:400;}
  .st-tag{font-family:var(--font-mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap;}
  .st-due .st-now{color:var(--text2);}
  .st-near .st-now{color:var(--warn);font-weight:600;}
  .st-due.st-past .st-now{color:var(--muted);}
  /* Duties full width on top (the long one), roles and instrument owners share a row below. On a
     narrow viewport st-two collapses to a stack. */
  .st-two{display:flex;gap:16px;flex-wrap:wrap;}
  .st-two>.st-panel{flex:1 1 340px;margin-bottom:0;}

  /* ---- v0.22.1 dashboard density ----
     MEASURED off a native capture, not guessed. The fleet is 1920x1200 at 150% scaling, so the
     real CSS viewport is 1280x800; the capture confirms it independently, with .db-when landing
     at 249 device px against its 168 CSS px basis, a ratio of 1.48. Roughly 690 CSS px are
     usable below the chrome. v0.22.0 spent 493 of them on a picker, a strip and four tasks, so
     band 4 began below the fold and the dashboard's own header was the last thing on screen for
     anyone with a normal week. A dashboard you have to scroll to finish is a report.
     An OVERRIDE block, on the v0.20.17 pattern, not an edit of the rules above. The originals
     stay readable and reverting density is deleting one block rather than reconstructing five
     numbers from a diff.
     THE BOARD SHRINKS BACK, and this is the v0.20.24 decision inverting rather than being
     overruled. That build sized the board "for a PAGE, not for a strip" because it had just been
     given its own tab, and it was right. The board is not a page any more; it is band 4 of
     something else, and 24px tallies under a 12px task list read as the tail wagging the dog.
     Same reasoning, opposite context, opposite answer. It stays comfortably readable across a
     desk: this trims about a third off the type, not two thirds.
     THE NESTED CARD GOES. Band 4 is a .db-band with two .odb cards inside it, so every board sat
     inside three borders and three sets of padding. The .odb rule itself is untouched and still
     correct for a board standing alone; this is a scoped descendant override, which is the same
     repair the a0.15 .toolbar defect got. Do not fold it into .odb.
     Horizontal is DELIBERATELY untouched. The long run from a task title to its status dropdown
     is real, but capping the band width is a layout decision, and the personal bands and the
     two-group board table want different caps. Vertical is where the window was actually being
     spent. */
  .db-grp{margin:0 0 7px;}
  .db-gt{font-size:10px;margin-bottom:2px;}
  .db-item{padding:2px 0;font-size:12px;line-height:1.35;gap:10px;}
  .db-when{flex:0 0 140px;font-size:11px;}
  .db-tag,.db-act{font-size:10px;padding:1px 6px;}
  .db-sel{font-size:10px;padding:1px 4px;max-width:150px;}
  .db-eff{flex:0 0 52px;width:52px;}
  .db-strip{padding:4px 12px;margin:6px 0;font-size:11px;gap:10px;}
  /* Eleven controls against the milestone editor's eight. .editor is width:max-content, which
     never wraps however much flex-wrap is set, so the wrap needs a max-width to work against. */
  .editor.wide{flex-wrap:wrap;max-width:1020px;}
  /* v0.23.9. The editor is a GRID control: width:max-content and position:sticky so it stays
     pinned while the wall scrolls under it, capped at 1020px. Dropped into the 480px modal shell
     it did not shrink, it overflowed, and the dialog grew a horizontal scrollbar with Save and
     Cancel off the right edge.
     Fixed by a MODIFIER, not by changing .modal or .editor. Both are shared: .modal serves six
     short dialogs that are correct at 480, and .editor's stickiness is load-bearing on the grid
     and meaningless in a dialog. Same repair the a0.15 .toolbar defect got.
     These rules live HERE and not beside .modal, because .modal is inside the checksummed
     the queue lift. The lift is overridden from outside, never edited: the first cut of this fix
     put them next to .modal-title and the hash check caught it immediately, which is the check
     doing exactly the job it was written for. */
  .modal-wide{max-width:1080px;}
  .modal-wide .editband{padding:0;}
  .modal-wide .editor{position:static;width:auto;max-width:none;padding:0;}
  .owners{display:flex;flex-wrap:wrap;gap:4px;max-width:250px;}
  /* Specificity, not source order. .editor label is (0,1,1) and stacks its children in a
     column, which is right for "start" over a date box and wrong for a chip: it puts the tick
     above the code. A bare .own is (0,1,0) and loses however far down the file it sits, so the
     chip rule has to carry the same element on the front. classlint cannot see this: the class
     HAD a rule, and a more specific one beat it. */
  /* ---- v0.8.1 marks ----
     A date that is not the team's time. A letter, not a shape: H/R/A label themselves, where a third
     and fourth glyph shape would need the legend to be read every time. Solid chip, because it
     has to stay legible on a pale status fill, on a dark one, and on the empty track, and the
     statuses are the admin's to set.
     Not --now (that is today, and there is one of it), not a rotated square (that is a
     milestone point). z-index 2 puts a mark over the bar and under the today line. */
  .mark{position:absolute;width:var(--markw);height:var(--markw);border-radius:2px;background:var(--text);color:var(--card);font-family:var(--font-mono);font-size:9px;font-weight:600;line-height:var(--markw);text-align:center;z-index:2;}
  .editor label.own{display:inline-flex;flex-direction:row;align-items:center;gap:3px;font-family:var(--font-mono);font-size:10px;color:var(--text2);cursor:pointer;padding:1px 5px 1px 3px;border:1px solid var(--border);border-radius:3px;background:var(--bg2);}
  .editor label.own:hover{border-color:var(--accent);}
  .editor label.own.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

  /* [REMOVED] the seminar tab stylesheet, 138 lines: its themed custom properties, the card and
     fold layouts, the status pills, the stats row, the toolbar and the editor. */
</style>

<body>

<!-- [REMOVED] staging banner, build banner, login screen and the off-roster screen. -->

<div id="app">
  <div class="header">

           the only control in the tool that CREATES something, and it was sitting inside the
           thing it creates into. Hidden until routeAuth proves posture 1, the same shape as the
           Read probe tab above: markup that is always present and revealed once identity is
           known, rather than built at render time. Visible on every tab, and correct there,
           because dbNewTask switches to the grid itself. -->
      <button class="btn primary" id="btn-newtask" onclick="dbNewTask()" style="display:none;">+ task</button>

           at load, so Refresh corrects it: an open tab does not roll the date at midnight, and

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal" id="modalBody"></div>
