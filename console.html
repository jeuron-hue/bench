// a0.20. Keyed on the period, so one call writes both rows of a pair and they cannot drift.
// The RPC returns the number of rows it touched: 0 means the period key matched nothing, which
// is worth saying out loud because the input will happily hold text that was never stored.
// a0.24. The topic is PER ROW. a0.20 built it pair-level, writing both rows of a period
// identically through set_duty_note, on the reading that a topic belonged to the pair. KYT has
// two submitters making two submissions, so it belongs to the assignment: forcing them equal was
// data loss wearing the costume of a consistency guarantee. set_duty_note was dropped on prod
// (K10) rather than left in place, because an admin-gated function that silently overwrites one
// person's topic with the other's is worse than an untidy schema.
async function setDutyNote(id, note, was){
  if (note === was) return;
  if (await dutyWrite('set_duty_assignment_note', { p_id:id, p_note:note },
                      note ? 'Topic set.' : 'Topic cleared.')){
    renderDuties();
  } else {
    renderDuties();
  }
}

function renderDuties(){
  const el = document.getElementById('view-duties'); if (!el) return;
  const today = sgtToday();
  const types = APP.dutyTypes || [];
  let h = '<div class="setup-note">'
    + 'A duty is a turn somebody takes and then hands on. Every assignment carries its own dates, so '
    + 'nothing here knows that housekeeping is weekly or that KYT is quarterly: there is no rhythm to '
    + 'configure and no generator. Two names on one week are two rows.<br>'
    + 'Standing jobs that are held until changed rather than rotated are <b>not</b> duties. They live on '
    + 'the Schedule setup tab as Standing roles.'
    + '</div>';
  if (APP.dutyErr) h += '<div class="errbox">' + esc((APP.dutyErr.code ? APP.dutyErr.code + ': ' : '') + APP.dutyErr.message) + '</div>';

  // ---- 1. types ----
  let r = types.map(t =>
      '<tr class="' + (t.active ? '' : 'inactive') + '">'
    + '<td class="code">' + esc(t.code) + '</td>'
    + '<td><input type="text" class="inline-in" value="' + esc(t.name == null ? '' : t.name) + '" onchange="renameDutyType(' + jsq(t.code) + ', this.value.trim(), ' + jsq(t.name == null ? '' : t.name) + ')"></td>'
    + '<td><input type="color" class="swatch" value="' + esc(t.colour || '#6a8fd8') + '" onchange="setDutyColour(' + jsq(t.code) + ', this.value)"></td>'
    + '<td><input type="text" class="inline-in" style="max-width:90px;" placeholder="whole period" value="' + esc(t.show_final_days == null ? '' : t.show_final_days) + '" onchange="setDutyFinalDays(' + jsq(t.code) + ', this.value)"></td>'
    + '<td class="mid">' + tick(t.active, 'setDutyTypeActive(' + jsq(t.code) + ', this.checked)') + '</td>'
    + '</tr>').join('');
  if (!types.length) r = emptyRow(5, 'No duty types yet. Housekeeping is the seeded one; add KYT when its cadence is settled.');
  h += panel('1', 'DUTY TYPES', 'what kinds of turn exist, and when each one shows on a dashboard',
      '<table class="data"><thead><tr><th style="width:110px;">Code</th><th class="grow-col">Name</th>'
    + '<th style="width:70px;">Colour</th>'
    + '<th style="width:130px;" title="Blank shows the duty for its whole period. A number shows it only in the final N days, for a duty whose window is long but whose reminder should be late.">Show final days</th>'
    + '<th class="mid" style="width:70px;">On</th></tr></thead><tbody>' + r
    + '<tr class="addrow"><td><input type="text" id="dt_code" placeholder="KYT" onkeydown="if(event.key===\'Enter\')document.getElementById(\'dt_name\').focus()"></td>'
    + '<td><input type="text" id="dt_name" placeholder="KYT submission" onkeydown="if(event.key===\'Enter\')addDutyType()"></td>'
    + '<td><span class="locked">after adding</span></td><td></td>'
    + '<td class="mid"><button class="btn primary" onclick="addDutyType()">Add</button></td></tr></tbody></table>');

  // ---- 2. import ----
  let rep = '';
  if (APP.dutyImport){
    const rows = APP.dutyImport;
    const bad = rows.filter(x => !x.ok).length;
    rep = '<div class="di-rep' + (bad ? ' di-bad' : ' di-ok') + '">'
        + '<div class="di-rh"><b>' + esc(APP.dutyImportType || '') + '</b> import report'
        + '<button class="link" onclick="clearDutyImport()">clear</button></div>'
        + rows.map(x => '<div class="di-line' + (x.ok ? '' : ' di-err') + '">'
            + '<span class="di-no">' + (x.line_no ? 'line ' + x.line_no : 'result') + '</span>'
            + esc(x.message) + '</div>').join('')
        + '</div>';
  }
  h += panel('2', 'IMPORT', 'the way 52 weeks actually get entered. Nothing is written unless every line reads',
      '<div class="di-wrap">'
    + '<div class="di-help">One duty type per paste. One line per period, tab separated:<br>'
    + '<code>start&#9;end&#9;person</code>, and any further columns on the line are more people, so a week with '
    + 'two names is one line and becomes two rows.<br>'
    + 'Dates read as dd/mm/yy, dd/mm/yyyy or yyyy-mm-dd. Blank lines are ignored.<br>'
    + '<b>Check first.</b> It reads every line and prints what it would do, and writes nothing. A paste can be '
    + 'entirely valid and entirely wrong, and no constraint can tell you that.<br>'
    + '<b>Validated in full before anything is written.</b> One bad line and nothing at all is imported, so '
    + 'a paste is safe to retry. Re-pasting the same weeks adds nothing: a person already holding that duty '
    + 'from that start date is skipped, not duplicated.</div>'
    + '<div class="di-row"><select id="di_type">' + dutyTypeOptions(null, true) + '</select>'
    + '<button class="btn" id="di_chk" onclick="importDuties(true)" title="Read every line and report what it WOULD do. Writes nothing.">Check</button>'
    + '<button class="btn primary" id="di_btn" onclick="importDuties()">Import</button></div>'
    + '<textarea id="di_tsv" class="di-box" spellcheck="false" placeholder="27/07/26&#9;31/07/26&#9;TQL&#9;NFH&#10;03/08/26&#9;07/08/26&#9;MJD"></textarea>'
    + rep + '</div>');

  // ---- 3. assignments ----
  const live = (APP.duties || []).filter(d => APP.dutyPast || String(d.end_date) >= today);
  const hidden = (APP.duties || []).length - live.length;
  const tName = c => { const t = types.find(x => x.code === c); return t ? t.name : c; };
  // a0.23. One table per duty type rather than one table with a Type column. Housekeeping runs to
  // 51 weeks and KYT to 4, so a single list buries the short type under the long one and sorts the
  // two together for no reason: nobody reads across from a KYT quarter to a housekeeping week.
  // Splitting also retires the Type and Duty columns, which repeated the same value down every
  // row of their own section.
  const byType = {};
  live.forEach(d => { (byType[d.duty_type] = byType[d.duty_type] || []).push(d); });
  const order = types.filter(t => byType[t.code])
    .concat(Object.keys(byType).filter(c => !types.some(t => t.code === c)).map(c => ({ code:c, name:c })));
  // a0.26. Days of an assignment that its holder is away for. Same rule as the schedule tool v0.27.0:
  // counted in days, because the number is the severity. One of five is a shrug, five of five
  // needs somebody else. Inclusive of both ends on each side.
  const DAY = 86400000;
  const asN = s => { const p = String(s).slice(0,10).split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); };
  const awayDays = (code, start, end) => {
    const st = asN(start), en = asN(end);
    const mine = (APP.absences || []).filter(x => x.person_code === code && x.start_date && x.end_date);
    if (!mine.length) return 0;
    let n = 0;
    for (let t = st; t <= en; t += DAY){
      if (mine.some(x => asN(x.start_date) <= t && asN(x.end_date) >= t)) n++;
    }
    return n;
  };
  const rowsFor = (list, wantsTopic) => list.slice()
    .sort((a,b) => String(a.start_date).localeCompare(String(b.start_date))
                || String(a.person).localeCompare(String(b.person)))
    .map(d => {
      const span = Math.round((asN(d.end_date) - asN(d.start_date)) / DAY) + 1;
      const away = awayDays(d.person, d.start_date, d.end_date);
      return '<tr' + (String(d.end_date) < today ? ' class="inactive"' : '') + '>'
    + '<td class="code">' + esc(fmtDateOnly(d.start_date)) + ' to ' + esc(fmtDateOnly(d.end_date)) + '</td>'
    + '<td><select class="inline-in" onchange="setDutyPerson(' + d.id + ', this.value, ' + jsq(d.person) + ')">'
    + rosterOptions(d.person) + '</select></td>'
    // The marker sits beside the person because the person is what you change to clear it.
    + '<td class="mid">' + (away
        ? '<span class="da-away' + (away >= span ? ' da-away-all' : '') + '" title="'
          + esc(personLabel(d.person)) + ' is away for ' + away + ' of the ' + span
          + ' days of this period. Swap the person, or leave it if the cover is fine.">'
          + (away >= span ? 'all ' + span + ' d' : away + ' of ' + span + ' d') + '</span>'
        : '') + '</td>'
    + (wantsTopic
        ? '<td><input type="text" class="inline-in" value="' + esc(d.note == null ? '' : d.note) + '"'
          + ' placeholder="no topic set" spellcheck="false"'
          + ' onchange="setDutyNote(' + d.id + ', this.value.trim(), ' + jsq(d.note == null ? '' : d.note) + ')"></td>'
        : '')
    + '<td class="mid"><button class="rowdel" title="Remove this assignment" onclick="delDuty(' + d.id + ')">\u00d7</button></td>'
    + '</tr>';
    }).join('');
  let tbl = '';
  if (!order.length){
    tbl = '<div class="st-none">' + (APP.duties.length
      ? 'Nothing current. Tick "show finished" below to see the ones already past.'
      : 'No assignments yet. Paste a year of them above.') + '</div>';
  } else {
    tbl = order.map(t => {
      // Only a type that declares a deadline gets a topic column. show_final_days is that
      // declaration, the same signal the schedule tool reads to decide a period has a due date rather than
      // just an end. Housekeeping has it null and never wanted topics; setting it on any future
      // type brings the column with it and nothing here names KYT.
      const ty = types.find(x => x.code === t.code);
      const wantsTopic = ty && ty.show_final_days != null;
      return '<div class="da-sub">' + esc(t.code) + ' &middot; ' + esc(tName(t.code))
      + ' <span class="meta" style="margin:0;">' + byType[t.code].length + ' rows</span></div>'
      + '<table class="data"><thead><tr><th style="width:190px;">Period</th>'
      + '<th' + (wantsTopic ? ' style="width:320px;"' : ' class="grow-col"') + '>Person</th>'
      + '<th class="mid" style="width:90px;" title="Days of this period the person is away for. the schedule tool shows the same on its Standing tab.">Away</th>'
      + (wantsTopic ? '<th class="grow-col">Topic</th>' : '')
      + '<th class="mid" style="width:40px;"></th></tr></thead><tbody>'
      + rowsFor(byType[t.code], wantsTopic) + '</tbody></table>';
    }).join('');
  }
  h += panel('3', 'ASSIGNMENTS', 'one row per person per period. Two names on a week are two rows',
      tbl
    // The add form is a div row, not a table. Every table in this console carries headers and is
    // checked for it; a one-row add form has nothing to head, and faking a header to satisfy the
    // rule would be gaming a check that exists to catch real column drift.
    + '<div class="bd-row"><span class="bd-l">add one</span>'
    + '<select id="da_type">' + dutyTypeOptions(null, true) + '</select>'
    + '<input type="date" id="da_start"> <input type="date" id="da_end">'
    + '<select id="da_person">' + dutyPersonOptions() + '</select>'
    + '<button class="btn primary" onclick="addOneDuty()">Add</button>'
    + '</div>'
    + '<div class="note" style="margin-bottom:0;">'
    + '<label class="di-past">' + '<input type="checkbox" class="tick"' + (APP.dutyPast ? ' checked' : '')
    + ' onclick="setDutyPast(this.checked)"> show finished'
    + (hidden ? ' <span class="meta" style="margin:0;">(' + hidden + ' hidden)</span>' : '') + '</label>'
    + ' &middot; The single-row form is the exception. Use the paste box for anything longer than a couple of weeks.'
    + '<div class="bd-row"><span class="bd-l">remove in bulk</span>'
    + '<select id="bd_type">' + dutyTypeOptions(null, false) + '</select>'
    + '<span class="bd-l">starting</span>'
    + '<input type="date" id="bd_from"> <input type="date" id="bd_to">'
    + '<button class="btn danger" onclick="confirmBulkDelete()">Remove</button>'
    + '<button class="btn" onclick="copyDuties()" title="Copy every assignment as TSV, in the format the paste box accepts.">Copy as TSV</button>'
    + '</div>'
    + '<div class="bd-note">Ranged on the START date, so it removes exactly what one paste of that period put in. '
    + 'The import is idempotent, which cuts both ways: re-pasting a corrected year adds the corrections and leaves '
    + 'the wrong rows behind. Remove the range, then paste again.</div>'
    + '</div>');

  el.innerHTML = h;
}

// The roster label used by the assignments table. rosterOptions builds the dropdown; this is the
// same fact for a cell, and both resolve through APP.people so a code that has left the roster
// still prints as itself rather than as blank.
function personLabel(code){
  const p = (APP.people || []).find(x => x.code === code);
  return p ? (p.full_name + ' (' + code + ')') : code;
}

// ============================================================
// OFFBOARD PANEL  -  per-item reassign or release of OPEN items only.
// Reassign/release reuse update_lot / update_lr (owner param). The whole
// arg set is sent with only the owner changed, because the server applies
// the full row. Frozen/closed items are never shown or touched.
// ============================================================
function obKey(r){ return r.surface + '|' + r.target_id; }
function obLive(){ return (APP.obInv||[]).filter(r => r.cls !== 'A' && r.target_id); }
function obFrozen(){ return (APP.obInv||[]).filter(r => r.cls === 'A'); }

// The plan is per LINE, always. The screen groups it by surface so fifteen identical duty weeks
// read as one row, but the grouping is presentation only: expand a group and every line is still
// its own decision. Both of the admin's workflows are the same screen, one successor for everything or
// dispersing the work, and neither needs a different data shape underneath.
function obPlanArray(){
  return obLive().map(r => {
    const d = APP.obPlan[obKey(r)] || {};
    return { surface:r.surface, target_id:r.target_id,
             verb: d.verb || r.dflt,
             successor: (d.verb || r.dflt) === 'reassign' ? (d.suc || APP.obSuc || null) : null };
  });
}
// Hoisted out of renderOffboard so they can be tested. They decide what the group control shows,
// which is the difference between a dropdown that holds a choice and one that appears to discard
// it, and buried inside the renderer no fixture could reach them: the mutation that makes a mixed
// group display one of its verbs as though it applied to all of them survived because of that.
// null means MIXED and '' means nobody has one, and those are different answers.
function groupVerb(rows){
  const set = {}; rows.forEach(r => { set[obVerbOf(r)] = 1; });
  const k = Object.keys(set); return k.length === 1 ? k[0] : null;
}
function groupSuc(rows){
  const re = rows.filter(r => obVerbOf(r) === 'reassign');
  if (!re.length) return '';
  const set = {}; re.forEach(r => { set[obSucOf(r)] = 1; });
  const k = Object.keys(set); return k.length === 1 ? k[0] : null;
}
function obVerbOf(r){ const d = APP.obPlan[obKey(r)]; return (d && d.verb) || r.dflt; }
function obSucOf(r){ const d = APP.obPlan[obKey(r)]; return (d && d.suc) || APP.obSuc || ''; }

function obSet(key, field, val){
  APP.obPlan[key] = APP.obPlan[key] || {};
  APP.obPlan[key][field] = val || null;
  APP.obResult = null;
  renderOffboard();
}
function obSetGroup(surface, field, val){
  if (!val) return;   // the placeholder, which means "I have not chosen", not "clear everything"
  obLive().filter(r => r.surface === surface).forEach(r => {
    APP.obPlan[obKey(r)] = APP.obPlan[obKey(r)] || {};
    APP.obPlan[obKey(r)][field] = val || null;
  });
  APP.obResult = null;
  renderOffboard();
}
function obToggle(surface){ APP.obOpen[surface] = !APP.obOpen[surface]; renderOffboard(); }
function obGlobalSuc(v){ APP.obSuc = v || ''; APP.obResult = null; renderOffboard(); }

// Destinations, never a current value, so there is no already-selected escape here: every name
// offered has to be somebody who can actually act.
function obSuccessorOptions(sel, placeholder){
  let o = '<option value="">' + esc(placeholder || 'Reassign to...') + '</option>';
  // a0.31: notLeaving, and this one was found by the checker rather than by the scope. A successor
  // is a DESTINATION for work, and handing a task to somebody who is also leaving means handing it
  // over twice. onTeam alone let that through: a colleague with a future roster end passed it,
  // because their date had not arrived. p.active would have caught the tidy case and not the one
  // that is reachable by hand, active=true with a future date, which is the whole reason the
  // predicate keys on the date instead of the flag.
  // No escape clause here, deliberately, and that is unchanged: these are destinations, not a
  // stored value, so there is nothing an unrelated edit could blank.
  APP.people.filter(p => p.active && notLeaving(p) && p.code !== APP.offboardCode && p.code !== core.ADMIN_CODE)
    .forEach(p => {
      o += '<option value="'+esc(p.code)+'"'+(p.code===sel?' selected':'')+'>'
         + esc(p.code)+' - '+esc(p.full_name)+'</option>';
    });
  return o;
}
function obSel(id, opts, onchange, w){
  return '<select id="'+id+'" onchange="'+onchange+'" style="width:'+(w||150)+'px;display:inline-block;'
       + 'padding:5px 8px;font-family:var(--font-mono);font-size:11px;background:var(--bg2);'
       + 'border:1px solid var(--border);border-radius:5px;color:var(--text);">'+opts+'</select>';
}

async function onPickOffboard(){
  const v = document.getElementById('ob_person').value || null;
  APP.offboardCode = v;
  APP.obInv = null; APP.obPlan = {}; APP.obSuc = ''; APP.obOpen = {}; APP.obResult = null; APP.obErr = null;
  APP.obBaseline = null;
  if (v) await obLoad(); else renderOffboard();
}

// Refetch, never patch. The inventory has gone stale twice inside a single working session, so
// every button that changes anything reloads it rather than adjusting a local copy.
async function obLoad(){
  const code = APP.offboardCode;
  if (!code) return;
  APP.obBusy = true; renderOffboard();
  try {
    const res = await sb.rpc('offboard_inventory', { p_code: code });
    if (res.error) throw res.error;
    APP.obInv = res.data || [];
    APP.obErr = null;
    if (!APP.obBaseline){
      APP.obBaseline = {};
      obFrozen().forEach(r => { APP.obBaseline[r.surface] = r.detail; });
    }
  } catch (e){
    APP.obErr = (e.code ? e.code + ': ' : '') + (e.message || String(e));
    APP.obInv = null;
  }
  APP.obBusy = false;
  renderOffboard();
}

async function obCheck(){
  APP.obBusy = true; renderOffboard();
  try {
    const res = await sb.rpc('offboard_validate', { p_code: APP.offboardCode, p_plan: obPlanArray() });
    if (res.error) throw res.error;
    APP.obResult = { kind:'validate', rows: res.data || [] };
    APP.obErr = null;
  } catch (e){ APP.obErr = (e.code ? e.code+': ' : '') + (e.message || String(e)); }
  APP.obBusy = false; renderOffboard();
}

async function obDryRun(){
  APP.obBusy = true; renderOffboard();
  try {
    const res = await sb.rpc('offboard_apply', { p_code: APP.offboardCode, p_plan: obPlanArray(), p_dry_run: true });
    if (res.error) throw res.error;
    APP.obResult = { kind:'dry', rows: res.data || [] };
    APP.obErr = null;
  } catch (e){ APP.obErr = (e.code ? e.code+': ' : '') + (e.message || String(e)); }
  APP.obBusy = false; renderOffboard();
}

// THE ONLY WRITE ON THIS TAB, and it is gated on having seen the dry run. Not because the server
// needs it (offboard_apply refuses any plan validate rejects) but because a handover is a thing
// somebody should have read before it happens.
async function obApply(){
  if (!APP.obResult || APP.obResult.kind !== 'dry'){
    APP.obErr = 'Press Preview changes first, and read it.'; renderOffboard(); return;
  }
  const n = obPlanArray().length;
  const who = APP.offboardCode;
  if (!confirm('Apply '+n+' change(s) for '+who+'? This writes to the database and cannot be undone from this screen.')) return;
  APP.obBusy = true; renderOffboard();
  try {
    const res = await sb.rpc('offboard_apply', { p_code: who, p_plan: obPlanArray(), p_dry_run: false });
    if (res.error) throw res.error;
    APP.obResult = { kind:'done', rows: res.data || [] };
    APP.obErr = null;
    APP.obPlan = {};
    await loadAll();
    await obLoad();
  } catch (e){
    APP.obErr = (e.code ? e.code+': ' : '') + (e.message || String(e));
    APP.obBusy = false; renderOffboard();
  }
}

// SIX LINES, EVERY ONE DERIVED. Offboarding runs over days and a stored progress flag can disagree
// with reality; a derived checklist cannot lie about it. No hard gates either: cutting access first
// is the right move on a bad exit and this must not fight it.
function obChecklist(){
  const code = APP.offboardCode;
  const p = APP.people.find(x => x.code === code);
  const live = obLive();
  // COUNT WHAT IS MISSING, not what is present. This read "17 of 52 lines have a verb" beside a
  // cross, and all 52 had a verb: 17 was the count of lines whose default is not reassign. The
  // cross was right and the sentence was wrong, which is worse than either. It only misread once
  // reassign was in play, so a person with no reassignable holdings looked fine.
  const needSuc = live.filter(r => obVerbOf(r) === 'reassign' && !obSucOf(r)).length;
  const auth = APP.authByCode ? APP.authByCode[code] : null;
  const loginGone = auth ? !auth.has_login : null;
  let frozenOk = true;
  if (APP.obBaseline) obFrozen().forEach(r => { if (APP.obBaseline[r.surface] !== r.detail) frozenOk = false; });

  const line = (ok, label, detail) =>
    '<tr><td style="width:26px;">' + (ok===null ? '&middot;' : (ok ? '&#10003;' : '&#10007;')) + '</td>'
    + '<td ' + (ok===false ? 'style="color:var(--error);"' : '') + '>' + esc(label) + '</td>'
    + '<td class="wrap">' + esc(detail||'') + '</td></tr>';

  let h = '<div class="tablewrap"><table class="data"><tbody>';
  h += line(true, '1. person picked', (p?p.full_name:code) + (p && p.roster_until ? ', roster ends ' + fmtDateOnly(p.roster_until) : ', no roster end set'));
  h += line(true, '2. what they hold', live.length + ' live, ' + obFrozen().length + ' frozen surface(s)');
  h += line(needSuc === 0, '3. handover decided',
            needSuc === 0 ? 'every line has a verb and, where needed, a successor'
                          : needSuc + ' of ' + live.length + ' line(s) are set to reassign with no successor');
  h += line(live.length === 0, '4. handover executed',
            live.length === 0 ? 'nothing left to hand over' : live.length + ' still held');
  h += line(loginGone, '5. login deleted',
            loginGone === null ? 'auth status not loaded' : (loginGone ? 'no live login' : 'login still live: a flag in the demo data, with no account behind it to delete'));
  // The detail has to say why it is crossed. It first read "frozen record counts unchanged" while
  // showing a cross, because lines 4 and 5 were unmet: true, and it looked like the frozen check
  // was the thing failing. A checklist that is right and reads wrong is still a checklist nobody
  // trusts.
  h += line(live.length === 0 && loginGone === true && frozenOk, '6. clean',
            !frozenOk ? 'FROZEN COUNTS MOVED, investigate before going further'
            : live.length ? 'not yet, ' + live.length + ' line(s) still held'
            : loginGone !== true ? 'not yet, the login is still live'
            : 'nothing held, login gone, frozen record counts unchanged');
  h += '</tbody></table></div>';
  return h;
}

function renderOffboard(){
  const el = document.getElementById('view-offboard');
  // Everybody on the roster, not only people holding open lots. The old list was built from
  // ownedSplit, which sees lots and LRs and nothing else, so somebody holding six duties and an
  // instrument did not appear on the offboarding screen at all.
  let h = '<div class="toolbar"><div class="field" style="margin:0;min-width:300px;">'
        + '<label>Person to offboard</label>'
        + '<select id="ob_person" onchange="onPickOffboard()">'
        + '<option value="">Select a person</option>';
  APP.people.filter(p => p.code !== core.ADMIN_CODE).forEach(p => {
    const sel = p.code === APP.offboardCode ? ' selected' : '';
    const tag = onTeam(p) ? '' : ' (roster ended)';
    h += '<option value="'+esc(p.code)+'"'+sel+'>'+esc(p.code)+' - '+esc(p.full_name)+esc(tag)+'</option>';
  });
  h += '</select></div>';
  if (APP.offboardCode){
    h += '<div class="field" style="margin:0;min-width:260px;">'
       + '<label>Successor for everything reassigned</label>'
       + obSel('ob_gsuc', obSuccessorOptions(APP.obSuc, 'No default, set per line'),
               'obGlobalSuc(this.value)', 240) + '</div>';
  }
  h += '</div>';

  if (APP.obErr) h += '<div class="errbox">' + esc(APP.obErr) + '</div>';
  if (APP.obBusy){ h += '<div class="empty">Working...</div>'; el.innerHTML = h; return; }

  if (!APP.offboardCode){
    h += '<div class="empty">Pick a person. Everything they hold is read live from the database, '
       + 'across all seventeen surfaces, not just lots and lab reports.</div>';
    el.innerHTML = h; return;
  }
  if (!APP.obInv){ h += '<div class="empty">No inventory loaded.</div>'; el.innerHTML = h; return; }

  const p = APP.people.find(x => x.code === APP.offboardCode);
  const until = p && p.roster_until ? fmtDateOnly(p.roster_until) : fmtDateOnly(sgtToday()) + ' (today, no roster end set)';
  h += '<div class="note"><b>Access date ' + esc(until) + '.</b> Every date-ranged decision on this '
     + 'screen is measured against it: a duty or booking ending on or before it needs no handover, '
     + 'and <b>truncate</b> cuts an end date back to it.</div>';

  h += obChecklist();

  const live = obLive();
  if (live.length === 0){
    h += '<div class="note"><b>' + esc(p ? p.full_name : APP.offboardCode) + '</b> holds nothing live. '
       + 'Everything below is frozen record and stays with their name permanently.</div>';
  }

  // Grouped by surface. Collapsed by default: fifteen identical duty weeks are one line until you
  // want them not to be.
  const surfaces = [];
  live.forEach(r => { if (surfaces.indexOf(r.surface) < 0) surfaces.push(r.surface); });
  if (surfaces.length){
    h += '<div class="tablewrap"><table class="data"><thead><tr>'
       + '<th style="width:230px;">Surface</th><th>Item</th><th style="width:150px;">Verb</th>'
       + '<th style="width:190px;">Successor</th></tr></thead><tbody>';
    // WHAT WILL HAPPEN, on the collapsed row. Twelve groups reading "15 item(s)" tell you what is
    // there and nothing about what you have decided, so the summary was hiding the only thing worth
    // summarising and every group had to be expanded to be read. A reassign with no successor is
    // called out in red because it is actionable and it blocks the apply.
    const dispo = rows => {
      const m = {}, order = [];
      rows.forEach(r => {
        const v = obVerbOf(r);
        const k = v !== 'reassign' ? v : (obSucOf(r) ? 'reassign to ' + obSucOf(r) : 'NO SUCCESSOR');
        if (m[k] === undefined){ m[k] = 0; order.push(k); }
        m[k]++;
      });
      return order.map(k => k === 'NO SUCCESSOR'
        ? '<span style="color:var(--error);">' + m[k] + ' reassign, no successor</span>'
        : esc(m[k] + ' ' + k)).join(', ');
    };
    // THE GROUP CONTROL SHOWS THE GROUP'S STATE. a0.28a made it a pure setter opening on a
    // placeholder, which was honest about mixed groups and unusable: it re-rendered on the
    // placeholder after every choice, so the dropdown visibly snapped back and looked broken even
    // though the plan underneath had taken the change. A control that discards what you just chose
    // is wrong however correct it is underneath.
    // Uniform group, show the verb. Mixed group, show "mixed". Both true, neither bounces.
    surfaces.forEach(sf => {
      const rows = live.filter(r => r.surface === sf);
      const open = !!APP.obOpen[sf];
      const verbs = rows[0].verbs.split(',');
      const gv = groupVerb(rows), gs = groupSuc(rows);
      h += '<tr><td><button class="link" onclick="obToggle(\'' + esc(sf) + '\')">'
         + (open ? '&#9662; ' : '&#9656; ') + esc(sf) + '</button></td>'
         + '<td class="wrap">' + rows.length + ' item(s)'
         + (rows.length === 1 ? ': ' + esc(rows[0].label) : '')
         + ' <span class="meta">&middot; ' + dispo(rows) + '</span></td>'
         // A SETTER, NOT A STATE. It first rendered with no placeholder, so the browser showed the
         // first verb in the list and the screen read "reassign all" while the plan still held the
         // inventory default. A group can hold mixed verbs anyway, so there is no single value it
         // could honestly display. It offers actions and shows none of them as chosen.
         + '<td>' + obSel('obg_v_'+sf.replace(/[^a-z_]/gi,''),
             (gv === null ? '<option value="" selected>mixed</option>' : '')
             + verbs.map(v => '<option value="'+esc(v)+'"'+(v===gv?' selected':'')+'>'+esc(v)+'</option>').join(''),
             'obSetGroup(\'' + esc(sf) + '\',\'verb\',this.value)', 130) + '</td>'
         + '<td>' + (verbs.indexOf('reassign') >= 0
             ? obSel('obg_s_'+sf.replace(/[^a-z_]/gi,''),
                     obSuccessorOptions(gs === null ? '' : gs, gs === null ? 'mixed' : 'set all to...'),
                     'obSetGroup(\'' + esc(sf) + '\',\'suc\',this.value)', 175)
             : '') + '</td></tr>';
      if (open) rows.forEach(r => {
        const k = obKey(r), v = obVerbOf(r);
        h += '<tr><td style="padding-left:22px;" class="code">#' + esc(r.target_id) + '</td>'
           + '<td class="wrap">' + esc(r.label) + ' <span class="meta">' + esc(r.detail||'') + '</span></td>'
           + '<td>' + obSel('ob_v_'+k.replace(/[^a-z0-9_]/gi,''),
               r.verbs.split(',').map(x => '<option value="'+esc(x)+'"'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join(''),
               'obSet(\'' + esc(k) + '\',\'verb\',this.value)', 130) + '</td>'
           + '<td>' + (v === 'reassign'
               ? obSel('ob_s_'+k.replace(/[^a-z0-9_]/gi,''), obSuccessorOptions(obSucOf(r)),
                       'obSet(\'' + esc(k) + '\',\'suc\',this.value)', 175)
               : '') + '</td></tr>';
      });
    });
    h += '</tbody></table></div>';

    h += '<div class="toolbar">'
       + '<button class="btn small" onclick="obCheck()">Check plan</button> '
       + '<button class="btn small" onclick="obDryRun()">Preview changes</button> '
       + '<button class="btn" onclick="obApply()">Apply</button> '
       + '<button class="link" onclick="obLoad()">Reload inventory</button>'
       + '</div>';
  }

  if (APP.obResult){
    const rows = APP.obResult.rows;
    if (APP.obResult.kind === 'validate'){
      const errs = rows.filter(x => x.severity === 'ERROR');
      h += '<div class="note"><b>' + errs.length + ' error(s), ' + (rows.length - errs.length) + ' warning(s).</b> '
         + (errs.length ? 'Apply is refused while any error stands.' : 'The plan is complete and legal.') + '</div>';
      if (rows.length){
        h += '<div class="tablewrap"><table class="data"><thead><tr><th style="width:90px;">Severity</th>'
           + '<th style="width:260px;">Line</th><th>Problem</th></tr></thead><tbody>';
        rows.forEach(x => {
          h += '<tr><td ' + (x.severity === 'ERROR' ? 'style="color:var(--error);"' : '') + '>' + esc(x.severity) + '</td>'
             + '<td class="code">' + esc(x.line_ref) + '</td><td class="wrap">' + esc(x.problem) + '</td></tr>';
        });
        h += '</tbody></table></div>';
      }
    } else {
      // SAY WHAT APPLY WOULD DO. It read "Dry run, 2 line(s). Nothing has been written", which
      // announces the mechanism and leaves the reader to work out the meaning, and on an all-keep
      // plan a correct run looks like a broken one. Count what actually changes and say so.
      const chg = rows.filter(x => x.verb !== 'keep').length;
      h += '<div class="note">'
         + (APP.obResult.kind === 'done'
            ? '<b>Applied.</b> ' + chg + ' of ' + rows.length + ' line(s) changed, and one row was '
              + 'logged for every one of them.'
            : '<b>This is what Apply would do. Nothing has been written yet.</b> '
              + (chg === 0
                 ? 'Every line is set to keep, so Apply would change nothing at all. That is a valid '
                   + 'plan: it records that you looked and decided to leave everything where it is.'
                 : chg + ' of ' + rows.length + ' line(s) would change; the rest are kept as they are.'))
         + '</div>';
      h += '<div class="tablewrap"><table class="data"><thead><tr><th style="width:230px;">Surface</th>'
         + '<th style="width:70px;">Item</th><th style="width:100px;">Verb</th><th>Outcome</th>'
         + '</tr></thead><tbody>';
      rows.forEach(x => {
        h += '<tr><td class="code">' + esc(x.surface) + '</td><td class="code">#' + esc(x.target_id) + '</td>'
           + '<td>' + esc(x.verb) + '</td><td class="wrap">' + esc(x.outcome) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
  }

  const frozen = obFrozen();
  if (frozen.length){
    h += '<div class="note"><b>Frozen record, never touched.</b> These keep this name permanently as a '
       + 'GMP record and no verb on this screen can move them.</div>';
    h += '<div class="tablewrap"><table class="data"><thead><tr><th style="width:230px;">Surface</th>'
       + '<th>What</th><th style="width:80px;">Count</th></tr></thead><tbody>';
    frozen.forEach(r => {
      h += '<tr><td class="code">' + esc(r.surface) + '</td><td class="wrap">' + esc(r.label) + '</td>'
         + '<td>' + esc(r.detail) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }

  el.innerHTML = h;
}

// ============================================================
// EDIT PANEL  -  admin full-edit, lots AND LRs, dispatched off one find box.
// Lot: any non-frozen lot including locked ones, saved via the branched
// update_lot (locked edits write an admin_edit_log row server-side).
// LR:  any UNSIGNED report, whoever owns it - update_lr's owner guard has an
// admin escape. Its report_date lock guard does NOT, so an approved LR is
// refused here and pointed at Revise in the queue, which archives the
// superseded revision rather than overwriting a signed record.
// ============================================================
function meLabelAdmin(){ return APP.me ? ((APP.me.full_name||'')+' ('+(APP.me.code||'')+')') : 'admin'; }
function fmtDateOnly(s){ if (!s) return ''; const p=String(s).slice(0,10).split('-'); if (p.length!==3) return ''; return p[2]+'/'+p[1]+'/'+p[0].slice(2); }
// core.now() is the pinned clock, and the only one. Was new Date().
function sgtToday(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Singapore', year:'numeric', month:'2-digit', day:'2-digit' }).format(core.now()); }
function lrFull(lr){ return (lr.lr_number||'') + (lr.lr_display||''); }   // lr_display is the '/PROD/Rnn' suffix, not the whole number
function typeOptions(list, selected){ return (list||[]).filter(t=>t.active || t.value===selected).map(t => '<option value="'+esc(t.value)+'"'+(t.value===selected?' selected':'')+'>'+esc(t.value)+'</option>').join(''); }
function firstNonUseTestTypeAdmin(){ const t = (APP.lotTypes||[]).find(x=>x.active && x.value!=='Use Test'); return t?t.value:''; }
// a0.27: off-team excluded, same separate test and same already-selected escape as rosterOptions.
// This one carries a frozen GMP record, so the escape is doing real work: a signed LR keeps its
// author's name and loading that row must not offer to silently reassign it to nobody.
function ownerOptionsAdmin(selected){
  let o = '<option value=""'+(!selected?' selected':'')+'>(none)</option>';
  APP.people.slice().sort((a,b)=>a.code.localeCompare(b.code)).forEach(p => {
    const c = p.code;
    if (c === core.ADMIN_CODE && c !== selected) return;   // admin-only, never an assignable owner
    if (!p.active && c !== selected) return;
    if (!onTeam(p) && c !== selected) return;
    const label = esc(c)+' - '+esc(p.full_name)
                + (!onTeam(p) ? ' (left)' : (p.active ? '' : ' (inactive)'));
    o += '<option value="'+esc(c)+'"'+(c===selected?' selected':'')+'>'+label+'</option>';
  });
  return o;
}

function renderEditTab(){
  const el = document.getElementById('view-edit'); if (!el) return;
  el.innerHTML =
    '<div class="toolbar"><div class="meta">Admin full-edit. Load a <b>lot</b> or an <b>LR</b> by its number. Lots: every field, including a locked lot, e.g. to clear a mistaken experiment end date and reopen it; editing a locked lot writes an audit record; frozen 2025 records refuse. LRs: every field while the report is unsigned, whoever owns it; an approved report cannot be edited by anyone and must be superseded with Revise in the queue.</div></div>'
    + '<div style="display:flex;gap:8px;align-items:center;margin:10px 0;">'
    + '<input type="text" id="edit_find" placeholder="TRV-26-05  or  LR26019" autocomplete="off" '
    +   'style="text-transform:uppercase;flex:0 0 260px;padding:8px 10px;font-family:var(--font-mono);font-size:13px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);" '
    +   'onkeydown="if(event.key===\'Enter\')adminFindRecord()">'
    + '<button class="btn primary" onclick="adminFindRecord()">Load</button>'
    + '</div>'
    + '<div class="note" id="edit_msg" style="display:none;"></div>';
}
function editMsg(text){
  const m = document.getElementById('edit_msg'); if (!m) return;
  m.textContent = text || ''; m.style.display = text ? 'block' : 'none';
}
// One box, two registers. Lot numbers are PRODUCT-YY-NN, LR numbers LRYYNNN,
// so they cannot collide. An LR matches on its bare number or its full display form.
function adminFindRecord(){
  const raw = (document.getElementById('edit_find').value||'').trim().toUpperCase();
  if (!raw){ editMsg('Enter a lot number or an LR number.'); return; }

  const lot = APP.lots.find(x => (x.lot_number||'').toUpperCase() === raw);
  if (lot){
    if (lot.frozen){ editMsg(lot.lot_number+' is a frozen 2025 record and cannot be edited.'); return; }
    editMsg('');
    openAdminEditLot(lot.id);
    return;
  }

  const lr = APP.lrs.find(x => (x.lr_number||'').toUpperCase() === raw || lrFull(x).toUpperCase() === raw);
  if (lr){
    if (lrLocked(lr)){
      editMsg(lrFull(lr)+' was approved on '+fmtDateOnly(lr.report_date)+' and is locked. An approved report cannot be edited, admin included. To supersede it, use Revise in the queue: that archives this revision and reopens the next one.');
      return;
    }
    editMsg('');
    openAdminEditLr(lr.id);
    return;
  }

  editMsg('No lot or LR '+raw+' found. Lots look like TRV-26-05, LRs like LR26019 or LR26019/TRV/R01.');
}

function openAdminEditLot(id){
  const lot = APP.lots.find(x => x.id === id); if (!lot) return;
  if (lot.frozen){ toastErr('Frozen records cannot be edited.'); return; }
  APP.editLot = id;
  const lockNote = lotLocked(lot)
    ? '<div class="note">This lot is currently locked. Saving as admin will edit it and write an audit record. To reopen it, clear the field that locks it (experiment end for a normal lot, d2 for a use test).</div>'
    : '';
  const utDates = '<div id="utDates" style="display:'+(lot.is_use_test?'block':'none')+';">'
    + '<div class="field"><label>d1  use test started</label><input type="date" id="f_d1" value="'+esc((lot.d1||'').slice(0,10))+'"></div>'
    + '<div class="field"><label>d2  sample submitted to QC (this locks the lot)</label><input type="date" id="f_d2" value="'+esc((lot.d2||'').slice(0,10))+'"></div>'
    + '<div class="field"><label>d3  QC summary received</label><input type="date" id="f_d3" value="'+esc((lot.d3||'').slice(0,10))+'"></div>'
    + '</div>';
  const expDates = '<div id="expDates" style="display:'+(lot.is_use_test?'none':'block')+';">'
    + '<div class="field"><label>Experiment start</label><input type="date" id="f_expstart" max="'+sgtToday()+'" value="'+esc((lot.experiment_start||'').slice(0,10))+'"></div>'
    + '<div class="field"><label>Experiment end (this locks the lot)</label><input type="date" id="f_expend" max="'+sgtToday()+'" value="'+esc((lot.experiment_end||'').slice(0,10))+'"></div>'
    + '</div>';
  const body = '<div class="modal-title">Admin edit '+esc(lot.lot_number)+'</div>'
    + '<div class="modal-as">Editing as '+esc(meLabelAdmin())+'</div>'
    + lockNote
    + '<div class="field"><label>Type</label><select id="f_type">'+typeOptions(APP.lotTypes, lot.lot_type)+'</select></div>'
    + '<div class="field"><label>Purpose (required)</label><textarea id="f_text" rows="3">'+esc(lot.purpose)+'</textarea></div>'
    + '<div class="field"><label>LR Ref</label><input type="text" id="f_lrref" value="'+esc(lot.lab_report_number)+'"></div>'
    + '<div class="field"><label>Remarks</label><textarea id="f_remarks" rows="2">'+esc(lot.remarks)+'</textarea></div>'
    + '<div class="field"><label>Reserved by</label><select id="f_owner">'+ownerOptionsAdmin(lot.reserved_by)+'</select></div>'
    + '<div class="field"><label><input type="checkbox" id="f_usetest"'+(lot.is_use_test?' checked':'')+'> Use Test (LR Ref becomes this lot number)</label></div>'
    + utDates + expDates
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="okBtn" onclick="submitAdminEditLot()">Save changes</button></div>';
  showModal(body);
  wireUseTestAdmin();
}

function wireUseTestAdmin(){
  const sel = document.getElementById('f_type'), cb = document.getElementById('f_usetest'), lr = document.getElementById('f_lrref');
  const dates = document.getElementById('utDates'), expDates = document.getElementById('expDates');
  if (!sel || !cb) return;
  const lot = APP.lots.find(x => x.id === APP.editLot);
  const showDates = on => { if (dates) dates.style.display = on?'block':'none'; if (expDates) expDates.style.display = on?'none':'block'; };
  const lock = () => { sel.value='Use Test'; sel.disabled=true; if (lr){ lr.value = (lot?lot.lot_number:'') || lr.value; lr.disabled=true; } showDates(true); };
  const unlock = () => { sel.disabled=false; if (lr){ lr.disabled=false; lr.value=''; } showDates(false); };
  cb.addEventListener('change', () => { if (cb.checked) lock(); else { unlock(); if (sel.value==='Use Test') sel.value = firstNonUseTestTypeAdmin(); } });
  sel.addEventListener('change', () => { if (sel.value==='Use Test'){ cb.checked=true; lock(); } });
  if (cb.checked) lock(); else showDates(false);
}

async function submitAdminEditLot(){
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  errEl.textContent = '';
  const id = APP.editLot;
  const v = elId => { const e = document.getElementById(elId); return e ? e.value.trim() : ''; };
  const type = v('f_type'), text = v('f_text');
  if (!type || !text){ errEl.textContent = 'Type and purpose are required.'; return; }
  const isUT = document.getElementById('f_usetest').checked;
  const d1 = isUT ? (v('f_d1')||null) : null;
  const d2 = isUT ? (v('f_d2')||null) : null;
  const d3 = isUT ? (v('f_d3')||null) : null;
  const expStart = !isUT ? (v('f_expstart')||null) : null;
  const expEnd   = !isUT ? (v('f_expend')||null) : null;
  if (!isUT){
    if (expEnd && !expStart){ errEl.textContent='Set the experiment start date before the end date.'; return; }
    if (expStart && expEnd && expEnd <= expStart){ errEl.textContent='Experiment end date must be later than the start date.'; return; }
  }
  lockBtn(btn,'Saving...');
  try {
    const res = await sb.rpc('update_lot', {
      p_id: id, p_lot_type: type, p_purpose: text, p_is_use_test: isUT,
      p_lab_report_number: v('f_lrref')||null, p_remarks: v('f_remarks')||null,
      p_reserved_by: v('f_owner')||null,
      p_d1: d1, p_d2: d2, p_d3: d3,
      p_experiment_start: expStart, p_experiment_end: expEnd
    });
    if (res.error) throw res.error;
    const num = (APP.lots.find(x=>x.id===id)||{}).lot_number || '';
    closeModal(); toast('Saved '+num);
    await loadAll();
    editMsg('Saved '+num+'. Reload it by number to make further edits.');
  } catch(e){
    errEl.textContent = friendlyErr(e, 'Could not save the lot.');
    if (btn){ btn.disabled=false; btn.textContent = btn.dataset.label || 'Save changes'; }
  }
}

// ------------------------------------------------------------
// LR editor. update_lr is 7-arg; p_revision and p_standalone are both
// coalesced server-side, so a null p_revision holds the stored revision.
// Revision is deliberately not editable: revise_lr owns it and snapshots the
// superseded row into lab_reports_archive first.
// ------------------------------------------------------------
function openAdminEditLr(id){
  const lr = APP.lrs.find(x => x.id === id); if (!lr) return;
  if (lrLocked(lr)){ toastErr('Approved reports cannot be edited. Revise it in the queue instead.'); return; }
  APP.editLr = id;
  const body = '<div class="modal-title">Admin edit '+esc(lrFull(lr))+'</div>'
    + '<div class="modal-as">Editing as '+esc(meLabelAdmin())+'</div>'
    + '<div class="note">Revision '+esc(String(lr.revision||1))+'. Revisions are made with Revise in the queue, which archives the superseded report, so the number is not editable here.</div>'
    + '<div class="field"><label>Type</label><select id="f_lrtype">'+typeOptions(APP.lrTypes, lr.lr_type)+'</select></div>'
    + '<div class="field"><label>Subject (required)</label><textarea id="f_subject" rows="3">'+esc(lr.subject)+'</textarea></div>'
    + '<div class="field"><label>Approval date (setting this signs and locks the report)</label><input type="date" id="f_rptdate" max="'+sgtToday()+'" value="'+esc((lr.report_date||'').slice(0,10))+'"></div>'
    + '<div class="field"><label>Created by</label><select id="f_lrowner">'+ownerOptionsAdmin(lr.created_by)+'</select></div>'
    + '<div class="field"><label><input type="checkbox" id="f_standalone"'+(lr.standalone?' checked':'')+'> Standalone LR (no lots reference this report)</label></div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="okBtn" onclick="submitAdminEditLr()">Save changes</button></div>';
  showModal(body);
}

async function submitAdminEditLr(){
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  errEl.textContent = '';
  const id = APP.editLr;
  const v = elId => { const e = document.getElementById(elId); return e ? e.value.trim() : ''; };
  const type = v('f_lrtype'), subject = v('f_subject');
  if (!type || !subject){ errEl.textContent = 'Type and subject are required.'; return; }
  const rptDate = v('f_rptdate') || null;
  if (rptDate && rptDate > sgtToday()){ errEl.textContent = 'Approval date cannot be in the future.'; return; }
  const num = lrFull(APP.lrs.find(x => x.id === id) || {});
  lockBtn(btn,'Saving...');
  try {
    const res = await sb.rpc('update_lr', {
      p_id: id, p_lr_type: type, p_subject: subject,
      p_report_date: rptDate, p_revision: null,
      p_created_by: v('f_lrowner')||null,
      p_standalone: document.getElementById('f_standalone').checked
    });
    if (res.error) throw res.error;
    closeModal(); toast('Saved '+num);
    await loadAll();
    editMsg(rptDate
      ? 'Saved '+num+'. It is now approved and locked, so further changes need a revision in the queue.'
      : 'Saved '+num+'. Reload it by number to make further edits.');
  } catch(e){
    errEl.textContent = friendlyErr(e, 'Could not save the report.');
    if (btn){ btn.disabled=false; btn.textContent = btn.dataset.label || 'Save changes'; }
  }
}

async function doReassign(kind, id){
  const sel = document.getElementById('ra_'+kind+'_'+id);
  const to = sel ? sel.value : '';
  if (!to){ toastErr('Pick someone to reassign to first.'); return; }
  await applyOwner(kind, id, to, 'Reassigned to '+to);
}
async function doRelease(kind, id){
  await applyOwner(kind, id, null, 'Released');
}

// Sends the full update_lot / update_lr arg set with only the owner changed.
async function applyOwner(kind, id, newOwner, okMsg){
  try {
    let res;
    if (kind === 'lot'){
      const lot = APP.lots.find(x => x.id === id);
      if (!lot){ toastErr('Row not found. Refresh.'); return; }
      res = await sb.rpc('update_lot', {
        p_id: lot.id,
        p_lot_type: lot.lot_type,
        p_purpose: lot.purpose,
        p_is_use_test: lot.is_use_test,
        p_lab_report_number: lot.lab_report_number,
        p_remarks: lot.remarks,
        p_reserved_by: newOwner,
        p_d1: lot.d1, p_d2: lot.d2, p_d3: lot.d3,
        p_experiment_start: lot.experiment_start, p_experiment_end: lot.experiment_end
      });
    } else {
      const lr = APP.lrs.find(x => x.id === id);
      if (!lr){ toastErr('Row not found. Refresh.'); return; }
      res = await sb.rpc('update_lr', {
        p_id: lr.id,
        p_lr_type: lr.lr_type,
        p_subject: lr.subject,
        p_report_date: lr.report_date,
        p_revision: lr.revision,
        p_created_by: newOwner
      });
    }
    if (res.error) throw res.error;
    toast(okMsg);
    await loadAll();
    renderOffboard();
  } catch(e){ toastErr(friendlyErr(e, 'Could not update the item.')); }
}

// ============================================================
// SHARED HELPERS  (modal / toast / esc, from the queue page)
// ============================================================
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').style.display = 'flex'; }
function closeModal(){ document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('modalBody').innerHTML = ''; }
function lockBtn(btn, label){ if (btn){ btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = label; } }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

let toastTimer = null;
function toast(text){ showToast(text, 'var(--ok)'); }
function toastErr(text){ showToast(text, 'var(--error)'); }
function showToast(text, bg){
  const t = document.getElementById('toast');
  t.textContent = text; t.style.background = bg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 6000);
}

function esc(s){ return (s==null) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Surface the RPC's own message (P0001 guards carry the useful text), fall back otherwise.
function friendlyErr(e, fallback){
  const m = e && e.message ? e.message : '';
  if (m) return m;
  return fallback;
}
// ============================================================
// SEMINAR PANEL  -  a0.15  -  [REMOVED]
// ============================================================
// The whole panel is gone: the series palette, the status table, the upcoming window, the date
// helpers, the row mapper, the filter, the board and series views, the update-params builder
// and the owner dropdown. 407 lines.
//
// WHY IT COULD NOT BE PORTED. The panel is the admin half of a split whose four RPCs (create,
// update, delete and lock) core.js does not implement -- deliberately, and it says so at its own
// section 7: "that tab is removed. Add them back the day the tab returns, not before." Keeping
// the markup would have shipped a tab that errors on every control. The read it loaded has no
// entry in the core.js registry either.
//
// WHAT SURVIVED, and it is not sentiment. The two clipboard helpers below outlive the panel
// because the DUTIES tab calls the first of them for its per-period copy. They are generic and
// happened to be written here first. Their names are left alone: renaming them would edit a
// call site this port has no other reason to touch, and the prefix is two letters.
function pwCopyText(text, okMsg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast(okMsg)).catch(() => pwFallbackCopy(text, okMsg));
  } else pwFallbackCopy(text, okMsg);
}
function pwFallbackCopy(text, okMsg){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast(okMsg);
  } catch(e){ toastErr('Copy failed. Nothing was put on the clipboard.'); }
}
