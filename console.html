     meaning is how a class name stops being a shared assumption and becomes a shared bug. */
  /* ---------- duties (a0.18) ----------
     The import box needs room to be pasted into and the report needs room to be read. Neither
     fits the panel-table idiom the other five setup panels use, which is why duties took a tab. */
  .di-wrap{padding:2px 0 4px;}
  .di-help{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:9px;}
  .di-help code{font-family:var(--font-mono);font-size:11px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;}
  .di-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .di-box{width:100%;min-height:150px;font-family:var(--font-mono);font-size:12px;line-height:1.5;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);resize:vertical;}
  .di-box:focus{border-color:var(--accent);outline:none;}
  /* The report is a block, not a toast. A 52-line paste can fail on line 37 and a toast is gone
     before you have found it. It also survives a SUCCESSFUL import, because "14 inserted, 38
     already present" is the answer to "did my second paste do anything". */
  .di-rep{margin-top:9px;border:1px solid var(--border);border-radius:6px;padding:8px 11px;max-height:260px;overflow-y:auto;}
  .di-rep.di-ok{border-color:var(--ok);}
  .di-rep.di-bad{border-color:var(--error);}
  .di-rh{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:baseline;gap:8px;}
  .di-line{font-family:var(--font-mono);font-size:11px;color:var(--text2);padding:1px 0;}
  .di-line.di-err{color:var(--error);}
  .di-no{display:inline-block;min-width:64px;color:var(--muted);}
  .di-past{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .bd-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);}
  .bd-l{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .bd-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
  /* a0.23. Type heading above each assignments table. The tables below it carry no Type column
     any more, because it repeated one value down every row of its own section. */
  /* a0.26. Absence overlapping an assignment. Warn, never error: it is a swap worth considering,
     not a fault, and one day of five is often fine. Full coverage takes the heavier weight. */
  .da-away{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--warn);white-space:nowrap;}
  .da-away-all{text-decoration:underline;}
  .inactive .da-away{color:var(--muted);font-weight:400;text-decoration:none;}
  .da-sub{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin:14px 0 4px;}
  .da-sub:first-child{margin-top:2px;}
  .st-none{font-size:12px;color:var(--muted);padding:6px 0;}
  /* a0.20. Two rows of one period holding different topics. Warn, not error: nothing is broken,
     but one of the two is invisible until you retype the topic and overwrite both. */
  .texsel,.rowsel{font-family:var(--font-mono);font-size:11px;padding:3px 5px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);}
  .rowsel{max-width:170px;}
  .swatch{width:24px;height:22px;border:1px solid var(--border);border-radius:4px;padding:0;background:none;cursor:pointer;vertical-align:middle;}
  .swatch::-webkit-color-swatch-wrapper{padding:2px;}
  .swatch::-webkit-color-swatch{border:none;border-radius:2px;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:7px;vertical-align:middle;}
  .cwarn{font-family:var(--font-mono);font-size:10px;color:var(--warn);margin-left:8px;}
  .ord{display:inline-flex;gap:3px;}
  .ord button{font-family:var(--font-mono);font-size:11px;line-height:1;padding:3px 6px;border:1px solid var(--border);background:var(--card);color:var(--text2);border-radius:3px;cursor:pointer;}
  .ord button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .ord button:disabled{opacity:0.22;cursor:default;}
  tr.addrow td{background:var(--accent-dim);}
  tr.addrow input[type=text],tr.addrow input[type=date]{width:100%;padding:5px 7px;font-family:var(--font-body);font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;color:var(--text);outline:none;}
  tr.addrow input[type=text]:focus,tr.addrow input[type=date]:focus{border-color:var(--accent);}
  [data-theme="dark"] input[type="date"]{color-scheme:dark;}
  #view-tdsetup tr.inactive td{opacity:0.45;}
  /* a0.21. The code cell. Mono and upper case because it is a key, not prose: a code that looks
     like a label invites being typed like one. Narrower than .inline-in since codes are short. */
  .code-in{width:100%;max-width:110px;padding:3px 6px;font-family:var(--font-mono);font-size:12px;text-transform:uppercase;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text2);outline:none;}
  .code-in:hover{border-color:var(--border);}
  .code-in:focus{border-color:var(--accent);color:var(--text);}
  .inline-in{width:100%;min-width:120px;padding:3px 6px;font-family:var(--font-body);font-size:12px;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text);outline:none;}
  .inline-in:hover{border-color:var(--border);}
  .inline-in:focus{border-color:var(--accent);background:var(--bg2);}
  .tick{width:auto;cursor:pointer;}
  .rowdel{font-family:var(--font-mono);font-size:14px;line-height:1;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:4px;}
  table.data td.mid{text-align:center;}
  table.data th.mid{text-align:center;}
  .locked{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
  .panel table.data{width:auto;min-width:560px;max-width:900px;}
  .panel table.data th.grow-col,.panel table.data td.grow-col{width:100%;}
  /* [REMOVED] the seminar panel stylesheet, 104 lines: its custom properties, the board and
     series layouts, the status pills, the toolbar and the lock control. */
  /* [REMOVED] .banner-build rules went with the stale-tab check. */
</style>
</head>
<body>

<!-- [REMOVED] build banner and login screen. The denied screen is RESTORED for the Viewing as
     picker: a non-admin can now be chosen, and the original refused them with this screen, not a
     toast. Its Sign out button is replaced by the picker, because there is no login to leave. -->
<div id="denied" class="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="auth-icon">&#9888;</div>
    <div class="auth-title">Not authorised</div>
    <div class="auth-sub" id="deniedEmail"></div>
    <div class="auth-msg">This console is admin only. You're signed in, but this account isn't an admin, so there's nothing here.</div>
    <div class="auth-msg"><label class="viewas">Viewing as <select data-viewas onchange="viewAsChange(this.value)"></select></label></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-left">
      <h1>Admin <span>Console</span></h1>
      <div class="header-sub">Roster and offboarding &middot; admin only</div>
    </div>
    <div class="header-right">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">&#9728;</button>
      <label class="viewas" title="Who the tools treat you as. Stands in for signing in; shared by all three tools.">Viewing as <select data-viewas onchange="viewAsChange(this.value)"></select></label>
      <span class="identity" id="identity"></span>
      <button class="btn" onclick="loadAll()">Refresh</button>
      <button class="btn" onclick="resetData()" title="Discard local changes and re-seed">Reset data</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" id="tab-roster" onclick="switchTab('roster')">Roster</button>
      <button class="tab" id="tab-products" onclick="switchTab('products')">Products</button>
      <button class="tab" id="tab-offboard" onclick="switchTab('offboard')">Offboard</button>
      <button class="tab" id="tab-edit" onclick="switchTab('edit')">Edit</button>
      <button class="tab" id="tab-tdsetup" onclick="switchTab('tdsetup')">Schedule setup</button>
      <!-- [REMOVED] the seminar tab button -->
      <button class="tab" id="tab-duties" onclick="switchTab('duties')">Duties</button>
    </div>
    <div id="view-roster"></div>
    <div id="view-products" style="display:none;"></div>
    <div id="view-offboard" style="display:none;"></div>
    <div id="view-edit" style="display:none;"></div>
    <div id="view-tdsetup" style="display:none;"></div>
    <!-- [REMOVED] the seminar view container -->
    <div id="view-duties" style="display:none;"></div>
  </div>

  <div class="footer">Bench build &middot; local data only &middot; <span id="storeMode"></span></div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal" id="modalBody"></div>
</div>
<div id="toast" class="toast" style="display:none;"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
// [REMOVED] the environment table and the active-environment switch. There is no project to
// point at and no environment to choose: core.js holds the dataset and the identity.

const APP = {
  me: null, isAdmin: false,
  people: [],        // [{code, full_name, active, mentor, roster_until}]  mentor added by the a0.17
                     // team_members(), roster_until by the B2 rebuild 31/07/26. Two independent
                     // levers: active is posture 2, roster_until is the leaver. Never conflate.
  authByCode: {},    // { code: {has_login, banned, last_sign_in} } from roster_auth_status()
  lots: [], lrs: [], // full register, for offboard open-item scan
  lotTypes: [],      // [{value, active}] for the admin Lot edit Type dropdown
  lrTypes: [],       // [{value, active}] for the admin LR edit Type dropdown
  editLot: null,     // scratch: lot id currently in the admin edit dialog
  editLr: null,      // scratch: LR id currently in the admin edit dialog
  activeTab: 'roster',
  offboardCode: null, // person selected in the offboard panel
  // a0.28. The Offboard tab is now driven by offboard_inventory() rather than by ownedSplit, so
  // the state it needs is the fetched inventory, the per-line plan on top of it, and nothing else.
  // obBaseline captures the class A counts on first load: checklist line 6 compares against it, so
  // a frozen record moving during a handover is caught rather than assumed impossible.
  obInv: null,        // rows from offboard_inventory(), null until fetched
  obPlan: {},         // "surface|target_id" -> { verb, suc }, sparse: absent means use dflt
  obSuc: '',          // global successor, pre-fills every reassign line that has no override
  obOpen: {},         // surface -> expanded
  obResult: null,     // { kind:'validate'|'dry'|'done', rows }
  obBaseline: null,   // surface -> frozen count at first load
  showGone: false,   // the Departed section, collapsed by default
  obBusy: false,
  obErr: null,
  taskStatuses: [], absenceTypes: [], instruments: [], standingRoles: [], // the schedule tool lookups (products reused from above)
  dutyTypes: [], duties: [],   // a0.18. duty_types and duty_assignments, read straight off the
                               // tables like every other the schedule tool lookup; writes go through RPCs.
  dutyErr: null,
  dutyPast: false,             // show assignments that have already finished. Off by default: 52
                               // weeks of history buries the weeks anyone can still act on.
  dutyImport: null,            // last import report, [{line_no, ok, message}]. Held rather than
                               // toasted: a 52-line paste can fail on line 37 and a toast is gone
                               // before you have found it.
  dutyImportType: null,        // which type the last report belonged to
  tdListErr: {},     // per-list read error for the Schedule setup tab
  // [REMOVED] the seminar state: rows, error, view, search and the two filters.
};

// ---------- theme ----------
const THEME_KEY = 'tdtools-theme';
// Guarded, both ways, and this is the file:// requirement rather than defensive habit. A browser
// may refuse localStorage outright there and THROW on access rather than returning null. This
// block runs before anything else on the page, so an unguarded read takes the whole page down
// before core.js is ever asked for a row: a blank page, no error the user can act on, and a theme
// preference as the cause. core.js already makes this call for the dataset store and reports which
// mode it landed in; the theme is only a preference, so it fails to the default and says nothing.
// Identical in index.html, queue.html, console.html and sched.html. If you change one, change all.
function themeRead(){ try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } }
function themeWrite(v){ try { localStorage.setItem(THEME_KEY, v); } catch(e){ /* preference only, never fatal */ } }
(function(){ const s = themeRead() || 'light'; document.documentElement.setAttribute('data-theme', s); syncThemeIcon(s); })();
function toggleTheme(){ const c = document.documentElement.getAttribute('data-theme')||'light'; const n = c==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme', n); themeWrite(n); syncThemeIcon(n); }
function syncThemeIcon(t){ const el = document.querySelector('.theme-toggle'); if (el) el.innerHTML = t==='light' ? '&#9728;' : '&#9790;'; }

// ---------- build currency ----------  [REMOVED]
// a0.31's stale-tab check is gone: the build id, the poll and gap constants, the dismissed flag,
// the server read, the staleness test, the checker, the banner renderer, the visibilitychange
// and focus listeners, and the two timers. Nothing is deployed, so no tab can be running a build
// older than the server's. This block also held the only Date.now() in the file, and the fetch of
// its own pathname, which was the last read that left the page.
//
// The head comment above still carries a0.31's reasoning in full, verbatim. It is the record of a
// real defect and of why the pattern here needed a letter and a first-match-only rule where the
// schedule tool's did not. Keeping the prose costs nothing; keeping the timer would have cost a
// network call every fifteen minutes to a server that is not there.

// ---------- client ----------
// core.js is the seam. Same { data, error } shape the callers already handle, so every call site
// below reads exactly as it did.
const sb = { rpc: core.rpc, auth: core.auth };

// ============================================================
// LOGIN  -  [REMOVED]
// ============================================================
// signIn, signOut, the two keydown listeners and the redirect went with the screen. The auth
// SURFACE survives in core.js and is still exercised below: the session is real, whoami and
// caller_is_admin still run, and admin_checks.cjs still asserts the shape.

// ============================================================
// AUTH ROUTING  -  admin only. Anyone non-admin sees the denied screen.
// ============================================================
// THE GATE IS NOT THE SCREEN. A non-admin fails the caller_is_admin test below and never reaches
// loadAll, so no panel renders and no control exists to click; every write on every panel is
// gated inside core.js besides. The port first replaced the denied screen with a toast, which was
// harmless while nobody but the admin could sign in here. The Viewing as picker made a non-admin
// reachable, so the screen is back, as the original's, with the picker where Sign out was.
let routedFor = null;
sb.auth.onAuthStateChange((_e, session) => {
  if (!session){ routedFor = null; return; }
  if (session.user.id === routedFor) return;
  routedFor = session.user.id; routeAuth(session);
});
async function routeAuth(session){
  try {
    const { data, error } = await sb.rpc('whoami');
    if (error) throw error;
    const me = (data && data.length) ? data[0] : null;
    let admin = false;
    try { const a = await sb.rpc('caller_is_admin'); admin = (a && a.data) === true; } catch(_){ admin = false; }
    if (!me || !admin){
      document.getElementById('deniedEmail').textContent = session.user.email || '';
      showScreen('denied'); return;
    }
    APP.me = me; APP.isAdmin = true;
    document.getElementById('identity').textContent = me.full_name + ' (' + me.code + ')';
    showScreen('app'); loadAll();
  } catch(e){ document.getElementById('deniedEmail').textContent = (e&&e.message)?e.message:'identity check failed'; showScreen('denied'); }
}
// Two screens again: the app and the restored denied screen. The login screen stays removed.
function showScreen(which){
  document.getElementById('denied').style.display = which==='denied' ? 'flex' : 'none';
  document.getElementById('app').style.display    = which==='app' ? 'block' : 'none';
}

// The reset control. Drops the local store, re-seeds, and reloads so every derived view is
// rebuilt from the seed rather than patched.
function resetData(){
  if (!confirm('Discard all local changes and re-seed the bench dataset?')) return;
  core.reset();
  location.reload();
}

// ---------- viewing as ----------
// The stand-in for signing in. Lists everybody in the dataset; the choice goes to core.js, which
// persists it for all three tools and signs the session in as that person. A change reloads the
// page, so routing, reads and every gate run fresh as the new person, the way a sign-in would.
// Identical in queue.html, console.html and sched.html apart from the fallback each passes.
function viewAsFill(fallback){
  const cur = core.viewingAs() || fallback;
  const people = (core.db().people || []).slice().sort((a,b) => a.code.localeCompare(b.code));
  const opts = people.map(p => '<option value="' + esc(p.code) + '"' + (p.code === cur ? ' selected' : '') + '>'
                             + esc(p.code) + ' - ' + esc(p.full_name) + '</option>').join('');
  document.querySelectorAll('select[data-viewas]').forEach(s => { s.innerHTML = opts; });
}
function viewAsChange(code){ core.setViewingAs(code); location.reload(); }

// The bench opens signed in, as whoever Viewing as names. With nobody picked this page falls back
// to core.ADMIN_CODE rather than core.DEFAULT_USER: the default is an ordinary chemist, and the
// console is admin-only, so falling back to them would open the page on its own denied screen.
if (!core.signInDefault(core.ADMIN_CODE)) toast('No such person in the dataset. Reset data to re-seed.');
viewAsFill(core.ADMIN_CODE);

// Say out loud which storage mode is live. Under file:// localStorage throws on access, so the
// store falls back to memory and changes last only for the session - the person looking at the
// page should not have to guess which one they are in.
(function(){
  const st = core.storageState();
  const el = document.getElementById('storeMode');
  if (el) el.textContent = st.mode === 'local'
    ? 'saved in this browser'
    : 'memory only, changes are lost on reload' + (st.why ? ' (' + st.why + ')' : '');
})();

// ============================================================
// DATA LOAD  -  roster + full register (for offboard open-item scan)
// ============================================================
async function loadAll(){
  document.getElementById('view-roster').innerHTML   = '<div class="empty">Loading...</div>';
  document.getElementById('view-products').innerHTML = '<div class="empty">Loading...</div>';
  document.getElementById('view-offboard').innerHTML = '<div class="empty">Loading...</div>';
  document.getElementById('view-tdsetup').innerHTML  = '<div class="empty">Loading...</div>';
  document.getElementById('view-duties').innerHTML   = '<div class="empty">Loading...</div>';
  // Named reads, not inline selects. The lots and lab_reports projections were written out here
  // AND again in the queue, and the two had already drifted: this file was short edited_by and
  // edited_at on BOTH lists. They are core.LOT_COLS and core.LR_COLS now, one declaration, and
  // admin_checks.cjs asserts this call site uses them.
  const [t, l, r, lt, rt, as] = await Promise.all([
    sb.rpc('team_members'),
    core.read('lots'),
    core.read('labReports'),
    core.read('lotTypeValues'),
    core.read('lrTypeValues'),
    sb.rpc('roster_auth_status')
  ]);
  APP.people = (t.data||[]).slice().sort((a,b)=> a.code.localeCompare(b.code));
  APP.authByCode = {};
  ((as && as.data) || []).forEach(x => { APP.authByCode[x.code] = x; });
  APP.lots = l.data||[];
  APP.lrs  = r.data||[];
  APP.lotTypes = lt.data||[];
  APP.lrTypes  = rt.data||[];
  renderRoster(); renderOffboard(); renderEditTab();
  // products + the schedule tool lookups load here; loadTdSetup owns APP.products (with colour +
  // sort_order) and renders both the Products tab and the Schedule setup tab.
  await loadTdSetup();
  // a0.18. After loadTdSetup, not beside it: the assignments table resolves person names through
  // APP.people and duty names through APP.dutyTypes, and rendering before either is loaded prints
  // a table of bare codes that then flickers.
  await loadDuties();
}

// ============================================================
// LOCK STATE  -  copied verbatim from the queue page. Server still enforces.
// open lot  -> reassignable / releasable. frozen/d3pending -> left alone.
// open LR   -> no report_date.
// ============================================================
function sgtYear2(){
  const y = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Singapore', year:'numeric' }).format(new Date());
  return parseInt(y,10) % 100;
}
function lotLocked(lot){
  return lot.frozen
      || (lot.is_use_test && !!lot.d2)
      || (!lot.is_use_test && !!lot.lab_report_number)
      || (!lot.is_use_test && !!lot.experiment_end);
}
function lrLocked(lr){ return !!lr.report_date; }

// Items a person OWNS, split open vs closed.
function ownedSplit(code){
  const openLots   = APP.lots.filter(x => x.reserved_by === code && !lotLocked(x));
  const closedLots = APP.lots.filter(x => x.reserved_by === code &&  lotLocked(x));
  const openLrs    = APP.lrs.filter(x  => x.created_by  === code && !lrLocked(x));
  const closedLrs  = APP.lrs.filter(x  => x.created_by  === code &&  lrLocked(x));
  return { openLots, closedLots, openLrs, closedLrs,
           openCount: openLots.length + openLrs.length,
           closedCount: closedLots.length + closedLrs.length };
}

// ============================================================
// TABS
// ============================================================
// a0.15: was five hand-written lines per tab, so a sixth tab meant editing ten places and the
// list of tabs existed only as a pattern repeated twice. One array now, and adding a tab is one
// string plus its two elements in the markup.
// a0.18 adds one string and two markup elements, which is exactly what the a0.15 refactor was
// for: before it, a seventh tab meant editing ten places.
const TABS = ['roster','products','offboard','edit','tdsetup','duties'];   // the seminar tab [REMOVED]
function switchTab(which){
  APP.activeTab = which;
  TABS.forEach(t => {
    const tab = document.getElementById('tab-' + t), view = document.getElementById('view-' + t);
    if (tab) tab.classList.toggle('active', t === which);
    if (view) view.style.display = (t === which) ? 'block' : 'none';
  });
}

// ============================================================
// ROSTER PANEL
// ============================================================
// a0.27. THE ON-TEAM PREDICATE, and the only place the date is interpreted.
//
// Inclusive: roster_until is their LAST day on the roster, so they are still on it that morning
// and gone the next. The name says the boundary rather than the event for exactly that reason -
// "departed_on" invites an off-by-one every time somebody reads it.
//
// Mirrors the five backend gates verbatim (B3, prod 31/07/26). If this and the server ever
// disagree the console offers actions the database refuses, which is the failure this whole
// build exists to remove, so the shape is copied rather than paraphrased.
//
// String comparison, not Date. sgtToday() emits en-CA, which is yyyy-mm-dd, and a date column
// arrives from PostgREST in the same form; both sort lexicographically as dates. Sliced to 10
// so a timestamp arriving here one day cannot silently compare longer than the boundary.
function onTeam(p){
  if (!p || !p.roster_until) return true;
  return String(p.roster_until).slice(0,10) >= sgtToday();
}
// a0.31. THE SECOND PREDICATE, matching the schedule tool v0.40.0 where the reasoning is written out.
// onTeam cannot separate a trainee arriving from a chemist leaving: posture 2 (inactive, no date)
// and posture 5 (inactive, FUTURE date) are the same row to it. Coming in has no date, going out
// has one, and that is the whole discriminator.
//
// WHY IT IS NEEDED HERE AT ALL, since rosterOptions already tests p.active and posture 5 is
// active=false. Because posture 5 takes TWO clicks today, Deactivate and Set roster end, and until
// the single "Start offboarding" control exists, active=true with a future roster end is reachable
// by hand and every tool reads that as posture 1. Keying on the DATE rather than the flag makes
// the exclusion independent of remembering the second click.
//
// NO DATE COMPARISON, deliberately. Having a roster end at all is the statement. A leaver stops
// being offered new responsibilities from the moment the end is set, not from the day it arrives,
// because the entire point is to stop creating work that will need handing over.
function notLeaving(p){ return !!p && !p.roster_until; }
// The date as it should read on a pill. Future or today = a plan; past = a fact.
function rosterUntilPill(p){
  if (!p || !p.roster_until) return '';
  const d = fmtDateOnly(p.roster_until);
  return onTeam(p) ? '<span class="pill rosterend" title="Last day on the roster, normally the '
                     + 'last day in the lab. On the day after this, every tool drops them with '
                     + 'nothing for you to click.">on roster to ' + esc(d) + '</span>'
                   : '<span class="pill offroster" title="Roster ended. The tools no longer show '
                     + 'or offer them; their name stays on every row they hold.">off roster '
                     + esc(d) + '</span>';
}

// Per-system posture from (on-team, active, effective-login). effective-login means
// people.email joins a non-banned auth.users row. Reads APP.authByCode.
function posture(p){
  const a = APP.authByCode[p.code];
  if (!a) return { tq:{label:'unknown',cls:'out'}, sc:{label:'unknown',cls:'out'}, note:'login status not loaded' };
  const effective = !!a.has_login && !a.banned;
  // a0.27. The DATE outranks everything below it, because all five backend gates now carry it:
  // caller_in_roster() is false past the date, so even the active-agnostic read path refuses and
  // there is no tier left to describe. Tested BEFORE the login, deliberately - a leaver whose
  // login is still live is out of the tools either way, and saying "email matches no login"
  // about someone whose login very much exists would be the wrong sentence next to the warning
  // that is about to tell you to go and delete it.
  if (!onTeam(p)){
    return { tq:{label:'out',cls:'out'}, sc:{label:'out',cls:'out'},
             note:'roster ended ' + fmtDateOnly(p.roster_until) + ', every gate refuses'
                  + (effective ? '. Login is still live: a flag in the demo data, with no account behind it to delete' : '') };
  }
  if (!effective){
    const why = a.banned ? 'login banned' : 'marked as having no login';
    return { tq:{label:'out',cls:'out'}, sc:{label:'out',cls:'out'}, note:why+', cannot use either tool' };
  }
  if (p.active) return { tq:{label:'1 full',cls:'p1'}, sc:{label:'1 full',cls:'p1'}, note:'active member, login live' };
  // the schedule tool posture 2 is not read-only (seminars) and not blocked (the queue): it reads the
  // schedule AND writes its own absences. Same p2 pill; label says what the capability is.
  return { tq:{label:'blocked',cls:'blk'}, sc:{label:'2 +absences',cls:'p2'}, note:'inactive with a live login' };
}

// a0.27. THE INCONSISTENCY MARKER, and it is deliberately a PAIR.
//
// The roster is the page you make the offboarding decision on, and until now it asserted `active`
// and `out` side by side without ever saying those two disagree. That was the state CJR sat in
// from 27/07: login deleted, flag untouched, nothing on the page saying a step was outstanding.
//
// Both directions are flagged because both are half-done, at opposite ends:
//   on team, no date, no live login    somebody who should be working cannot sign in. A leaver
//                                      whose date was never set, a login broken by a reset, or a
//                                      new hire whose people row went in before their login.
//   off team, live login               the leaver whose roster date has passed and whose login is
//                                      still there. The tools already refuse them, so this is not
//                                      an access hole today, but the door is still hanging open
//                                      and the dashboard is the only place it can be shut.
// Neither is ever a steady state. Anything that is always either transient or wrong is worth a
// marker; anything that is sometimes correct is not, which is why `inactive` gets none.
//
// AND NOR DOES A DATE WITH NO LOGIN, which the first cut of this got wrong. Cutting access before
// the last day is the deliberate shape of a bad exit: CJR's login went on 27/07 and his date is
// 10/08, and a warning firing on that for a fortnight is a warning about a decision already made.
// The date being SET is what makes the missing login a choice rather than an oversight, so the
// flag now requires no date at all. A warning people learn to dismiss is worse than no warning,
// and this one would have taught that inside a week.
//
// Returns null when authByCode has nothing for this person: `unknown` already says the RPC has
// not run, and stacking a second unknown-shaped warning on it would be noise about noise.
function inconsistency(p){
  const a = APP.authByCode[p.code];
  if (!a) return null;
  const effective = !!a.has_login && !a.banned;
  const on = onTeam(p);
  if (on && !effective && !p.roster_until) return { label:'no login',
    title:'On the roster with no end date, but marked as having no login. If they have left, '
        + 'set a roster end date. The demo has no real logins: this is a flag in the demo data, '
        + 'and nothing on this screen changes it.' };
  if (!on && effective) return { label:'login live',
    title:'Roster date has passed but they are still marked as having a login. Every tool already '
        + 'refuses them, so this is not an open door into the data. The demo has no real logins: '
        + 'this is a flag in the demo data, with no account behind it to delete.' };
  return null;
}
// The person dropdown for the three a0.17 assignment fields (mentor, instrument owners, role
// owners). Deliberately NOT ownerOptionsAdmin, which drops the admin because a lot owner is a bench
// chemist and the admin is not one. None of that holds here: he mentors Marcus Devlin and is a plausible
// role main, so excluding him would make the console unable to record what is already true.
// Active only, on the reference's rule that a posture-2 member is selectable as a task owner but
// not as an instrument chemist. The exception is whoever is already selected: they stay offered
// even when inactive, so deactivating someone never silently blanks an assignment on next render.
// `exclude` is the self-exclusion for mentor; the CHECK constraint refuses it server-side anyway.
// a0.27: and off-team, which is a SEPARATE test rather than a widening of the active one. A leaver
// under the new model is active=true with a past date, so filtering on active alone would still
// offer them here. The already-selected escape covers both: a departed instrument owner stays
// visible in their own dropdown until you reassign it, rather than the row silently blanking.
function rosterOptions(selected, exclude){
  let o = '<option value=""' + (!selected ? ' selected' : '') + '>(none)</option>';
  APP.people.slice().sort((a,b)=>a.code.localeCompare(b.code)).forEach(p => {
    const c = p.code;
    if (exclude && c === exclude) return;
    if (!p.active && c !== selected) return;
    // a0.31: notLeaving, not onTeam. rosterOptions feeds the mentor, instrument owner, standing
    // role and duty person selectors, and every one of those is an ONGOING responsibility rather
    // than a record of something past. None of them should be offering somebody with a roster end.
    // The selected-escape survives untouched, so an existing holder stays visible and an unrelated
    // edit cannot silently blank them.
    if (!notLeaving(p) && c !== selected) return;
    // THREE STATES, not two. (left) and (inactive) were the whole vocabulary, so posture 5 showed
    // as (inactive) beside a trainee and read identically: the one word that mattered, that this
    // person is on their way out and their roster end is in the future, had nowhere to appear.
    const label = esc(c) + ' - ' + esc(p.full_name)
                + (!onTeam(p) ? ' (left)'
                   : p.roster_until ? ' (leaving ' + fmtDateOnly(p.roster_until) + ')'
                   : (p.active ? '' : ' (inactive)'));
    o += '<option value="' + esc(c) + '"' + (c === selected ? ' selected' : '') + '>' + label + '</option>';
  });
  return o;
}

function renderRoster(){
  const el = document.getElementById('view-roster');
  // a0.27. "8 people, 8 active" read true on 27/07 for a team of seven who could sign in, because
  // the counter knew one lever and the row knew three. On team is the number that answers "who is
  // here"; active is a narrower fact and stays, one place along. The flag count is appended only
  // when it is non-zero, so a clean roster reads as a clean roster rather than as a zero to check.
  const nOn = APP.people.filter(onTeam).length;
  const nFlag = APP.people.filter(p => inconsistency(p)).length;
  let h = '<div class="toolbar"><div class="meta">'+APP.people.length+' people &middot; '
        + nOn+' on team &middot; '
        + APP.people.filter(p=>p.active && onTeam(p)).length+' active'
        + (nFlag ? ' &middot; <span style="color:var(--error);">'+nFlag+' to fix</span>' : '')
        + '</div>'
        + '<button class="btn primary" onclick="openAddPerson()">+ Add person</button></div>';
  const HEAD = '<div class="tablewrap"><table class="data"><thead><tr>'
     + '<th>Code</th><th>Name</th>'
     + '<th style="width:190px;" title="Standing mentor. Changes only when you change it: this is not a training record, it is who this person goes to. Their dashboard shows it as a fact, not a task.">Mentor</th>'
     + '<th>Status</th><th>Queue</th><th>Schedule</th><th>Owns</th><th style="width:230px;">Actions</th>'
     + '</tr></thead><tbody>';
  const rosterRow = p => {
    let h = '';
    const split = ownedSplit(p.code);
    const total = split.openCount + split.closedCount;
    const isMe  = APP.me && p.code === APP.me.code;
    const adminPill = isMe ? '<span class="pill admin">admin</span>' : '';
    // TWO PILLS, NOT ONE MERGED ONE. The first names people.active and keeps naming only that;
    // the second names roster_until. Folding them into a single word would be the console telling
    // you a story about two independent columns, and the whole point of the a0.27 model is that
    // they are independent. The warning is a third and sits with them because it is the thing you
    // act on, and it belongs where the eye already is rather than in a legend.
    const flag = inconsistency(p);
    const status = (p.active
      ? '<span class="pill on">active</span>'
      : '<span class="pill off">inactive</span>')
      + rosterUntilPill(p)
      + (flag ? '<span class="pill warn" title="'+esc(flag.title)+'">'+esc(flag.label)+'</span>' : '');
    const ps = posture(p);
    const ownsTxt = total === 0 ? '<span class="meta" style="margin:0;">none</span>'
      : (split.openCount+' open, '+split.closedCount+' closed');

    // actions
    // a0.27. The roster end date goes FIRST, ahead of deactivate, because it is now the offboarding
    // action and deactivate is not. Deactivate stays for what it always meant: parking somebody
    // who is still here. Never offered on your own row - the RPC refuses it server-side, and a
    // button that exists only to be refused is a worse control than no button.
    let acts = '';
    if (!isMe){
      acts += p.roster_until
        ? '<button class="link" onclick="openRosterUntil(\''+esc(p.code)+'\')" title="Change the last day on the roster">Roster to '+esc(fmtDateOnly(p.roster_until))+'</button>'
          + ' <button class="link" onclick="doClearRosterUntil(\''+esc(p.code)+'\')" title="They are staying after all. Clears the date and returns them to every list.">Clear</button> '
        : '<button class="link" onclick="openRosterUntil(\''+esc(p.code)+'\')" title="Record the last day on the roster, normally their last day in the lab rather than their last day of service. Every tool acts on it by itself from the next morning.">Set roster end</button> ';
    }
    if (p.active){
      // deactivate, blocked for self (also guarded server-side)
      acts += isMe
        ? '<button class="link" disabled title="You cannot deactivate your own account">Deactivate</button>'
        : '<button class="link" onclick="doSetActive(\''+esc(p.code)+'\',false)">Deactivate</button>';
    } else {
      acts += '<button class="link" onclick="doSetActive(\''+esc(p.code)+'\',true)">Reactivate</button>';
    }
    // offboard shortcut when they hold open items
    if (split.openCount > 0){
      // NO COUNT. It was split.openCount, open lots and LRs only, and the tab it opens counts
      // seventeen surfaces: the row read "Offboard (4)" beside a tab reporting 52 live lines. A
      // number that contradicts the screen it links to is worse than no number.
      acts += ' <button class="link" onclick="gotoOffboard(\''+esc(p.code)+'\')">Offboard</button>';
    }
    // remove, only when they own NOTHING and it's not you
    if (total === 0 && !isMe){
      acts += ' <button class="link danger" onclick="confirmRemove(\''+esc(p.code)+'\')">Remove</button>';
    } else if (!isMe && split.closedCount > 0 && split.openCount === 0){
      acts += ' <button class="link" disabled title="Owns closed items (GMP record). Deactivate, do not remove.">Remove</button>';
    }
    h += '<tr class="'+((p.active && onTeam(p))?'':'inactive')+'">'
       + '<td class="code">'+esc(p.code)+adminPill+'</td>'
       + '<td>'+esc(p.full_name)+'</td>'
       + '<td><select class="rowsel" onchange="doSetMentor('+jsq(p.code)+', this.value)">'+rosterOptions(p.mentor||'', p.code)+'</select></td>'
       + '<td>'+status+'</td>'
       + '<td><span class="pill '+ps.tq.cls+'" title="'+esc(ps.note)+'">'+ps.tq.label+'</span></td>'
       + '<td><span class="pill '+ps.sc.cls+'" title="'+esc(ps.note)+'">'+ps.sc.label+'</span></td>'
       + '<td>'+ownsTxt+'</td>'
       + '<td class="actions">'+acts+'</td>'
       + '</tr>';
    return h;
  };

  // TWO TABLES, NOT ONE LIST. Remove can never work on anybody who has closed a lot, signed an LR or
  // delivered a seminar, so leavers accumulate here permanently and the list only ever gets longer.
  // THEY ARE NOT HIDDEN, and that was the argument against dropping them from the screen outright.
  // Clear lives on their row and is the only route from posture 3 back to posture 2. Remove lives
  // there too, for the mis-add case. And the "login live" flag exists precisely to say a roster date
  // has passed with the Supabase account still sitting there, which cannot be read off a row that is
  // not rendered.
  h += HEAD;
  APP.people.filter(onTeam).forEach(p => { h += rosterRow(p); });
  h += '</tbody></table></div>';

  const gone = APP.people.filter(p => !onTeam(p));
  if (gone.length){
    h += '<div class="toolbar"><button class="link" onclick="toggleGone()">'
       + (APP.showGone ? '&#9662; ' : '&#9656; ') + 'Departed (' + gone.length + ')</button>'
       + '<span class="meta">roster end date passed. Still named on every record they hold, permanently.</span></div>';
    if (APP.showGone){
      h += HEAD;
      gone.forEach(p => { h += rosterRow(p); });
      h += '</tbody></table></div>';
    }
  }
  // WHAT EACH BUTTON DOES, first. The note this replaces opened with a concept and never said what
  // any control on the row actually did, so the one thing somebody arrives here wanting to know was
  // six paragraphs down and never stated plainly. The reasoning is still worth keeping, but it is
  // reasoning, and it goes underneath.
  h += '<div class="tablewrap"><table class="data"><thead><tr>'
     + '<th style="width:160px;">Control</th><th>What it does</th></tr></thead><tbody>'
     + '<tr><td class="code">+ Add person</td><td class="wrap">Creates a roster row. It does NOT create a '
     + 'login: the demo has none, and each tool opens already signed in as a fixed person.</td></tr>'
     + '<tr><td class="code">Mentor</td><td class="wrap">Who this person goes to. Standing and static, '
     + 'changed only here. Not a record of a training session, which is what the TRAINING category on '
     + 'the schedule is for. The list offers people who are here, so a departed mentor stays on the '
     + 'rows they hold until you reassign them.</td></tr>'
     + '<tr><td class="code">Set roster end</td><td class="wrap"><b>For somebody who is leaving.</b> '
     + 'Records their last day. From the next morning every tool drops them: no dashboard card, no '
     + 'owner list, no mentor list, no reassign target. <b>They stay on this screen</b> with a pill, '
     + 'and their name stays on every row they already hold. Nothing to remember on the day, the '
     + 'date does the work when it arrives. This is posture 3, and it is not Remove.</td></tr>'
     + '<tr><td class="code">Roster to <i>date</i></td><td class="wrap">The same button once a date is '
     + 'set. Click to change it.</td></tr>'
     + '<tr><td class="code">Clear</td><td class="wrap">They are staying after all. Removes the date and '
     + 'returns them to every list.</td></tr>'
     + '<tr><td class="code">Deactivate</td><td class="wrap"><b>For somebody who is staying</b> but '
     + 'should not write for a while: a trainee, or a long absence. They keep their dashboard card and '
     + 'stay selectable as a task owner, because other people assign work to them. This is posture 2. '
     + '<b>Do not use a roster end date for this.</b> That would take them out of the owner dropdown, '
     + 'and being assignable is the whole reason a trainee is on the roster.</td></tr>'
     + '<tr><td class="code">Reactivate</td><td class="wrap">Undoes Deactivate.</td></tr>'
     + '<tr><td class="code">Offboard</td><td class="wrap">Opens the Offboard tab on this person, which '
     + 'reads everything they hold across all seventeen surfaces and walks the handover.</td></tr>'
     + '<tr><td class="code">Remove</td><td class="wrap">Deletes the roster row entirely. Only available '
     + 'to somebody who owns nothing at all: a mis-add, or a person whose every item was released. '
     + 'Anyone who has ever closed a lot or an LR owns a frozen GMP record and can never be removed. A '
     + 'roster end date is what retires them.</td></tr>'
     + '</tbody></table></div>';

  // THE POSTURES, because "hide" was doing two different jobs and the note was unclear about which.
  // Remove deletes the people row and the person stops existing anywhere including this screen.
  // A roster end date hides nobody from THIS screen: they stay here with a pill. It drops them from
  // the TOOLS. Naming the three postures says that without the word hide appearing at all.
  h += '<div class="note"><b>Three postures, and the two buttons move between them.</b>'
     + '<br><br><b>Posture 1</b>, active with a login. Full read and write. Normal.'
     + '<br><b>Posture 2</b>, inactive with a login. Reads everything, writes nothing except their '
     + 'own absences. <b>Still on every list</b> and still selectable as a task owner, because other '
     + 'people assign work TO them.'
     + '<br><b>Posture 3</b>, roster date passed or no live login. Gone from every list in every '
     + 'tool. Still on THIS screen, with a pill, and still named on every row they already hold.'
     + '<br><br><b>Deactivate moves 1 to 2. A roster end date moves 1 or 2 to 3.</b> '
     + 'A trainee needs posture 2. A trainee is on the roster precisely so that work can be given '
     + 'to them, and posture 2 keeps them in the owner dropdown for exactly that reason. Give a '
     + 'trainee a roster end date instead and they land in posture 3, which takes them out of it, '
     + 'so the one function they are here for stops. Going the other way, using Deactivate on a '
     + 'leaver leaves them in posture 2, which is what put a departed chemist on the dashboard with '
     + 'hours against his name.'
     + '<br><br><b>None of this is Remove.</b> Remove deletes the roster row and the person stops '
     + 'existing anywhere, including here. A roster end date never removes anybody: it retires them, '
     + 'and their name stays on every record they hold, permanently.'
     + '<br><br><b>Which date, and it is not the obvious one.</b> A departure has three: notice, last '
     + 'day in the lab, and last day of service. Only the middle one belongs here, because it is the '
     + 'day they stop being able to do the work. Last day of service is a payroll fact and usually '
     + 'weeks later, so putting it here would leave a departed chemist holding tasks and duties for '
     + 'the whole notice period.'
     + '<br><br><b>Offboarding a leaver is one action here.</b> Set the roster end date. The date shuts '
     + 'every tool. The demo has no login accounts, so there is no account to delete afterwards: '
     + '"login" on this screen is a flag in the demo data.'
     + '<br><br><b>The Queue and Schedule columns</b> are the access each tool grants, worked out from '
     + 'the roster date and the login flag rather than from the active pill. <b>out</b> means they '
     + 'cannot use either: the roster date has passed, or they are marked as having no login. '
     + '<b>unknown</b> means the login status has not loaded.'
     + '<br><br><b>The two red flags.</b> <b>no login</b> means somebody on the roster with no end date '
     + 'cannot sign in: either they have gone and nobody said so, or their login is broken. It goes '
     + 'quiet once a date is set, because cutting access early is a decision rather than an oversight. '
     + '<b>login live</b> means a roster end date has passed and they are still marked as having a login. '
     + 'Neither is ever a correct resting state.</div>';
  el.innerHTML = h;
}

function toggleGone(){ APP.showGone = !APP.showGone; renderRoster(); }
function gotoOffboard(code){ APP.offboardCode = code; switchTab('offboard'); renderOffboard(); }

// ----- add person -----
function openAddPerson(){
  const body = '<div class="modal-title">Add person</div>'
    + '<div class="modal-as">New people are active and non-admin. Admin is not set here: in the demo it comes from the demo data.</div>'
    + '<div class="field"><label>Code (e.g. ABC)</label><input type="text" id="ap_code" autocomplete="off" maxlength="8" style="text-transform:uppercase;"></div>'
    + '<div class="field"><label>Full name</label><input type="text" id="ap_name" autocomplete="off"></div>'
    + '<div class="field"><label>Email (the login + register join key)</label><input type="email" id="ap_email" autocomplete="off" placeholder="name@bench.local"></div>'
    + '<div class="nudge">This creates the roster row only. The demo has no logins to create: each tool opens already signed in as a fixed person.</div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="okBtn" onclick="doAddPerson()">Add</button></div>';
  showModal(body);
  setTimeout(()=>{ const c=document.getElementById('ap_code'); if(c) c.focus(); }, 30);
}
async function doAddPerson(){
  const code  = (document.getElementById('ap_code').value||'').trim().toUpperCase();
  const name  = (document.getElementById('ap_name').value||'').trim();
  const email = (document.getElementById('ap_email').value||'').trim().toLowerCase();
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  errEl.textContent = '';
  if (!code){ errEl.textContent='Code is required.'; return; }
  if (!name){ errEl.textContent='Full name is required.'; return; }
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ errEl.textContent='Enter a valid email.'; return; }
  lockBtn(btn,'Adding...');
  try {
    const { error } = await sb.rpc('add_person', { p_code:code, p_full_name:name, p_email:email });
    if (error) throw error;
    closeModal(); toast('Added '+code);
    await loadAll();
  } catch(e){
    errEl.textContent = friendlyErr(e, 'Could not add the person.');
    if (btn){ btn.disabled=false; btn.textContent = btn.dataset.label || 'Add'; }
  }
}

// ----- activate / deactivate -----
async function doSetActive(code, active){
  try {
    const { error } = await sb.rpc('set_person_active', { p_code:code, p_active:active });
    if (error) throw error;
    toast((active?'Reactivated ':'Deactivated ')+code);
    await loadAll();
  } catch(e){ toastErr(friendlyErr(e, 'Could not change status.')); }
}

// ----- roster end date (a0.27) -----
// A DATE INPUT AND NOT A "MARK AS LEFT" BUTTON. Offboarding starts at notice and the last day is
// usually weeks out, so the useful moment to record it is the day you are told, not the morning it
// happens. A button would mean coming back; a date means the system acts on its own.
//
// Defaults to today when nothing is set, which is the right default for the case this was built
// for: somebody already gone whose date is being recorded after the fact.
//
// No confirm step. It is reversible from the same column, the tooltip on Clear says so, and the
// destructive thing here is not the date but the login delete, which lives in another product.
function openRosterUntil(code){
  const p = APP.people.find(x=>x.code===code);
  if (!p) return;
  const cur = p.roster_until ? String(p.roster_until).slice(0,10) : sgtToday();
  const body = '<div class="modal-title">Roster end date</div>'
    + '<div class="modal-as">'+esc(personLabel(code))+'</div>'
    + '<div class="field"><label>Last day on the roster (inclusive)</label>'
    + '<input type="date" id="ru_date" value="'+esc(cur)+'"></div>'
    + '<div class="nudge">From the morning after this date they leave every dashboard, owner list, '
    + 'mentor list and reassign dropdown across all three tools, and every write gate refuses them. '
    + 'Their name stays on every task, duty, lot and lab report they already hold.</div>'
    + '<div class="nudge"><b>Not the last day of service.</b> This is the last day they should see '
    + 'the tools, which is normally their last day in the lab. A notice period usually runs on past '
    + 'it, and putting the payroll date here would leave them holding work they can no longer do.</div>'
    + '<div class="nudge">The demo has no login accounts, so there is nothing else to delete. If the '
    + 'demo data marks them as having a login, the roster flags it as login live once this date '
    + 'has passed.</div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" id="okBtn" onclick="doSetRosterUntil(\''+esc(code)+'\')">Save</button></div>';
  showModal(body);
  setTimeout(()=>{ const d=document.getElementById('ru_date'); if(d) d.focus(); }, 30);
}
async function doSetRosterUntil(code){
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  const v = (document.getElementById('ru_date').value||'').trim();
  errEl.textContent = '';
  if (!v){ errEl.textContent='Pick a date, or use Clear on the row to remove it.'; return; }
  lockBtn(btn,'Saving...');
  try {
    const { error } = await sb.rpc('set_person_roster_until', { p_code:code, p_until:v });

// PRODUCTS PANEL  -  add / retire / reactivate. Mirrors Roster.
// add_product and retire_product are admin-gated (server) and this page is
// Admin-only. Retire is a soft flag: existing lots/LRs keep their product code,
// the product just drops out of the queue claim dropdowns. Reactivate calls
// add_product again (its on-conflict sets active=true). Product code is the
// only field the app uses; name is not surfaced here.
// ============================================================
function productUse(code){
  const lots = APP.lots.filter(x => x.product === code).length;
  const lrs  = APP.lrs.filter(x  => x.product === code).length;
  return { lots, lrs, total: lots + lrs };
}
function renderProducts(){
  const el = document.getElementById('view-products');
  const list = (APP.products||[]).slice().sort((a,b)=> ((a.sort_order||0)-(b.sort_order||0)) || a.code.localeCompare(b.code));
  let h = '<div class="toolbar"><div class="meta">'+list.length+' products &middot; '
        + list.filter(p=>p.active).length+' active</div>'
        + '<button class="btn primary" onclick="openAddProduct()">+ Add product</button></div>';
  h += '<div class="tablewrap"><table class="data"><thead><tr>'
     + '<th style="width:70px;">Order</th><th>Code</th>'
     + '<th style="width:230px;" title="One hue per product: its campaign, bookings and tasks all draw in it on the Schedule wall">Colour</th>'
     + '<th>In use</th><th>Status</th><th style="width:160px;">Actions</th>'
     + '</tr></thead><tbody>';
  list.forEach(p => {
    const use = productUse(p.code);
    const useTxt = use.total === 0 ? '<span class="meta" style="margin:0;">none</span>'
      : (use.lots+' lot'+(use.lots===1?'':'s')+', '+use.lrs+' LR'+(use.lrs===1?'':'s'));
    const status = p.active
      ? '<span class="pill on">active</span>'
      : '<span class="pill off">retired</span>';
    const acts = p.active
      ? '<button class="link" onclick="retireProduct(\''+esc(p.code)+'\')">Retire</button>'
      : '<button class="link" onclick="reactivateProduct(\''+esc(p.code)+'\')">Reactivate</button>';
    // No colour draws grey on the wall, the true state until a hue is picked; the swatch opens
    // on PROD_DEFAULT so the picker starts somewhere sane, the text says what is real.
    const colour = '<input type="color" class="swatch" value="'+esc(p.colour||PROD_DEFAULT)+'" onchange="setProductColour('+jsq(p.code)+', this.value)">'
      + (p.colour ? '<span class="hex">'+esc(p.colour)+'</span>' + (fillWarn(p.colour)?'<span class="cwarn">'+esc(fillWarn(p.colour))+'</span>':'')
                  : '<span class="cwarn">no colour: draws grey</span>');
    h += '<tr class="'+(p.active?'':'inactive')+'">'
       + '<td>'+ordCell(list, 'code', p.code, 'set_product_order', 'p_codes')+'</td>'
       + '<td class="code">'+esc(p.code)+'</td>'
       + '<td>'+colour+'</td>'
       + '<td>'+useTxt+'</td>'
       + '<td>'+status+'</td>'
       + '<td class="actions">'+acts+'</td>'
       + '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="note"><b>One products list, three tools.</b> Order sets the task-group order on the '
     + 'Schedule wall; colour is the product\'s hue everywhere it appears on the schedule. Add here; '
     + 'retire flags it out of the lot and LR claim dropdowns for new work without touching existing '
     + 'rows, and reactivate brings it back. There is no delete: every lot or LR keeps its code.</div>';
  el.innerHTML = h;
}

// ============================================================
// SCHEDULE SETUP  (a0.7)  -  lifted out of the schedule tool v0.17's Setup tab.
// Same lists, same RPCs. Every RPC below is caller_is_admin-gated on prod, which
// is admin.html's whole-page gate, so no permission changes: this is about where
// the controls live. the schedule tool keeps loadLists() and reads the same lists for
// its grid; this file is the WRITE surface only.
//
// Writes go through tdWrite (admin's toast/friendlyErr idiom) and reload via
// loadTdSetup. the schedule tool's rpc() wrapper also called renderGrid()/runProbe(); neither
// exists here, so live grid recolour on a Setup edit is gone by design - the
// schedule picks up a colour/texture/order change on its next load. products is
// shared with the Products tab, so a write re-renders both.
//
// Dead-column tail (handover 19/07 s8): add_task_status still sends p_colour until
// the admin's merge migration drops task_statuses.colour; remove the arg here when it does.
// ============================================================
const SURFACE = { light:'#ffffff', dark:'#1a1d28' };   // --card in each theme
function lum(hex){
  const n = parseInt(hex.slice(1), 16);
  const f = c => { c /= 255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  return 0.2126*f(n>>16 & 255) + 0.7152*f(n>>8 & 255) + 0.0722*f(n & 255);
}
function fillCheck(hex){
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
  const L = lum(hex), r = s => { const b = lum(SURFACE[s]);
    return (Math.max(L,b) + 0.05) / (Math.min(L,b) + 0.05); };
  const light = r('light'), dark = r('dark');
  return { light, dark, worst: Math.min(light, dark), ok: Math.min(light, dark) >= 3 };
}
function fillWarn(hex){
  const c = fillCheck(hex);
  if (!c || c.ok) return '';
  const which = c.light < c.dark ? 'light' : 'dark';
  return 'faint on the ' + which + ' theme (' + c.worst.toFixed(1) + ':1)';
}

// One write path for every Setup panel: run the RPC, surface its own message
// verbatim on failure (delete refuses with a reference count), re-read the four
// lists, re-render this tab and the Products tab. No optimistic writes: Setup is
// typed once and nothing here is on the speed-critical path.
async function tdWrite(name, args, okMsg){
  try {
    const { error } = await sb.rpc(name, args);
    if (error) throw error;
    if (okMsg) toast(okMsg);
    await loadTdSetup();
    return true;
  } catch(e){ toastErr(friendlyErr(e, 'The write failed.')); return false; }
}

// Re-reads the four lists and re-renders the Setup tab plus the Products tab. This
// is the ONLY loader that shapes the setup arrays, so loadAll calls it too rather
// than querying products a second way (the two would drift). products carries
// colour and sort_order here, which the existing Products tab ignores.
async function loadTdSetup(){
  APP.tdListErr = {};
  // Each spec gains `read`, the name of the core.js registry entry, beside the table key it
  // already carried. The key stays because APP.tdListErr is keyed on it and every error message
  // below names the table; the read name is what the seam actually takes.
  const specs = [
    { key:'task_statuses',  read:'taskStatuses',  field:'taskStatuses',   order:true  },
    { key:'absence_types',  read:'absenceTypes',  field:'absenceTypes',   order:false },
    { key:'instruments',    read:'instruments',   field:'instruments',    order:true  },
    { key:'products',       read:'productsAll',   field:'products',       order:true  },
    { key:'public_holidays',read:'holidaysAll',   field:'publicHolidays', order:false },
    { key:'standing_roles', read:'standingRoles', field:'standingRoles',  order:true  }
  ];
  const res = await Promise.all(specs.map(s => core.read(s.read)));
  specs.forEach((s, i) => {
    const { data, error } = res[i];
    if (error) APP.tdListErr[s.key] = error;
    const rows = data || [];
    rows.sort((a,b) => s.order
      ? ((a.sort_order||0) - (b.sort_order||0)) || String(a.value||a.code).localeCompare(String(b.value||b.code))
      : String(a.value||a.code||a.holiday_date).localeCompare(String(b.value||b.code||b.holiday_date)));
    APP[s.field] = rows;
  });
  renderTdSetup();
  renderProducts();
}
// Bulk reorder, never per-row: one call carries the whole new order, so the table is
// never left in an intermediate inconsistent state. Scope section 11.
function swapped(rows, key, val, dir){
  const i = rows.findIndex(r => r[key] === val), j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return null;
  const out = rows.map(r => r[key]);
  const t = out[i]; out[i] = out[j]; out[j] = t;
  return out;
}
// A JS string literal that is also safe inside a double-quoted HTML attribute. Escape for
// JS first, then HTML-escape the lot: the parser decodes the entities before JS sees them,
// so a value carrying a quote of either kind survives both layers intact.
function jsq(s){ return esc("'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'"); }
function ordCell(rows, key, val, rpcName, argName){
  const i = rows.findIndex(r => r[key] === val);
  const btn = (dir, glyph, dis) => '<button ' + (dis?'disabled':'') + ' onclick="moveRow(' + jsq(rpcName) + ',' + jsq(argName) + ',' + jsq(key) + ',' + jsq(val) + ',' + dir + ')">' + glyph + '</button>';
  return '<div class="ord">' + btn(-1,'&#9650;', i<=0) + btn(1,'&#9660;', i>=rows.length-1) + '</div>';
}
async function moveRow(rpcName, argName, key, val, dir){
  const listKey = rpcName === 'set_task_status_order' ? 'taskStatuses' : rpcName === 'set_instrument_order' ? 'instruments' : 'products';
  const arr = swapped(APP[listKey], key, val, dir);
  if (!arr) return;
  const args = {}; args[argName] = arr;
  await tdWrite(rpcName, args);
}

// a0.20. Bookable is not active. An owner-only item (a balance, a fumehood, the gas generator) is
// in service and has a main and a backup who handle its maintenance and its vendor; what it does
// not have is anyone booking time on it. Switching this off drops its lane from the schedule grid
// and changes nothing else: the owners stay, the maintenance editor still offers it, and the
// Standing tab still lists it under its owner with a "no booking" tag.
// a0.21. Renaming a code moves a PRIMARY KEY. Both child FKs were rebuilt as ON UPDATE CASCADE
// on 25/07/26 (K7), so instrument_bookings and instrument_maintenance follow the key instead of
// refusing it. Before that they were NO ACTION and this was impossible, which is the whole reason
// the block existed. The confirm counts the rows that will move, because "9 bookings follow this"
// is the fact that decides whether you meant it, and the RPC will not surface it.
function askRenameCode(oldCode, newCode, inputEl){
  const revert = () => { if (inputEl) inputEl.value = oldCode; };
  const v = (newCode || '').toUpperCase();
  if (v === oldCode){ revert(); return; }
  if (!v){ toast('A code cannot be blank.'); revert(); return; }
  const clash = (APP.instruments || []).find(x => x.code === v);
  if (clash){ toast('Code ' + v + ' is already used by ' + (clash.name || v) + '.'); revert(); return; }
  const inst = (APP.instruments || []).find(x => x.code === oldCode);
  // No booking count here on purpose. admin.html does not load instrument_bookings or
  // instrument_maintenance, so any number shown would be a guess dressed as a fact, and "nothing
  // references it" is the worst possible guess to get wrong. State the mechanism instead.
  showModal('<div class="modal-title">Rename code</div>'
    + '<div class="modal-as">' + esc(inst ? (inst.name || oldCode) : oldCode) + '</div>'
    + '<div class="note" style="margin-top:0;"><b>' + esc(oldCode) + '</b> becomes <b>' + esc(v) + '</b>.<br>'
    + 'The code is a primary key, not a label. Every booking and maintenance row that points at it '
    + 'is carried across with it, so nothing is orphaned, but there is no undo: rename it back if '
    + 'it was wrong.</div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="cancelRenameCode(' + jsq(oldCode) + ')">Cancel</button>'
    + '<button class="btn primary" id="okBtn" onclick="doRenameCode(' + jsq(oldCode) + ', ' + jsq(v) + ')">Rename</button></div>');
}

// ============================================================
// DUTIES PANEL  (a0.18)
//
// The admin half of Phase 2. Duty TYPES are a lookup like any other; duty ASSIGNMENTS are the
// interesting half, and the reason this is a tab rather than a sixth panel on Schedule setup: a
// paste box and a per-line report do not fit the compact panel-table idiom, and 52 weeks of
// housekeeping is over a hundred rows that would bury the four panels above it.
//
// THE MODEL'S ONE LOAD-BEARING PROPERTY, worth restating where the UI meets it: every assignment
// carries its OWN dates, so nothing here knows that housekeeping is weekly or KYT quarterly.
// There is no rhythm to configure, no recurrence rule, and no generator. Two names on one week
// are two rows. That is what keeps this panel small.
// ============================================================
async function loadDuties(){
  APP.dutyErr = null;
  // a0.26. Absences come from v_grid, not from the absences table. the schedule tool reads this view as an
  // ordinary authenticated roster member, so the policy path is proven; reading the source table
  // from here would be a guess about its RLS. Only the three columns the overlap needs, and only
  // the absence rows: v_grid also carries tasks and maintenance and this is not the place for them.
  // Folded into loadDuties rather than given its own call site because every duty write already
  // ends here, so a swap re-reads the absences that decide whether it resolved anything.
  const [t, a, ab] = await Promise.all([
    core.read('dutyTypes'),
    core.read('dutyAssigns'),
    core.read('gridAbsences')
  ]);
  APP.absences = ab.error ? [] : (ab.data || []);
  APP.absErr   = ab.error || null;
  if (t.error || a.error){ APP.dutyErr = t.error || a.error; APP.dutyTypes = []; APP.duties = []; }
  else {
    APP.dutyTypes = (t.data || []).slice().sort((x,y) => (x.sort_order||0) - (y.sort_order||0)
      || String(x.code).localeCompare(String(y.code)));
    APP.duties = (a.data || []).slice().sort((x,y) => String(x.start_date).localeCompare(String(y.start_date))
      || String(x.duty_type).localeCompare(String(y.duty_type))
      || String(x.person).localeCompare(String(y.person)));
  }
  renderDuties();
}

// Same shape as tdWrite but its own loader, because duties are not one of the five setup lists
// and routing them through loadTdSetup would re-read four tables to refresh one.
async function dutyWrite(name, args, okMsg){
  try {
    const { error } = await sb.rpc(name, args);
    if (error) throw error;
    if (okMsg) toast(okMsg);
    await loadDuties();
    return true;
  } catch(e){ toastErr(friendlyErr(e, 'The write failed.')); return false; }
}

async function addDutyType(){
  const c = document.getElementById('dt_code').value.trim();
  const n = document.getElementById('dt_name').value.trim();
  if (!c){ toast('Give the duty a code.'); return; }
  if (!n){ toast('Give the duty a name.'); return; }
  if (await dutyWrite('add_duty_type', { p_code:c, p_name:n, p_colour:null, p_show_final_days:null },
                      'Duty type added.')){
    document.getElementById('dt_code').value = ''; document.getElementById('dt_name').value = '';
  }
}
// update_duty_type takes the whole row, so an unchanged field is sent back as it was. Same shape
// as pwUpdateParams and for the same reason: a rename must not blank the colour.
function dutyTypeUpdate(code, over){
  const t = (APP.dutyTypes || []).find(x => x.code === code);
  if (!t) return;
  const has = k => Object.prototype.hasOwnProperty.call(over || {}, k);
  dutyWrite('update_duty_type', {
    p_code: code,
    p_name:            has('name')   ? over.name   : t.name,
    p_colour:          has('colour') ? over.colour : t.colour,
    p_show_final_days: has('days')   ? over.days   : t.show_final_days
  }, 'Duty type updated.');
}
function renameDutyType(code, name, was){ if (name === was) return; dutyTypeUpdate(code, { name:name }); }
function setDutyColour(code, col){ dutyTypeUpdate(code, { colour:col }); }
// Blank means "show for the whole period". A number means "show only in the final N days of it".
// One field, because the two are the same fact and a separate mode switch would allow a state
// where a count is set and ignored.
function setDutyFinalDays(code, v){
  const t = String(v || '').trim();
  if (t === ''){ dutyTypeUpdate(code, { days:null }); return; }
  const n = parseInt(t, 10);
  if (!(n > 0)){ toast('Final days must be a whole number above zero, or blank for the whole period.'); return; }
  dutyTypeUpdate(code, { days:n });
}
function setDutyTypeActive(c, a){ dutyWrite('set_duty_type_active', { p_code:c, p_active:a }); }
function delDuty(id){ dutyWrite('delete_duty_assignment', { p_id:id }, 'Assignment removed.'); }

// a0.22. Swapping who holds a period, in place. This is the resolution for an absence clash
// flagged on the schedule tool Standing tab: before it existed the only route was delete then create,
// two writes with a window in between where the period was short a person.
//
// duty_assignments.person is NOT NULL, so the (none) that rosterOptions always offers is not a
// legal value here. Caught before the call rather than after: the RPC would reject it correctly
// but the message would talk about a roster code that does not exist, which is true and unhelpful.
// The RPC still guards the real case, moving somebody onto a period they already hold, because
// duty_assignments_uniq is the only thing that actually knows.
async function setDutyPerson(id, code, was){
  if (code === was) return;
  if (!code){ toast('An assignment needs a person. Remove the row instead.'); renderDuties(); return; }
  if (await dutyWrite('set_duty_assignment_person', { p_id:id, p_person:code },
                      'Swapped to ' + code + '.')){
    renderDuties();
  } else {
    renderDuties();   // put the dropdown back to who actually holds it
  }
}

// ---------- the paste-in import ----------
//
// NON-NEGOTIABLE per the scoping: 52 weeks entered through a form one at a time will not happen,
// and the feature would die unused. So the box is the primary way in and the single-row form
// below it is the exception, not the other way round.
//
// The report is held in APP rather than toasted. A 52-line paste can fail on line 37, and a toast
// is gone before you have found it. It also stays on screen after a SUCCESSFUL import, because
// "14 inserted, 38 already present" is the answer to "did my second paste do anything".
// a0.19: dry is the SAFE default path for a migration. The import refuses to write when any line
// fails, but a paste can be entirely valid and entirely wrong (right shape, wrong year, names in
// the wrong column), and nothing in the schema can tell. Check prints what it WOULD do, line by
// line, against the sheet you are copying from.
async function importDuties(dry){
  const type = document.getElementById('di_type').value;
  const tsv  = document.getElementById('di_tsv').value;
  if (!type){ toast('Pick a duty type.'); return; }
  if (!tsv.trim()){ toast('Paste some rows first.'); return; }
  const btn = document.getElementById(dry ? 'di_chk' : 'di_btn');
  lockBtn(btn, dry ? 'Checking...' : 'Importing...');
  try {
    const { data, error } = await sb.rpc('import_duty_assignments',
      { p_type:type, p_tsv:tsv, p_dry_run: !!dry });
    if (error) throw error;
    APP.dutyImport = data || [];
    APP.dutyImportType = type;
    // Reloading either way. A failed import writes nothing, but a partial view of the table after
    // a refusal is the thing that makes people paste twice.
    await loadDuties();
  } catch(e){
    APP.dutyImport = [{ line_no:0, ok:false, message: friendlyErr(e, 'The import failed.') }];
    APP.dutyImportType = type;
    renderDuties();
  }
  if (btn){ btn.disabled = false; btn.textContent = btn.dataset.label || (dry ? 'Check' : 'Import'); }
}

// Bulk removal, because the import is idempotent and that cuts both ways: re-pasting a corrected
// year ADDS the corrections and leaves the wrong rows in place. Without this, undoing a bad paste
// is a hundred clicks on the row delete. Ranged by START date and by type, so it removes exactly
// what one paste put in.
function confirmBulkDelete(){
  const type = document.getElementById('bd_type').value;
  const from = document.getElementById('bd_from').value;
  const to   = document.getElementById('bd_to').value;
  if (!type){ toast('Pick a duty type.'); return; }
  if (!from || !to){ toast('Both dates are required.'); return; }
  if (to < from){ toast('End is before start.'); return; }
  const n = (APP.duties||[]).filter(d => d.duty_type === type
    && String(d.start_date) >= from && String(d.start_date) <= to).length;
  const t = (APP.dutyTypes||[]).find(x => x.code === type);
  showModal('<div class="modal-title">Remove assignments</div>'
    + '<div class="modal-as">' + esc(t ? t.name : type) + ' &middot; starting '
    + esc(fmtDateOnly(from)) + ' to ' + esc(fmtDateOnly(to)) + '</div>'
    + '<div class="note" style="margin-top:0;">This deletes <b>' + n + '</b> assignment'
    + (n === 1 ? '' : 's') + ' outright. It is ranged on the START date, so it removes exactly what '
    + 'one paste of that period put in. There is no undo; the paste box is the undo.</div>'
    + '<div class="modal-error" id="modalError"></div>'
    + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'
    + '<button class="btn primary" id="okBtn" onclick="doBulkDelete()">Remove ' + n + '</button></div>');
}
async function doBulkDelete(){
  const type = document.getElementById('bd_type').value;
  const from = document.getElementById('bd_from').value;
  const to   = document.getElementById('bd_to').value;
  const errEl = document.getElementById('modalError'), btn = document.getElementById('okBtn');
  errEl.textContent = ''; lockBtn(btn, 'Removing...');
  try {
    const { data, error } = await sb.rpc('delete_duty_assignments',
      { p_type:type, p_from:from, p_to:to });
    if (error) throw error;
    closeModal(); toast((data == null ? 0 : data) + ' assignment(s) removed.');
    await loadDuties();
  } catch(e){
    errEl.textContent = friendlyErr(e, 'Could not remove them.');
    if (btn){ btn.disabled = false; btn.textContent = btn.dataset.label || 'Remove'; }
  }
}

// The round trip. Copy what is actually stored, in the format the paste box accepts, so a year can
// be checked against its source sheet and pasted back after a correction without retyping.
function copyDuties(){
  const rows = {};
  (APP.duties || []).forEach(d => {
    const k = d.duty_type + '|' + d.start_date + '|' + d.end_date;
    (rows[k] = rows[k] || []).push(d.person);
  });
  const keys = Object.keys(rows).sort();
  if (!keys.length){ toast('Nothing to copy.'); return; }
  const out = keys.map(k => { const p = k.split('|');
    return fmtDateOnly(p[1]) + '\t' + fmtDateOnly(p[2]) + '\t' + rows[k].slice().sort().join('\t'); });
  pwCopyText(out.join('\n'), keys.length + ' period(s) copied, one per line');
}
