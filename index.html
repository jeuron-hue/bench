<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bench</title>
<!--
  Bench  |  hub

  NOT PORTED. The three tools were copied byte for byte from their originals and edited in
  place; this file was written for the bench and has no original. It exists because the three
  pages used to link to ../index.html, a hub that lives outside this repo, and a Home button
  pointing at nothing is worse than no Home button. Those links were removed in the ports, so
  this is what replaces them.

  THIN ON PURPOSE. It links the three tools and toggles the theme. It holds no data, loads
  neither seed.js nor core.js, and states nothing about what the tools do -- anything it said
  about them would be a fourth copy of a description that is already in each tool's own head
  comment, free to drift and answerable to nothing.

  The theme block below is byte-identical to the one in the other three pages, THEME_KEY
  included, so a person who picks dark here arrives dark everywhere. It is the one piece of
  this file that is not new.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  /* Same tokens as the three tools, same values, so the hub is not a fourth palette. */
  :root, [data-theme="light"] {
    --bg:#f0f1f4; --bg2:#ffffff; --card:#ffffff; --border:#d0d2da;
    --text:#1a1d28; --text2:#4a4d5a; --muted:#6a6d7a; --accent:#3a6aee;
    --accent-dim:rgba(58,106,238,0.08);
    --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  [data-theme="dark"] {
    --bg:#0c0e14; --bg2:#141720; --card:#1a1d28; --border:#2a2d3a;
    --text:#e2e4ea; --text2:#a0a3b0; --muted:#787b8a; --accent:#4a7cff;
    --accent-dim:rgba(74,124,255,0.10);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;
       line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}

  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
          border-bottom:1px solid var(--border);background:var(--bg2);gap:16px;}
  h1{font-family:var(--font-mono);font-size:16px;font-weight:600;letter-spacing:0.5px;}
  h1 span{color:var(--accent);}
  .theme-toggle{font-size:18px;background:none;border:none;cursor:pointer;color:var(--muted);
                transition:color 0.2s;line-height:1;padding:0;display:inline-flex;align-items:center;}
  .theme-toggle:hover{color:var(--text);}

  .wrap{flex:1;width:100%;max-width:760px;margin:0 auto;padding:48px 24px;}
  .tools{display:grid;gap:12px;}

  /* One row per tool. The whole row is the target, not a link buried in it: a hub with three
     entries has no reason to make anyone aim. */
  a.tool{display:flex;align-items:baseline;gap:14px;text-decoration:none;color:inherit;
         background:var(--card);border:1px solid var(--border);border-radius:8px;
         padding:18px 20px;transition:border-color 0.15s,background 0.15s;}
  a.tool:hover{border-color:var(--accent);background:var(--accent-dim);}
  a.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tool-name{font-family:var(--font-mono);font-size:15px;font-weight:600;}
  .tool-file{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-left:auto;}

  .footer{padding:24px;font-size:11px;color:var(--muted);font-family:var(--font-mono);
          text-align:center;}
  /* The credit line. Same font, size and muted token as the line above it, so it follows the
     theme with no colour of its own; the link is told apart by its underline, not by a hue. */
  .footer .credit{margin-top:4px;}
  .footer a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  .footer a:hover{color:var(--text);}
</style>
</head>
<body>

<div class="header">
  <h1>Bench<span>.</span></h1>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">&#9728;</button>
</div>

<div class="wrap">
  <div class="tools">
    <a class="tool" href="sched.html"><span class="tool-name">Work Schedule</span><span class="tool-file">sched.html</span></a>
    <a class="tool" href="queue.html"><span class="tool-name">Queue Number System</span><span class="tool-file">queue.html</span></a>
    <a class="tool" href="console.html"><span class="tool-name">Admin Console</span><span class="tool-file">console.html</span></a>
  </div>
</div>

<div class="footer">Bench build &middot; local data only
  <div class="credit">© 2026 Gary Chan &middot; <a href="https://github.com/jeuron-hue/bench">Source on GitHub</a></div>
</div>

<script>
function syncThemeIcon(t){ const el = document.querySelector('.theme-toggle'); if (el) el.innerHTML = t==='light' ? '&#9728;' : '&#9790;'; }
const THEME_KEY = 'tdtools-theme';
// Guarded, both ways, and this is the file:// requirement rather than defensive habit. A browser
// may refuse localStorage outright there and THROW on access rather than returning null. This
// block runs before anything else on the page, so an unguarded read takes the whole page down
// before core.js is ever asked for a row: a blank page, no error the user can act on, and a theme
// preference as the cause. core.js already makes this call for the dataset store and reports which
// mode it landed in; the theme is only a preference, so it fails to the default and says nothing.
// Identical in index.html, queue.html, console.html and sched.html. If you change one, change all.
function themeRead(){ try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } }
function themeWrite(v){ try { localStorage.setItem(THEME_KEY, v); } catch(e){ /* preference only, never fatal */ } }
(function(){ const s = themeRead() || 'light'; document.documentElement.setAttribute('data-theme', s); syncThemeIcon(s); })();
function toggleTheme(){ const c = document.documentElement.getAttribute('data-theme')||'light'; const n = c==='light'?'dark':'light'; document.documentElement.setAttribute('data-theme', n); themeWrite(n); syncThemeIcon(n); }
</script>
</body>
</html>
